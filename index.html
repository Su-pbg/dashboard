<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintBakery Product Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F4F6F9;--surface:#FFFFFF;--ink:#172230;--muted:#66768A;--hair:#E4E9F0;
    --accent:#0E7C6E;--accent-soft:#E3F1EE;--ghost:#D8DEE7;--up:#1E9C68;--down:#C85A3F;
    --up-soft:#E6F4EC;--down-soft:#FBEAE4;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'Pretendard',system-ui,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px;margin:0 auto;padding:36px 24px 80px;}
  .top-rule{height:3px;background:var(--accent);border-radius:2px;width:56px;margin-bottom:20px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px;}
  h1{font-size:30px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
  .sub{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin-bottom:24px;flex-wrap:wrap;}
  .tab{padding:11px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab .soon{font-size:10px;color:var(--muted);background:var(--paper);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;margin-left:5px;}
  .controls{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;margin-bottom:20px;}
  .ctrl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .ctrl-row-main{display:grid;grid-template-columns:minmax(0,auto) minmax(0,auto) minmax(0,auto) minmax(0,auto);gap:10px 14px;align-items:end;}
  .ctrl-row-split{justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--hair);min-height:32px;}
  .excl-group{display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .btn-group{display:flex;gap:8px;align-items:center;}
  .ctrl{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .ctrl label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.02em;}
  .ctrl .pair{display:flex;gap:4px;align-items:center;}
  .ctrl .pair>span{font-size:12px;color:var(--muted);line-height:32px;}
  input[type=date]{font-family:var(--mono);font-size:12px;border:1px solid var(--hair);border-radius:7px;padding:0 6px;height:32px;color:var(--ink);background:var(--surface);min-width:0;flex:1 1 0;}
  .ctrl-row>label.excl{padding-bottom:7px;}
  .ctrl.is-off label{color:var(--ghost);}
  .ctrl.is-off .pair>span{color:var(--ghost);}
  input[type=date]:disabled,select:disabled{background:var(--paper);color:var(--ghost);border-color:var(--hair);cursor:not-allowed;}
  .seg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  .seg.b{background:var(--paper);color:var(--muted);}
  .preset-btns{display:flex;gap:5px;flex-wrap:wrap;}
  .ctrl-row-top{padding-top:10px;border-top:1px solid var(--hair);}
  .preset-btns button{font-size:11px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--hair);border-radius:999px;padding:5px 11px;cursor:pointer;}
  .preset-btns button:hover{border-color:var(--accent);color:var(--accent);}
  .preset-btns button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .go{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:0 16px;height:32px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans);}
  .go:hover{opacity:.9;}
  .go-ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent);}
  .excl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);white-space:nowrap;cursor:pointer;}
  .excl input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .state{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px;}
  .spinner{width:26px;height:26px;border:3px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{background:var(--down-soft);color:var(--down);border-radius:10px;padding:16px;font-size:13px;}
  .period-label{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:18px;}
  .period-label b{color:var(--accent);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px;}
  .kpi{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;min-height:118px;}
  .kpi .k-label{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .kpi .k-now{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;}
  .kpi .k-was{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:7px;}
  .delta{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:10px;margin-top:9px;line-height:1.4;}
  .delta.good{color:var(--up);background:var(--up-soft);}.delta.bad{color:var(--down);background:var(--down-soft);}
  h2.sec{font-size:17px;font-weight:700;margin:28px 0 12px;}
  h2.sec:first-of-type{margin-top:0;}
  .sec-desc{font-size:12px;color:var(--muted);margin:-6px 0 12px;line-height:1.6;}
  .card-gap{margin-bottom:14px;}
  .funnel{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px;}
  .stage{margin-bottom:16px;}.stage:last-child{margin-bottom:0;}
  .stage-top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;}
  .stage-name{font-weight:600;}.stage-conv{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .stage-conv b{color:var(--accent);}.stage-conv .w{color:var(--down);}
  .bars{display:grid;gap:4px;}
  .bar-row{display:flex;align-items:center;gap:10px;}.bar-tag{width:22px;font-size:11px;color:var(--muted);text-align:right;}
  .bar-track{flex:1;background:var(--paper);border-radius:6px;height:24px;overflow:hidden;}
  .slotbar-row{display:grid;grid-template-columns:1fr 3fr auto;gap:12px;align-items:center;height:56px;border-bottom:1px solid var(--hair);box-sizing:border-box;}
  .slotbar-row:last-child{border-bottom:0;}
  .slotbar-row>div:first-child{min-width:0;overflow:hidden;}
  .slotbar-name{font-size:13px;font-weight:600;cursor:pointer;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:20px;}
  .slotbar-name:hover{color:var(--accent);}
  .up-txt{color:var(--up);font-weight:700;} .down-txt{color:var(--down);font-weight:700;}
  .slotbar-meta{font-size:11px;color:var(--muted);margin-top:2px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:16px;}
  .slotbar-track{background:var(--paper);border-radius:6px;height:20px;overflow:hidden;position:relative;}
  .slotbar-fill{height:100%;border-radius:6px;transition:width .6s ease;}
  .slotbar-val{font-family:var(--mono);font-size:13px;font-weight:700;text-align:right;white-space:nowrap;min-width:64px;line-height:20px;}
  .slotbar-sub{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;line-height:16px;}
  .section-block{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px;margin-bottom:14px;}
  .section-block-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .section-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .section-block-title{font-size:14px;font-weight:700;color:var(--ink);}
  .section-block-total{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .prod-mini-row{display:flex;align-items:center;gap:10px;padding:6px 0 6px 20px;font-size:12px;}
  .prod-mini-name{flex:1;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prod-mini-track{width:120px;background:var(--paper);border-radius:5px;height:12px;overflow:hidden;}
  .prod-mini-fill{height:100%;border-radius:5px;}
  .prod-mini-val{font-family:var(--mono);color:var(--muted);min-width:70px;text-align:right;}
  .bar-fill{height:100%;border-radius:6px;transition:width .8s ease;}
  .bar-val{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);min-width:72px;text-align:right;flex-shrink:0;}
  .bar-fill.b{background:var(--ghost);color:var(--ink);}.bar-fill.a{background:var(--accent);}
  .pages{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .page{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px;}
  .page-name{font-size:14px;font-weight:700;margin-bottom:12px;}
  .m-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 0;border-top:1px solid var(--hair);align-items:center;}
  .m-row:first-of-type{border-top:none;}.m-label{font-size:13px;}
  .m-vals{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;}.m-vals b{color:var(--ink);}
  .m-delta{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right;min-width:52px;}
  .m-delta.good{color:var(--up);}.m-delta.bad{color:var(--down);}
  table.slot{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-bottom:8px;}
  table.slot th,table.slot td{text-align:left;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--hair);}
  table.slot th{background:var(--paper);color:var(--muted);font-weight:600;font-size:12px;}
  table.slot td.num{font-family:var(--mono);text-align:right;}
  table.slot a{color:var(--accent);text-decoration:none;word-break:break-all;}
  .slot-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .soon-box{background:var(--surface);border:1px dashed var(--hair);border-radius:14px;padding:24px 18px;text-align:center;color:var(--muted);}
  .soon-box b{color:var(--ink);}
  .section-title{font-size:14px;font-weight:700;margin:20px 0 10px;color:var(--ink);}
  .section-title .badge{font-size:11px;color:var(--muted);font-weight:400;}
  
  .chart-hit{cursor:crosshair;}
  #chartTip{position:fixed;z-index:9999;background:#172230;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 6px 20px rgba(0,0,0,.22);white-space:nowrap;}
  #chartTip .tip-label{font-family:var(--mono);font-size:11px;color:#B8C2CF;margin-bottom:4px;}
  #chartTip .tip-row{display:flex;align-items:center;gap:6px;}
  #chartTip .tip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  #chartTip .tip-name{color:#B8C2CF;}
  #chartTip .tip-val{font-family:var(--mono);font-weight:700;margin-left:auto;padding-left:10px;}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px;margin-bottom:14px;}
  .mini-chart{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px;}
  .mini-head{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .mini-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .mini-total{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);}
  @media(max-width:1000px){
    .ctrl-row-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  }
  @media(max-width:1100px){.chart-grid{grid-template-columns:1fr;}}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}.pages,.slot-cols{grid-template-columns:1fr;}}

  /* ===== 모바일 반응형 ===== */
  @media(max-width:640px){
    .wrap{padding:20px 14px 60px;}
    h1{font-size:22px;}
    .sub{font-size:12px;margin-bottom:16px;}
    .tabs{gap:2px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;}
    .tab{padding:9px 11px;font-size:13px;white-space:nowrap;flex-shrink:0;}
    .controls{gap:10px;padding:12px;}
    .ctrl-row{flex-direction:column;align-items:stretch;gap:10px;}
    .ctrl-row-main{grid-template-columns:1fr;}
    .ctrl-row-split{flex-direction:column;align-items:stretch;gap:10px;padding-top:10px;min-height:0;}
    .ctrl-row-top{padding-top:10px;}
    .ctrl-row>label.excl{padding-bottom:0;}
    .excl-group{flex-direction:column;gap:10px;align-items:flex-start;}
    .btn-group{flex-direction:column;width:100%;}
    .ctrl{width:100%;}
    .ctrl .pair{width:100%;}
    .ctrl .pair input[type=date]{flex:1;min-width:0;width:auto;}
    label.excl{width:100%;}
    .go{width:100%;}
    .preset-btns{width:100%;}
    .preset-btns button{flex:1;min-width:64px;text-align:center;}
    .kpis{grid-template-columns:repeat(2,1fr);gap:8px;}
    .kpi{padding:12px;min-height:96px;}
    .kpi .k-now{font-size:18px;}
    h2.sec{font-size:15px;margin:24px 0 10px;}
    .slotbar-row{grid-template-columns:1fr;grid-template-areas:"name" "bar" "val";row-gap:4px;height:auto;padding:10px 0;}
    .slotbar-row>div:first-child{grid-area:name;}
    .slotbar-track{grid-area:bar;}
    .slotbar-row>div:last-child{grid-area:val;display:flex;justify-content:space-between;align-items:baseline;}
    .slotbar-val{min-width:0;}
    .section-block{padding:14px;}
    table.slot{font-size:12px;}
    table.slot th,table.slot td{padding:8px 8px;}
  }
  #authGate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:9999;}
  .authBox{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:36px 32px;width:320px;text-align:center;}
  .authBox p{font-size:13px;color:var(--muted);margin:0 0 16px;}
  .authBox input{width:100%;font-family:var(--mono);font-size:14px;border:1px solid var(--hair);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .authBox button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;}
  .authBox .err{display:none;color:var(--down);font-size:12px;margin-top:8px;background:none;padding:0;}
</style>
</head>
<body>

    <p><b>PrintBakery Product Dashboard</b><br>사내 전용 — 비밀번호를 입력하세요.</p>

<div class="wrap">

  <p class="eyebrow">PrintBakery</p>
  <h1>Product Dashboard</h1>
  <p class="sub">GA4 · cafe24 기반 상시 성과 트래킹</p>

  <div class="tabs" id="tabs"></div>

  <div class="controls">

<script>
// ===== 차트 툴팁 (마우스 올리면 실제 수치 표시) =====
(function(){
  let tipEl=null;
  function ensureTip(){
    if(tipEl) return tipEl;
    tipEl=document.createElement('div');
    tipEl.id='chartTip';
    document.body.appendChild(tipEl);
    return tipEl;
  }
  document.addEventListener('mousemove', (e)=>{
    const hit = e.target.closest ? e.target.closest('.chart-hit') : null;
    if(!hit){ if(tipEl) tipEl.style.opacity='0'; return; }
    const svg = hit.ownerSVGElement || hit.closest('svg');
    if(!svg) return;
    let tips;
    try{ tips = JSON.parse(svg.getAttribute('data-tip')||'[]'); }catch(err){ return; }
    const i = Number(hit.getAttribute('data-i'));
    const t = tips[i];
    if(!t) return;
    const el = ensureTip();
    el.innerHTML = `<div class="tip-label">${t.label}</div>` +
      t.rows.map(r=>`<div class="tip-row"><span class="tip-dot" style="background:${r.c}"></span><span class="tip-name">${r.n}</span><span class="tip-val">${r.v}</span></div>`).join('');
    el.style.opacity='1';
    // 화면 밖으로 나가지 않게 위치 보정
    const pad=14;
    const w=el.offsetWidth, h=el.offsetHeight;
    let left=e.clientX+pad, top=e.clientY-h-pad;
    if(left+w>window.innerWidth-8) left=e.clientX-w-pad;
    if(top<8) top=e.clientY+pad;
    el.style.left=left+'px'; el.style.top=top+'px';
    // 세로 커서선 이동
    const cursor = svg.querySelector('.chart-cursor');
    if(cursor){
      const cx = Number(hit.getAttribute('x')) + Number(hit.getAttribute('width'))/2;
      cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx);
      cursor.setAttribute('opacity','0.25');
    }
  });
  document.addEventListener('mouseleave', ()=>{ if(tipEl) tipEl.style.opacity='0'; });
})();

const WORKER="https://proud-sea-35f9.sugim-386.workers.dev";
const $=(id)=>document.getElementById(id);
const nf=new Intl.NumberFormat('ko-KR');
const fmt=(v)=>nf.format(Math.round(v||0));
const delta=(b,a,lowerIsBetter)=>{const p=b===0?0:((a-b)/b*100);const up=a>=b;return{text:(p>0?'+':'')+p.toFixed(1)+'%',good:lowerIsBetter?!up:up,up};};
// unit별로 "실제 증감분"과 "비율"을 함께 만든 표시 문자열
function diffText(before,after,unit){
  const diff=after-before;
  const sign=diff>0?'+':(diff<0?'':'');
  if(unit==='percent'){
    // 이미 %인 지표는 상대비율(%끼리의 %)이 아니라 %p(포인트) 차이로
    return `${sign}${diff.toFixed(1)}%p`;
  }
  if(unit==='duration'){
    const abs=Math.abs(diff); const m=Math.floor(abs/60), sec=Math.round(abs%60);
    const t=m>0?`${m}:${String(sec).padStart(2,'0')}`:`${sec}초`;
    return `${diff<0?'-':'+'}${t}`;
  }
  if(unit==='decimal') return `${sign}${diff.toFixed(1)}`;
  if(unit==='won') return `${sign}${fmt(diff)}원`;
  return `${sign}${fmt(diff)}`; // count
}

const TABS=[
  {id:'overview',name:'개요',ready:true},
  {id:'revenue',name:'매출',ready:true},

function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(base,n){const d=new Date(base);d.setDate(d.getDate()+n);return d;}
function setRange(s0,e0){$('s').value=s0;$('e').value=e0;}
// 달 단위 프리셋(이번달/지난달)을 눌렀을 때는 비교기간도 "직전 달 전체"로 잡음
let MONTH_MODE=false;
// 기간을 바꿀 때마다 비교 날짜를 '직전 기간'으로 미리 채워줌.
// (사용자가 직접 고치면 그 값이 유지됨 — CMP_TOUCHED 플래그로 판단)
function autoCompare(){
  const s0=new Date($('s').value), e0=new Date($('e').value);
  if(MONTH_MODE){
    // 선택 기간이 속한 달의 "직전 달 전체"(1일~말일)
    const firstOfSelMonth=new Date(s0.getFullYear(), s0.getMonth(), 1);
    const lastOfPrev=addDays(firstOfSelMonth,-1);
    const firstOfPrev=new Date(lastOfPrev.getFullYear(), lastOfPrev.getMonth(), 1);
    $('cs').value=iso(firstOfPrev); $('ce').value=iso(lastOfPrev);
  } else {
    const days=Math.round((e0-s0)/86400000)+1;
    const ce=addDays(s0,-1), cs=addDays(ce,-(days-1));
    $('cs').value=iso(cs); $('ce').value=iso(ce);
  }
}

const WORKER_KEY = 'pbg-secret-key-2026';

function q(extra){
  const cmp=$('cmp').checked;
  const as=$('s').value, ae=$('e').value;
  const bs=cmp?$('cs').value:as, be=cmp?$('ce').value:ae;
  let s=`bs=${bs}&be=${be}&as=${as}&ae=${ae}&key=${encodeURIComponent(WORKER_KEY)}`;
  if(cmp)s+='&cmp=1';
  if($('exclLpoint').checked)s+='&excl=lpoint,lotte,l.point';
  if($('exclBots').checked)s+='&autoExclLowEngagement=1';
  if(extra)s+='&'+extra;
  return s;
}

async function load(){
  const cur=TABS.find(t=>t.id===TAB);
  if(cur && !cur.ready){$('content').innerHTML=`<div class="soon-box"><b>${cur.name}</b> 탭은 준비 중입니다.<br>다음 단계에서 추가됩니다.</div>`;return;}
  if(TAB==='revenue'){ await loadRevenue(); return; }
  if(TAB==='product'){ await loadProductTab(); return; }
  showLoading();
  try{
    const tabParam=(TAB==='acquisition')?'&tab=acquisition':'';
    const r=await fetch(WORKER+'/?'+q()+tabParam,{cache:'no-store'});
    const d=await r.json();
    if(d.error){showErr(d.error);return;}
    if(TAB==='acquisition')renderAcquisition(d);
    else if(TAB==='funnel')renderFunnel(d);
    else await renderOverview(d);
  }catch(e){showErr(String(e));}
}
async function loadProductTab(){
  showLoading();
  try{
    const [r1,r2]=await Promise.all([
      fetch(WORKER+'/?'+q()+'&tab=slotperf',{cache:'no-store'}),
      fetch(WORKER+'/?'+q()+'&tab=slots',{cache:'no-store'}),
    ]);
    const dPerf=await r1.json(), dSlots=await r2.json();
    if(dPerf.error){showErr(dPerf.error);return;}
    if(dSlots.error){showErr(dSlots.error);return;}
    renderProductTab(dPerf,dSlots);
  }catch(e){showErr(String(e));}
}

function fmtByUnit(v,unit){
  if(unit==='percent') return v.toFixed(1)+'%';
  if(unit==='duration'){ const m=Math.floor(v/60), s=Math.round(v%60); return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}초`; }
  if(unit==='decimal') return v.toFixed(1);
  if(unit==='won') return fmt(v)+'원';
  return fmt(v);
}
function kpiHTML(kpis){return '<div class="kpis">'+kpis.map(k=>{const x=delta(k.before,k.after);
  const dt=diffText(k.before,k.after,k.unit);
  const wasLabel = $('cmp').checked ? `${cmpModeLabel()}: ${fmtByUnit(k.before,k.unit)}` : '';
  return `<div class="kpi"><div class="k-label">${k.label}</div><div class="k-now">${fmtByUnit(k.after,k.unit)}</div>
  <div class="delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${dt} <span style="opacity:.7;">(${x.text})</span></div><div class="k-was">${wasLabel}</div></div>`;}).join('')+'</div>';}

function auCard(label,before,after,sub,unit){
  const x=delta(before,after);
  const dt=diffText(before,after,unit);
  const valText = unit==='percent' ? after.toFixed(1)+'%' : fmt(after);
  const wasText = unit==='percent' ? before.toFixed(1)+'%' : fmt(before);
  return `<div class="kpi"><div class="k-label">${label}</div><div class="k-now">${valText}</div>
  <div class="delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${dt} <span style="opacity:.7;">(${x.text})</span></div>
  <div class="k-was">${sub?sub+' · ':''}이전: ${wasText}</div></div>`;
}
let TRAFFIC_CACHE=null;
async function trafficRangeSum(s0,e0){
  if(!TRAFFIC_CACHE){
    try{
      const r=await fetch('./traffic-daily.json',{cache:'no-store'});
      TRAFFIC_CACHE=await r.json();
    }catch(e){ TRAFFIC_CACHE={daily:[]}; }
  }
  const daily=TRAFFIC_CACHE.daily||[];
  const rows=daily.filter(x=>x.date>=s0 && x.date<=e0);
  return { uv: rows.reduce((s,x)=>s+(x.uv||0),0), pv: rows.reduce((s,x)=>s+(x.pv||0),0), hasData: rows.length>0 };
}

async function revenueRangeNet(s0,e0){
  if(!REVENUE_CACHE){
    const r=await fetch('./revenue-daily.json',{cache:'no-store'});
    REVENUE_CACHE=await r.json();
  }
  const daily=REVENUE_CACHE.daily||[];
  return daily.filter(x=>x.date>=s0 && x.date<=e0).reduce((s,x)=>s+x.net,0);
}
async function revenueRangeCount(s0,e0){
  if(!REVENUE_CACHE){
    const r=await fetch('./revenue-daily.json',{cache:'no-store'});
    REVENUE_CACHE=await r.json();
  }
  const daily=REVENUE_CACHE.daily||[];
  return daily.filter(x=>x.date>=s0 && x.date<=e0).reduce((s,x)=>s+(x.count||0),0);
}
async function revenueRangeNewMembers(s0,e0){
  if(!REVENUE_CACHE){
    const r=await fetch('./revenue-daily.json',{cache:'no-store'});
    REVENUE_CACHE=await r.json();
  }
  const daily=REVENUE_CACHE.daily||[];
  return daily.filter(x=>x.date>=s0 && x.date<=e0).reduce((s,x)=>s+(x.newMembers||0),0);
}

function monthKey(dateStr){ return dateStr.slice(0,7); } // 'YYYY-MM-DD' -> 'YYYY-MM'
function aggregateMonthlyRevenue(daily){
  const map={};
  daily.forEach(r=>{
    const mk=monthKey(r.date);
    if(!map[mk]) map[mk]={month:mk, net:0, count:0};
    map[mk].net+=(r.net||0); map[mk].count+=(r.count||0);
  });
  return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month));
}
function growthPct(prev,cur){ return prev? ((cur-prev)/prev*100) : null; }

    <text x="${(px+w/2).toFixed(1)}" y="${(y-7).toFixed(1)}" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" font-family="var(--mono)">${text}</text></g>`;
}
function niceStepOf(r){const raw=r/4;const mag=Math.pow(10,Math.floor(Math.log10(raw)||0));const n=raw/mag;return (n<=1?1:n<=2?2:n<=5?5:10)*mag;}

// ===== 비교선 지원 선그래프: 현재 기간(실선) + 비교 기간(점선) =====
function compareLineChart(labels, curValues, prevValues, color, valueFmt, seriesName, prevLabels){
  const W=920,H=240,padL=58,padR=16,padB=30,padT=28;
  const hasPrev = prevValues && prevValues.length>1;
  const allVals = hasPrev ? curValues.concat(prevValues) : curValues;
  const rawMax=Math.max(...allVals,1), rawMin=Math.min(...allVals,0);
  const step=niceStepOf((rawMax-rawMin)||1);
  const min=Math.floor(rawMin/step)*step, max=Math.ceil(rawMax/step)*step;
  const range=(max-min)||1;
  const n=Math.max(curValues.length, hasPrev?prevValues.length:0);
  const x=(i)=>padL+(W-padL-padR)*(n<=1?0.5:i/(n-1));
  const y=(v)=>H-padB-(H-padB-padT)*((v-min)/range);

  let grid='', yAxis='';
  for(let v=min; v<=max+0.0001; v+=step){
    const yy=y(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#E4E9F0" stroke-width="1"/>`;
    yAxis+=`<text x="${padL-8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="#66768A" text-anchor="end" font-family="var(--mono)">${valueFmt?valueFmt(v):fmt(v)}</text>`;
  }

  const avg = curValues.length ? curValues.reduce((a,b)=>a+b,0)/curValues.length : 0;
  const avgY = y(avg);
  const avgLine = curValues.length>1
    ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}" stroke="#66768A" stroke-width="1.5" stroke-dasharray="5 4"/>`
      + avgPill(padL+6, avgY, '평균 '+(valueFmt?valueFmt(avg):fmt(Math.round(avg))), W, padR)
    : '';

  const mkPath=(vals)=>vals.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const curPath=mkPath(curValues);
  const area=curValues.length>1 ? curPath+` L${x(curValues.length-1).toFixed(1)},${H-padB} L${x(0).toFixed(1)},${H-padB} Z` : '';
  const prevPath = hasPrev ? `<path d="${mkPath(prevValues)}" fill="none" stroke="#98A4B4" stroke-width="2" stroke-dasharray="6 4"/>` : '';
  const dots=curValues.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color}"/>`).join('');

  const lstep=Math.max(1,Math.ceil(labels.length/9));
  const labelEls=labels.map((lb,i)=>(i%lstep===0||i===labels.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="11" fill="#66768A" text-anchor="middle" font-family="var(--mono)">${lb}</text>`:'').join('');

  const legend = hasPrev ? `<g font-size="11" font-family="var(--sans)">
    <line x1="${padL}" y1="${padT-16}" x2="${padL+18}" y2="${padT-16}" stroke="${color}" stroke-width="2.5"/>
    <text x="${padL+24}" y="${padT-12}" fill="#172230">선택 기간</text>
    <line x1="${padL+96}" y1="${padT-16}" x2="${padL+114}" y2="${padT-16}" stroke="#98A4B4" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${padL+120}" y="${padT-12}" fill="#66768A">비교 기간</text></g>` : '';

  // 마우스 감지 영역 + 툴팁 데이터
  const tips=labels.map((lb,i)=>{
    const rows=[{n:'선택', v:(valueFmt?valueFmt(curValues[i]):fmt(curValues[i])), c:color}];
    if(hasPrev && prevValues[i]!=null) rows.push({n:'비교', v:(valueFmt?valueFmt(prevValues[i]):fmt(prevValues[i])), c:'#98A4B4'});
    return {label:(prevLabels&&prevLabels[i])? `${lb}  (비교: ${prevLabels[i]})` : lb, rows};
  });
  const bandW=(W-padL-padR)/Math.max(1,n);
  const hits=labels.map((lb,i)=>`<rect class="chart-hit" data-i="${i}" x="${(x(i)-bandW/2).toFixed(1)}" y="${padT}" width="${bandW.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>`).join('');

  return `<svg class="chart-svg" ${tipAttr(tips)} viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}${yAxis}${legend}
    ${area?`<path d="${area}" fill="${color}" opacity="0.10"/>`:''}
    ${avgLine}${prevPath}
    <path d="${curPath}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}${labelEls}
    <line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="#172230" stroke-width="1" opacity="0"/>
    ${hits}
  </svg>`;
}

// 두 지표를 한 차트에 겹쳐 그리기 (예: 매출액 vs 환불액)
// 스케일 차이가 크면 오른쪽에 별도 축을 써서 둘 다 흐름이 보이게 함
function dualLineChart(labels, seriesA, seriesB, valueFmt){
  const W=920,H=240,padL=58,padR=64,padB=30,padT=28;
  const scaleOf=(vals)=>{const rawMax=Math.max(...vals,1);const step=niceStepOf(rawMax||1);return {step,max:Math.ceil(rawMax/step)*step||1};};
  const sa=scaleOf(seriesA.values), sb=scaleOf(seriesB.values);
  const separate = sa.max > sb.max*4;
  const x=(i)=>padL+(W-padL-padR)*(labels.length<=1?0.5:i/(labels.length-1));
  const yA=(v)=>H-padB-(H-padB-padT)*(v/sa.max);
  const yB=(v)=>H-padB-(H-padB-padT)*(v/(separate?sb.max:sa.max));

  let grid='', yAxisL='', yAxisR='';
  for(let v=0; v<=sa.max+0.0001; v+=sa.step){
    const yy=yA(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#E4E9F0" stroke-width="1"/>`;
    yAxisL+=`<text x="${padL-8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="${seriesA.color}" text-anchor="end" font-family="var(--mono)">${valueFmt(v)}</text>`;
  }
  if(separate){
    for(let v=0; v<=sb.max+0.0001; v+=sb.step){
      const yy=yB(v).toFixed(1);
      yAxisR+=`<text x="${W-padR+8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="${seriesB.color}" text-anchor="start" font-family="var(--mono)">${valueFmt(v)}</text>`;
    }
  }
  const mk=(vals,yf,color)=>{
    const path=vals.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${yf(v).toFixed(1)}`).join(' ');
    const dots=vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yf(v).toFixed(1)}" r="3" fill="${color}"/>`).join('');
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>${dots}`;
  };
  const lstep=Math.max(1,Math.ceil(labels.length/9));
  const labelEls=labels.map((lb,i)=>(i%lstep===0||i===labels.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="11" fill="#66768A" text-anchor="middle" font-family="var(--mono)">${lb}</text>`:'').join('');
  const legend=`<g font-size="11" font-family="var(--sans)">
    <circle cx="${padL+6}" cy="${padT-16}" r="4" fill="${seriesA.color}"/>
    <text x="${padL+16}" y="${padT-12}" fill="#172230">${seriesA.name}</text>
    <circle cx="${padL+120}" cy="${padT-16}" r="4" fill="${seriesB.color}"/>
    <text x="${padL+130}" y="${padT-12}" fill="#172230">${seriesB.name}${separate?' (오른쪽 축)':''}</text></g>`;

  const tips=labels.map((lb,i)=>({label:lb, rows:[
    {n:seriesA.name, v:valueFmt(seriesA.values[i]), c:seriesA.color},
    {n:seriesB.name, v:valueFmt(seriesB.values[i]), c:seriesB.color},
  ]}));
  const bandW=(W-padL-padR)/Math.max(1,labels.length);
  const hits=labels.map((lb,i)=>`<rect class="chart-hit" data-i="${i}" x="${(x(i)-bandW/2).toFixed(1)}" y="${padT}" width="${bandW.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>`).join('');

  return `<svg class="chart-svg" ${tipAttr(tips)} viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}${yAxisL}${yAxisR}${legend}
    ${mk(seriesA.values, yA, seriesA.color)}
    ${mk(seriesB.values, yB, seriesB.color)}
    ${labelEls}
    <line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="#172230" stroke-width="1" opacity="0"/>
    ${hits}
  </svg>`;
}

// 세로 막대그래프 (일별 건수 등 이산적인 값에 적합)
function verticalBarChart(labels, values, color, valueFmt){
  const W=920,H=220,padL=58,padR=16,padB=30,padT=18;
  const rawMax=Math.max(...values,1);
  const step=niceStepOf(rawMax||1);
  const max=Math.ceil(rawMax/step)*step || 1;
  const innerW=W-padL-padR;
  const bw=Math.max(2, Math.min(28, innerW/values.length*0.62));
  const x=(i)=>padL+innerW*(values.length<=1?0.5:(i+0.5)/values.length);
  const y=(v)=>H-padB-(H-padB-padT)*(v/max);

  let grid='', yAxis='';
  for(let v=0; v<=max+0.0001; v+=step){
    const yy=y(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#E4E9F0" stroke-width="1"/>`;
    yAxis+=`<text x="${padL-8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="#66768A" text-anchor="end" font-family="var(--mono)">${valueFmt?valueFmt(v):fmt(v)}</text>`;
  }
  const bars=values.map((v,i)=>{
    const h=Math.max(0,(H-padB)-y(v));
    return `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}"/>`;
  }).join('');
  const avg = values.length ? values.reduce((a,b)=>a+b,0)/values.length : 0;
  const avgY = y(avg);
  const avgLine = values.length>1
    ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}" stroke="#66768A" stroke-width="1.5" stroke-dasharray="5 4"/>`
      + avgPill(padL+6, avgY, '평균 '+(valueFmt?valueFmt(avg):fmt(Math.round(avg))), W, padR)
    : '';
  const lstep=Math.max(1,Math.ceil(labels.length/9));
  const labelEls=labels.map((lb,i)=>(i%lstep===0||i===labels.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="11" fill="#66768A" text-anchor="middle" font-family="var(--mono)">${lb}</text>`:'').join('');

  const tips=labels.map((lb,i)=>({label:lb, rows:[{n:'값', v:(valueFmt?valueFmt(values[i]):fmt(values[i])), c:color}]}));
  const bandW=innerW/Math.max(1,values.length);
  const hits=labels.map((lb,i)=>`<rect class="chart-hit" data-i="${i}" x="${(x(i)-bandW/2).toFixed(1)}" y="${padT}" width="${bandW.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>`).join('');

  return `<svg class="chart-svg" ${tipAttr(tips)} viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}${yAxis}${bars}${avgLine}${labelEls}
    <line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="#172230" stroke-width="1" opacity="0"/>
    ${hits}
  </svg>`;
}

function won(v){ return fmt(v)+'원'; }
// 금액 축 라벨: 만 단위가 커지면 억으로 (60000만 → 6억)
function wonAxis(v){
  const a=Math.abs(v);
  if(a>=100000000) return (v/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(a>=10000) return Math.round(v/10000)+'만';
  return fmt(Math.round(v));
}
let REVENUE_CACHE=null;

// ===== 최상단 핵심 그래프: 매출 / 방문 / 구매 (최근 30일) =====
async function loadHeroCharts(){
  const wrap=document.getElementById('heroWrap');
  if(!wrap) return;
  try{
    // 상단에서 고른 기간을 그대로 사용 + 비교 켜져 있으면 비교 기간도 같이
    const as=$('s').value, ae=$('e').value;
    const cmpOn=$('cmp').checked;
    const cs=$('cs').value, ce=$('ce').value;

    const exclQS = ($('exclLpoint').checked ? '&excl=lpoint,lotte,l.point' : '')
                 + ($('exclBots').checked ? '&autoExclLowEngagement=1' : '');
    const fetchGA=async(s0,e0)=>{
      try{
        const url=WORKER+`/?bs=${s0}&be=${e0}&as=${s0}&ae=${e0}&tab=daily&key=${encodeURIComponent(WORKER_KEY)}`+exclQS;
        const r=await fetch(url,{cache:'no-store'});
        const dd=await r.json();
        return dd.daily||[];
      }catch(e){ return []; }
    };

    // GA4: 선택 기간(+비교 기간)
    const [gaCur, gaPrev] = await Promise.all([ fetchGA(as,ae), cmpOn? fetchGA(cs,ce) : Promise.resolve([]) ]);

    // 매출: 캐시에서 두 기간 잘라 씀
    let revCur=[], revPrev=[];
    try{
      if(!REVENUE_CACHE){
        const rr=await fetch('./revenue-daily.json',{cache:'no-store'});
        REVENUE_CACHE=await rr.json();
      }
      const all=REVENUE_CACHE.daily||[];
      const cut=(s0,e0)=>all.filter(d=>d.date>=s0 && d.date<=e0).sort((a,b)=>a.date.localeCompare(b.date));
      revCur=cut(as,ae);
      if(cmpOn) revPrev=cut(cs,ce);
    }catch(e){ /* 매출 실패해도 GA4는 보여줌 */ }

    const cards=[];
    const mdLabel=(d)=>d.slice(5).replace('-','/');          // 'YYYY-MM-DD' → 'MM/DD'
    const gaLabel=(d)=>d.slice(4,6)+'/'+d.slice(6,8);         // 'YYYYMMDD' → 'MM/DD'

    if(revCur.length>1){
      const labels=revCur.map(r=>mdLabel(r.date));
      const prevLabels=revPrev.length? revPrev.map(r=>mdLabel(r.date)) : null;
      const cur=revCur.map(r=>r.net);
      const prev=revPrev.length? revPrev.map(r=>r.net) : null;
      cards.push({title:'매출총액', total:won(cur.reduce((a,b)=>a+b,0)), color:'#0E7C6E',
        svg: compareLineChart(labels, cur, prev, '#0E7C6E', v=>wonAxis(v), '매출총액', prevLabels)});
    }
    if(gaCur.length>1){
      const labels=gaCur.map(r=>gaLabel(r.date));
      const prevLabels=gaPrev.length? gaPrev.map(r=>gaLabel(r.date)) : null;
      const sess=gaCur.map(r=>r.sessions||0);
      const sessPrev=gaPrev.length? gaPrev.map(r=>r.sessions||0) : null;
      cards.push({title:'방문(세션)', total:fmt(sess.reduce((a,b)=>a+b,0)), color:'#2B7DB8',
        svg: compareLineChart(labels, sess, sessPrev, '#2B7DB8', v=>fmt(Math.round(v)), '세션', prevLabels)});
      const purch=gaCur.map(r=>r.purchase||0);
      const purchPrev=gaPrev.length? gaPrev.map(r=>r.purchase||0) : null;
      cards.push({title:'구매 건수', total:fmt(purch.reduce((a,b)=>a+b,0))+'건', color:'#7A3FC8',
        svg: compareLineChart(labels, purch, purchPrev, '#7A3FC8', v=>fmt(Math.round(v)), '구매', prevLabels)});
    }

    if(!cards.length){
      wrap.innerHTML='<div class="funnel"><div class="state">선택한 기간이 하루라 추이가 그려지지 않아요. 기간을 2일 이상으로 넓혀보세요.</div></div>';
      return;
    }
    wrap.innerHTML = cards.map(c=>
      `<div class="funnel card-gap">
        <div class="mini-head"><span class="mini-dot" style="background:${c.color}"></span>${c.title}
          <span class="mini-total">${c.total}</span></div>
        ${c.svg}
      </div>`).join('');
  }catch(e){
    wrap.innerHTML='<div class="funnel"><div class="state">핵심 지표를 불러오지 못했습니다</div></div>';
  }
}

      h+=`<div class="kpi"><div class="k-label">최근 완료월 매출</div><div class="k-now">${fmt(last.net)}원</div><div class="k-was">${last.month}</div></div>`;
      h+=`<div class="kpi"><div class="k-label">전월 대비(MoM)</div><div class="k-now">${mom!=null?(mom>=0?'+':'')+mom.toFixed(1)+'%':'-'}</div><div class="k-was">${prev.month}: ${fmt(prev.net)}원</div></div>`;
      h+=`<div class="kpi"><div class="k-label">전년 동월 대비(YoY)</div><div class="k-now">${yoy!=null?(yoy>=0?'+':'')+yoy.toFixed(1)+'%':'데이터 부족'}</div><div class="k-was">${yoyMonth?yoyMonth.month+': '+fmt(yoyMonth.net)+'원':'작년 동월 기록 없음'}</div></div>`;
      h+='</div>';

      const last12=monthly.slice(-12);
      h+='<div class="section-title">월별 매출 추이 (최근 '+last12.length+'개월)</div>';
      h+='<div class="funnel">'+miniLineChart(last12.map(m=>m.month.slice(5)), last12.map(m=>m.net), '#0E7C6E', v=>wonAxis(v))+'</div>';

      // 객단가(AOV) 추이
      const aovMonthly=last12.map(m=>m.count? Math.round(m.net/m.count):0);
      h+='<div class="section-title">월별 객단가(AOV) 추이</div>';
      h+='<div class="funnel">'+miniLineChart(last12.map(m=>m.month.slice(5)), aovMonthly, '#C8993F', v=>fmt(v))+'</div>';
    } else {
      h+='<div class="state">매출 데이터가 아직 충분하지 않습니다 (최소 2개월 필요)</div>';
    }
  }catch(e){ h+='<div class="state">매출 성장 지표를 불러오지 못했습니다</div>'; }

  // 2) 월별 MAU 추이
  try{
    const r=await fetch(WORKER+'/?'+q()+'&tab=monthlyusers',{cache:'no-store'});
    const dd=await r.json();
    if(dd.monthly && dd.monthly.length){
      const labels=dd.monthly.map(m=>m.month.slice(4)); // 'YYYYMM' -> 'MM'
      const values=dd.monthly.map(m=>m.activeUsers);
      const lastM=dd.monthly[dd.monthly.length-1], prevM=dd.monthly[dd.monthly.length-2];
      const momMau=prevM? growthPct(prevM.activeUsers,lastM.activeUsers):null;
      h+='<div class="section-title">월별 MAU 추이 <span class="badge">'+(momMau!=null?('전월대비 '+(momMau>=0?'+':'')+momMau.toFixed(1)+'%'):'')+'</span></div>';
      h+='<div class="funnel">'+miniLineChart(labels, values, '#2B7DB8', v=>fmt(v))+'</div>';
    }
  }catch(e){ h+='<div class="state">MAU 추이를 불러오지 못했습니다</div>'; }

  // 3) 리텐션 곡선 (Day 0~30)
  try{
    const r2=await fetch(WORKER+'/?'+q()+'&tab=retention',{cache:'no-store'});
    const dd2=await r2.json();
    if(dd2.error){
      h+='<div class="state" style="margin-top:22px;">리텐션 곡선을 불러오지 못했습니다: '+dd2.error+'</div>';
    } else if(dd2.points && dd2.points.length){
      const labels=dd2.points.map(p=>'D'+p.day);
      const values=dd2.points.map(p=>p.retention);
      const d1=dd2.points.find(p=>p.day===1), d7=dd2.points.find(p=>p.day===7), d30=dd2.points.find(p=>p.day===30);
      h+='<div class="section-title">리텐션 곡선 (최근 신규 유입 코호트, Day 0~30)</div>';
      h+='<p class="sec-desc">처음 방문한 사람들 중, N일 후에도 다시 온 비율(%)</p>';
      h+='<div class="kpis">';
      h+=`<div class="kpi"><div class="k-label">Day 1 잔존율</div><div class="k-now">${d1?d1.retention.toFixed(1)+'%':'-'}</div></div>`;
      h+=`<div class="kpi"><div class="k-label">Day 7 잔존율</div><div class="k-now">${d7?d7.retention.toFixed(1)+'%':'-'}</div></div>`;
      h+=`<div class="kpi"><div class="k-label">Day 30 잔존율</div><div class="k-now">${d30?d30.retention.toFixed(1)+'%':'-'}</div></div>`;
      h+='</div>';
      h+='<div class="funnel" style="margin-top:12px;">'+miniLineChart(labels, values, '#7A3FC8', v=>v.toFixed(1)+'%')+'</div>';
    } else {
      h+='<div class="state" style="margin-top:22px;">리텐션 데이터 없음</div>';
    }
  }catch(e){ h+='<div class="state" style="margin-top:22px;">리텐션 곡선을 불러오지 못했습니다</div>'; }

  document.getElementById('growthWrap').innerHTML = h;
}

function segBarBlock(title, rows, color, prevRows){
  if(!rows || !rows.length) return `<div class="section-block"><div class="section-block-head"><span class="section-block-title">${title}</span></div><div class="state">데이터 없음</div></div>`;
  const cmpOn=$('cmp').checked && prevRows && prevRows.length;
  const prevMap={}; if(cmpOn) prevRows.forEach(p=>prevMap[p.label]=p);
  const maxV=Math.max(...rows.map(r=>r.sessions),1);
  let h=`<div class="section-block"><div class="section-block-head"><span class="section-dot" style="background:${color};"></span><span class="section-block-title">${title}</span></div>`;
  h+=rows.map(r=>{
    const w=Math.max(r.sessions/maxV*100,4);
    let cmpHtml='';
    if(cmpOn){
      const p=prevMap[r.label];
      const pv=p?p.sessions:0;
      const dv=delta(pv, r.sessions);
      cmpHtml=`<div class="slotbar-meta">비교 ${fmt(pv)} <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span>${p?` · 전환 ${p.convRate.toFixed(2)}% → <b>${r.convRate.toFixed(2)}%</b>`:''}</div>`;
    }
    return `<div class="slotbar-row">
      <div><span class="slotbar-name" style="cursor:default;">${r.label}</span><div class="slotbar-meta">참여율 ${r.engagementRate.toFixed(1)}% · 평균 ${fmtDwell(r.avgDuration)} · 구매전환 ${r.convRate.toFixed(2)}%</div>${cmpHtml}</div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${color};"></div></div>
      <div><div class="slotbar-val">${fmt(r.sessions)}</div><div class="slotbar-sub">세션</div></div>
    </div>`;
  }).join('');
  h+='</div>';
  return h;
}

function drawChart(daily, dailyPrev){

// 요일별 평균: 이커머스는 요일 효과가 커서, 어느 요일이 강한지 보면 프로모션 요일 정할 때 씀
const DOW_NAMES=['일','월','화','수','목','금','토'];
function drawDayOfWeek(daily){
  const box=document.getElementById('dowWrap'); if(!box) return;
  if(!daily || daily.length<7){ box.innerHTML=''; return; }
  const buckets=DOW_NAMES.map(()=>({sessions:0, purchase:0, n:0}));
  daily.forEach(d=>{
    // date는 'YYYYMMDD' 형식
    const y=Number(d.date.slice(0,4)), m=Number(d.date.slice(4,6)), dd=Number(d.date.slice(6,8));
    const dow=new Date(Date.UTC(y, m-1, dd)).getUTCDay();
    buckets[dow].sessions += (d.sessions||0);
    buckets[dow].purchase += (d.purchase||0);
    buckets[dow].n++;
  });
  const avgSessions=buckets.map(b=>b.n?Math.round(b.sessions/b.n):0);
  const avgPurchase=buckets.map(b=>b.n?Number((b.purchase/b.n).toFixed(1)):0);
  const hasData=avgSessions.some(v=>v>0);
  if(!hasData){ box.innerHTML=''; return; }
  let h='<div class="section-title">요일별 평균</div>';
  h+='<p class="sec-desc">같은 요일들의 평균값 · 어느 요일이 강한지 보면 프로모션·발송 요일 정할 때 참고돼요.</p>';
  h+='<div class="chart-grid">';
  h+='<div class="mini-chart"><div class="mini-head"><span class="mini-dot" style="background:#0E7C6E"></span>요일별 평균 세션</div>'
    + verticalBarChart(DOW_NAMES, avgSessions, '#0E7C6E', v=>fmt(Math.round(v))) + '</div>';
  h+='<div class="mini-chart"><div class="mini-head"><span class="mini-dot" style="background:#7A3FC8"></span>요일별 평균 구매</div>'
    + verticalBarChart(DOW_NAMES, avgPurchase, '#7A3FC8', v=>String(Math.round(v*10)/10)) + '</div>';
  h+='</div>';
  box.innerHTML=h;
}
function renderMini(s,daily){
  const box=document.getElementById('mini-'+s.key); if(!box) return;
  const W=460,H=220,padL=52,padR=14,padB=28,padT=18;
  const vals=daily.map(d=>d[s.key]||0);
  const rawMax=Math.max(...vals,1);
  const niceStep=(r)=>{const raw=r/4;const mag=Math.pow(10,Math.floor(Math.log10(raw)||0));const n=raw/mag;return (n<=1?1:n<=2?2:n<=5?5:10)*mag;};
  const step=niceStep(rawMax);
  const max=Math.ceil(rawMax/step)*step||1;
  const x=(i)=>padL+(W-padL-padR)*(daily.length<=1?0.5:i/(daily.length-1));
  const y=(v)=>H-padB-(H-padB-padT)*(v/max);
  const dt=(d)=>d.date.slice(4,6)+'/'+d.date.slice(6,8);

  let grid='', yAxis='';
  for(let v=0; v<=max+0.0001; v+=step){
    const yy=y(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#E4E9F0" stroke-width="1"/>`;
    yAxis+=`<text x="${padL-6}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="#66768A" text-anchor="end" font-family="var(--mono)">${fmt(v)}</text>`;
  }

  if(daily.length===1){
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">${grid}${yAxis}
      <circle cx="${x(0).toFixed(1)}" cy="${y(vals[0]).toFixed(1)}" r="4" fill="${s.color}"><title>${dt(daily[0])} · ${fmt(vals[0])}</title></circle>
      <text x="${x(0).toFixed(1)}" y="${H-9}" font-size="11" fill="#66768A" text-anchor="middle" font-family="var(--mono)">${dt(daily[0])}</text>
    </svg>`;
    return;
  }

  const path=daily.map((d,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(d[s.key]||0).toFixed(1)}`).join(' ');
  const area=path+` L${x(daily.length-1).toFixed(1)},${H-padB} L${x(0).toFixed(1)},${H-padB} Z`;
  const dots=daily.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d[s.key]||0).toFixed(1)}" r="3.5" fill="${s.color}"><title>${dt(d)} · ${fmt(d[s.key]||0)}</title></circle>`).join('');
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const avgY = y(avg).toFixed(1);
  const avgLine = `<line x1="${padL}" y1="${avgY}" x2="${W-padR}" y2="${avgY}" stroke="#66768A" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${padL+6}" y="${(Number(avgY)-7).toFixed(1)}" font-size="11" fill="#66768A" text-anchor="start" font-family="var(--mono)">평균 ${fmt(Math.round(avg))}</text>`;
  const lstep=Math.max(1,Math.ceil(daily.length/7));
  const labelEls=daily.map((d,i)=>(i%lstep===0||i===daily.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-9}" font-size="11" fill="#66768A" text-anchor="middle" font-family="var(--mono)">${dt(d)}</text>`:'').join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">${grid}${yAxis}
    <path d="${area}" fill="${s.color}" opacity="0.10"/>
    ${avgLine}
    <path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5"/>
    ${dots}${labelEls}
  </svg>`;
}

function renderFunnel(d){
  const cmpOn = $('cmp').checked;
  let h=periodLabel(d);
  h+='<h2 class="sec">구매 전환 퍼널</h2>';
  h+='<p class="sec-desc">각 단계 통과율 · 상품조회는 한 방문에서 여러 상품을 보므로 방문보다 클 수 있어요(그래서 100%를 넘습니다).</p>';
  h+='<div class="funnel">';
  // 바 길이 기준: 비교까지 포함한 전체 최댓값으로 잡아야 값이 밖으로 밀려 안 보이는 일이 없음
  const maxVal = Math.max(...d.funnel.map(s=>Math.max(s.after, cmpOn?s.before:0)), 1);
  h+=d.funnel.map((s,i)=>{const p=d.funnel[i-1];
    const cA=p?(s.after/p.after*100):100;
    const cB=p&&p.before?(s.before/p.before*100):100;
    const dd=p?cA-cB:0, cls=dd<0?'w':'';
    const conv = p
      ? (cmpOn
          ? `<span class="stage-conv">통과율 ${cB.toFixed(1)}% → <b class="${cls}">${cA.toFixed(1)}%</b> <span class="${cls}">(${dd>=0?'+':''}${dd.toFixed(1)}%p)</span></span>`
          : `<span class="stage-conv">통과율 <b>${cA.toFixed(1)}%</b></span>`)
      : `<span class="stage-conv">유입 100%</span>`;
    // 숫자는 바 안이 아니라 바 오른쪽 고정 칸에 둬서 항상 보이게 함
    const row=(tag,val,cls2)=>`<div class="bar-row"><span class="bar-tag">${tag}</span>
      <div class="bar-track"><div class="bar-fill ${cls2}" style="width:${Math.min(Math.max(val/maxVal*100,2),100)}%"></div></div>
      <span class="bar-val">${fmt(val)}</span></div>`;
    return `<div class="stage"><div class="stage-top"><span class="stage-name">${s.name}</span>${conv}</div><div class="bars">
      ${cmpOn?row('비교',s.before,'b'):''}
      ${row(cmpOn?'선택':'', s.after, 'a')}
    </div></div>`;}).join('')+'</div>';

  h+='<h2 class="sec">페이지별 트래픽</h2><div class="pages">'+d.pages.map(pg=>{
    const rows=pg.metrics.map(m=>{
      if(!cmpOn) return `<div class="m-row"><span class="m-label">${m.label}</span><span class="m-vals"><b>${fmt(m.after)}</b></span></div>`;
      const x=delta(m.before,m.after);
      return `<div class="m-row"><span class="m-label">${m.label}</span><span class="m-vals">${fmt(m.before)} → <b>${fmt(m.after)}</b></span>
      <span class="m-delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${x.text}</span></div>`;}).join('');
    return `<div class="page"><div class="page-name">${pg.name}</div>${rows}</div>`;}).join('')+'</div>';

  h+='<h2 class="sec">스크롤 도달률</h2>';
  h+='<p class="sec-desc">페이지를 90% 지점까지 내려본 비율(GA4 scroll 이벤트 ÷ 조회수) · 콘텐츠를 끝까지 보는지 판단하는 지표예요.</p>';
  h+='<div id="scrollWrap"><div class="funnel"><div class="state"><div class="spinner"></div>스크롤 지표 불러오는 중…</div></div></div>';

  h+='<h2 class="sec">UTM 캠페인 성과</h2>';
  h+='<p class="sec-desc">utm_campaign이 붙은 유입만 집계해요 · 캠페인별 유입·구매·전환율·세션당 매출을 봅니다. (자연유입·직접유입은 캠페인명이 없어 제외)</p>';
  h+='<div id="utmWrap"><div class="funnel"><div class="state"><div class="spinner"></div>UTM 지표 불러오는 중…</div></div></div>';

  $('content').innerHTML=h;
  loadScrollDepth();
  loadUtmPerformance();
}

async function loadUtmPerformance(){
  const wrap=$('utmWrap');
  if(!wrap) return;
  try{
    const r=await fetch(WORKER+'/?'+q()+'&tab=utm',{cache:'no-store'});
    const dd=await r.json();
    if(dd.error){ wrap.innerHTML='<div class="funnel"><div class="state">불러오지 못했습니다: '+dd.error+'</div></div>'; return; }
    if(!dd.utm){ wrap.innerHTML='<div class="funnel"><div class="state">UTM 데이터가 없습니다</div></div>'; return; }
    const cur=dd.utm, prev=dd.utmBefore;
    const cmpOn=$('cmp').checked && prev;

    const block=(title, rows, prevRows, color)=>{
      if(!rows || !rows.length) return `<div class="section-block"><div class="section-block-head"><span class="section-dot" style="background:${color};"></span><span class="section-block-title">${title}</span></div><div class="state">데이터 없음</div></div>`;
      const maxV=Math.max(...rows.map(x=>x.sessions),1);
      const prevMap={}; if(cmpOn && prevRows) prevRows.forEach(p=>prevMap[p.name]=p);
      const tot=rows.reduce((a,b)=>a+b.sessions,0)||1;
      let out=`<div class="section-block"><div class="section-block-head"><span class="section-dot" style="background:${color};"></span><span class="section-block-title">${title}</span><span class="section-block-total">세션 ${fmt(tot)}</span></div>`;
      out+=rows.map(x=>{
        const w=Math.max(x.sessions/maxV*100,3);
        const detail = cur.hasRevenue
          ? `구매 ${fmt(x.purchases)}건 · 전환 ${x.convRate.toFixed(2)}% · 세션당 ${won(Math.round(x.revPerSession))}`
          : `구매·매출 지표 없음`;
        let cmpHtml='';
        if(cmpOn){
          const p=prevMap[x.name]; const pv=p?p.sessions:0;
          const dv=delta(pv, x.sessions);
          cmpHtml=`<div class="slotbar-meta">비교 ${fmt(pv)} <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span>${p&&cur.hasRevenue?` · 전환 ${p.convRate.toFixed(2)}% → <b>${x.convRate.toFixed(2)}%</b>`:''}</div>`;
        }
        return `<div class="slotbar-row">
          <div><span class="slotbar-name" style="cursor:default;">${x.name}</span><div class="slotbar-meta">${detail}</div>${cmpHtml}</div>
          <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${color};"></div></div>
          <div><div class="slotbar-val">${fmt(x.sessions)}</div><div class="slotbar-sub">${cur.hasRevenue?won(x.revenue):'세션'}</div></div>
        </div>`;
      }).join('');
      out+='</div>';
      return out;
    };

    let h='';
    if(cur.campaigns && cur.campaigns.length){
      h+=block('캠페인별 (utm_campaign)', cur.campaigns, prev?prev.campaigns:null, '#7A3FC8');
    } else {
      h+='<div class="section-block"><div class="section-block-head"><span class="section-block-title">캠페인별 (utm_campaign)</span></div><div class="state">이 기간에 utm_campaign이 붙은 유입이 없어요. 광고·뉴스레터 링크에 UTM을 붙이면 여기에 성과가 쌓입니다.</div></div>';
    }
    h+=block('소스/매체별 (utm_source · utm_medium)', cur.sourceMediums, prev?prev.sourceMediums:null, '#2B7DB8');
    wrap.innerHTML=h;
  }catch(e){ wrap.innerHTML='<div class="funnel"><div class="state">UTM 지표를 불러오지 못했습니다</div></div>'; }
}

async function loadScrollDepth(){
  const wrap=$('scrollWrap');
  if(!wrap) return;
  try{
    const r=await fetch(WORKER+'/?'+q()+'&tab=scroll',{cache:'no-store'});
    const dd=await r.json();
    if(dd.error || !dd.scroll){ wrap.innerHTML='<div class="funnel"><div class="state">스크롤 지표를 불러오지 못했습니다</div></div>'; return; }
    const cur=dd.scroll, prev=dd.scrollBefore;
    const cmpOn=$('cmp').checked && prev;
    const rows=cur.byPageGroup||[];

function destLabel(x){
  if(x.name) return `<a href="https://printbakery.com${x.path}" target="_blank">${x.name}</a>`+(x.product_no?` <span style="color:var(--muted);font-size:11px;">#${x.product_no}</span>`:'');
  let t=x.path;
  if(/\/promotion\//.test(t)) t='프로모션 상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/\/artist\//.test(t)) t='아티스트 상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/\/product\/detail/.test(t)) t='상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/list\.html/.test(t)){const m=t.match(/cate_no=(\d+)/);t='카테고리 목록'+(m?` (${m[1]})`:'');}
  return `<a href="https://printbakery.com${x.path}" target="_blank">${t}</a>`;
}
function fmtDwell(sec){ if(!sec) return '-'; const m=Math.floor(sec/60),x=sec%60; return m>0?`${m}:${String(x).padStart(2,'0')}`:`${x}초`; }

// 구좌 순서(화면 배치 위치) + 유입(그 구좌를 통해 실제 넘어간 세션) 표
// 섹션별 색상 (일관된 팔레트로 시각적 통일감)
const SECTION_COLORS={
  '글로벌네비':'#66768A','상단배너':'#0E7C6E','숏컷':'#C8993F','주제별 추천작':'#7A3FC8',
  'For Collector':'#2B7DB8','추천 작가':'#D85A30','프로모션':'#C85A9E','전시 소식':'#4C5B73',
  '카테고리':'#0E7C6E','선물추천':'#2B7DB8','추천 브랜드':'#7A3FC8',
};
function sectionColor(sec){
  if(SECTION_COLORS[sec]) return SECTION_COLORS[sec];
  const base=(sec||'').split(' · ')[0];
  return SECTION_COLORS[base] || '#66768A';
}

const SECTION_ROWS={}, SECTION_SORT={};
function sortArrow(id,key){
  const st=SECTION_SORT[id];
  if(!st||st.key!==key) return '<span style="color:var(--ghost);">↕</span>';
  return st.dir==='asc' ? '<span style="color:var(--accent);">▲</span>' : '<span style="color:var(--accent);">▼</span>';
}
function sortSection(id,key){
  const st=SECTION_SORT[id]||{key:'sessions',dir:'desc'};
  const dir = (st.key===key && st.dir==='desc') ? 'asc' : 'desc';
  SECTION_SORT[id]={key,dir};
  const wrap=document.getElementById('wrap-'+id);
  if(wrap) wrap.outerHTML=sectionTable(SECTION_ROWS[id], id);
}
let SECTION_TABLE_SEQ=0;
function sectionTable(rows, id){
  if(!id){ id='sec'+(SECTION_TABLE_SEQ++); }
  SECTION_ROWS[id]=rows;
  const st=SECTION_SORT[id]||{key:'sessions',dir:'desc'};
  SECTION_SORT[id]=st;
  const val=(r)=> st.key==='order' ? r.order : r.after.sessions;
  const sorted=[...rows].sort((a,b)=> st.dir==='asc' ? (val(a)-val(b)) : (val(b)-val(a)));
  const maxSessions=Math.max(...sorted.map(r=>r.after.sessions),1);
  const tot=sorted.reduce((s,x)=>s+x.after.sessions,0)||1;
  const color = sectionColor(sorted[0]?.section);

  let html = `<div id="wrap-${id}">`;
  html += `<div style="display:flex;gap:14px;margin-bottom:6px;font-size:11px;color:var(--muted);">
    <span style="cursor:pointer;" onclick="sortSection('${id}','order')">구좌 순서 정렬 ${sortArrow(id,'order')}</span>
    <span style="cursor:pointer;" onclick="sortSection('${id}','sessions')">유입 세션 정렬 ${sortArrow(id,'sessions')}</span>
  </div>`;

  sorted.forEach((r,i)=>{
    const hasProducts = r.topProducts && r.topProducts.length>0;
    const label = r.topProductsLabel || '상품';
    const rowId=`${id}-${i}`;
    const widthPct = Math.max(r.after.sessions/maxSessions*100, r.after.sessions>0?4:0);
    const nameHtml = hasProducts
      ? `<span class="slotbar-name" onclick="toggleSlotProducts('${rowId}')">${r.name} <span style="color:var(--accent);font-size:11px;">▾ ${label} ${r.topProducts.length}개</span></span>`
      : `<span class="slotbar-name" style="cursor:default;">${r.name}</span>`;
    let metaExtra='';
    if($('cmp').checked && r.before){
      const dv=delta(r.before.sessions, r.after.sessions);
      metaExtra=` · 비교 ${fmt(r.before.sessions)} <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span>`;
    }
    html += `<div class="slotbar-row">
      <div>${nameHtml}<div class="slotbar-meta">${r.order}번째 · ${(r.after.sessions/tot*100).toFixed(1)}%${metaExtra}</div></div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${widthPct}%;background:${color};"></div></div>
      <div><div class="slotbar-val">${fmt(r.after.sessions)}</div><div class="slotbar-sub">${fmtDwell(r.after.dwell)}</div></div>
    </div>`;
    if(hasProducts){
      const maxP=Math.max(...r.topProducts.map(p=>p.sessions),1);
      html += `<div id="prod-${rowId}" style="display:none;padding:2px 0 8px;">`;
      html += r.topProducts.map(p=>{
        const pw=Math.max(p.sessions/maxP*100, 4);
        return `<div class="prod-mini-row">
          <span class="prod-mini-name">${p.name||'(이름 조회 실패)'} <span style="color:var(--ghost);">#${p.pno}</span></span>
          <div class="prod-mini-track"><div class="prod-mini-fill" style="width:${pw}%;background:${color};opacity:.55;"></div></div>
          <span class="prod-mini-val">${fmt(p.sessions)} · ${fmtDwell(p.dwell)}</span>
        </div>`;
      }).join('');
      html += `</div>`;
    }
  });
  html += '</div>';
  return html;
}
function toggleSlotProducts(rowId){
  const el=document.getElementById('prod-'+rowId);
  if(!el) return;
  el.style.display = el.style.display==='none' ? '' : 'none';
}

// 목적지(상품/카테고리) 이동 순위 표
let SLOTTABLE_SEQ=0;
function slotTable(list){
  if(!list||!list.length)return '<div class="state">이동 데이터 없음</div>';
  const id='st'+(SLOTTABLE_SEQ++);
  const tot=list.reduce((s,x)=>s+x.sessions,0);
  const maxV=Math.max(...list.map(x=>x.sessions),1);
  const VISIBLE=5;
  const row=(x,i)=>{
    const w=Math.max(x.sessions/maxV*100,4);
    return `<div class="slotbar-row">
      <div><span class="slotbar-name" style="cursor:default;">${i+1}. ${destLabel(x)}</span></div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#2B7DB8;"></div></div>
      <div><div class="slotbar-val">${fmt(x.sessions)}</div><div class="slotbar-sub">${tot?(x.sessions/tot*100).toFixed(1):0}%</div></div>
    </div>`;
  };
  const head=list.slice(0,VISIBLE).map(row).join('');
  const rest=list.slice(VISIBLE);
  if(!rest.length) return head;
  const restHtml=rest.map((x,i)=>row(x,i+VISIBLE)).join('');
  return head+`<div id="${id}-rest" style="display:none;">${restHtml}</div>
    <div style="text-align:center;padding-top:8px;">
      <span id="${id}-btn" style="cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;" onclick="toggleSlotTableRest('${id}', ${rest.length})">나머지 ${rest.length}개 더 보기 ▾</span>
    </div>`;
}
function toggleSlotTableRest(id, count){
  const el=document.getElementById(id+'-rest');
  const btn=document.getElementById(id+'-btn');
  if(!el||!btn) return;
  const showing = el.style.display!=='none';
  el.style.display = showing ? 'none' : '';
  btn.textContent = showing ? `나머지 ${count}개 더 보기 ▾` : '접기 ▴';
}

let PRODUCT_SUBTAB = localStorage.getItem('pbg_product_subtab') || 'art';
let LAST_PERF_DATA = null;

function renderProductTab(dPerf, dSlots){
  LAST_PERF_DATA = {dPerf, dSlots};
  let h=`<div class="period-label">기준 기간 &nbsp; <b>${dPerf.periodAfter}</b> &nbsp;<span style="color:var(--muted)">· 구좌는 수시로 바뀌어 선택 기간 성과만 표시</span></div>`;
  h+=`<p class="sec-desc">
    <b>구좌 순서</b> = 메인 화면에 배치된 위치(몇 번째 칸인지). &nbsp;
    <b>유입 세션</b> = 그 구좌를 눌러서 실제로 넘어간 방문 수. 위치는 고정, 그 자리에 걸린 상품은 바뀔 수 있어요.</p>`;

  // 핵심 구좌 TOP 10: art+life 전체(글로벌네비 중복 제외)를 합쳐서, 전체 유입 대비 비중이 높은 순
  const allRows=[
    ...(dPerf.slotperf['art']||[]).map(r=>({...r, tab:'ART'})),
    ...(dPerf.slotperf['life']||[]).filter(r=>r.section!=='글로벌네비').map(r=>({...r, tab:'LIFE'})),
  ];
  const grandTotal = allRows.reduce((s,r)=>s+r.after.sessions,0)||1;
  const top10 = [...allRows].sort((a,b)=>b.after.sessions-a.after.sessions).slice(0,10);
  const top10Max = Math.max(...top10.map(r=>r.after.sessions),1);
  h+='<h2 class="sec">핵심 구좌 TOP 10 (전체 유입 대비)</h2>';
  h+='<p class="sec-desc">art·life 전체 구좌를 통틀어, 실제 유입이 가장 많이 몰린 자리들이에요.</p>';
  h+='<div class="section-block">'+top10.map((r,i)=>{
    const w=Math.max(r.after.sessions/top10Max*100,4);
    const color=sectionColor(r.section);
    return `<div class="slotbar-row">
      <div><span class="slotbar-name" style="cursor:default;">${i+1}. ${r.name}</span><div class="slotbar-meta">${r.tab} · ${r.section}</div></div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${color};"></div></div>
      <div><div class="slotbar-val">${fmt(r.after.sessions)}</div><div class="slotbar-sub">${(r.after.sessions/grandTotal*100).toFixed(1)}%</div></div>
    </div>`;
  }).join('')+'</div>';

  // 공통(글로벌 네비) — art/life 둘 다 동일하므로 한 번만
  const commonRows = (dPerf.slotperf['art']||[]).filter(r=>r.section==='글로벌네비');
  h+='<h2 class="sec">공통 (글로벌 네비)</h2>';
  h+='<p class="sec-desc">art·life 어디서 봐도 같은 상단 메뉴라 한 번만 표시해요.</p>';
  h+=`<div class="section-block">
    <div class="section-block-head"><span class="section-dot" style="background:${sectionColor('글로벌네비')};"></span><span class="section-block-title">글로벌 네비</span></div>
    ${sectionTable(commonRows)}</div>`;

  h+='<h2 class="sec">구좌 성과</h2>';
  h+='<div class="preset-btns" id="productSubtabBtns" style="margin-bottom:16px;"></div>';
  h+='<div id="productSubtabWrap"></div>';

  h+='<h2 class="sec">목적지별 이동 순위 (상위 30)</h2>';
  h+='<p class="sec-desc">각 메인(art·life)에서 클릭해 넘어간 목적지(상품·카테고리)를 유입 세션 많은 순으로.</p>';
  ['art.html','life.html'].forEach(k=>{const s=dSlots.slots[k]||{};
    h+=`<h2 class="sec" style="font-size:15px;">${k} 메인에서의 이동</h2>`;
    h+=`<div class="slot-cols"><div class="section-block">${slotTable(s.before)}</div><div class="section-block">${slotTable(s.after)}</div></div>`;});

  $('content').innerHTML=h;

  $('productSubtabBtns').innerHTML=['art','life'].map(t=>
    `<button data-t="${t}" class="${t===PRODUCT_SUBTAB?'active':''}">${t.toUpperCase()}</button>`).join('');
  $('productSubtabBtns').addEventListener('click',(e)=>{
    const t=e.target.dataset.t; if(!t) return;
    PRODUCT_SUBTAB=t; localStorage.setItem('pbg_product_subtab',t);
    document.querySelectorAll('#productSubtabBtns button').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
    renderProductSubtab();
  });

function renderProductSubtab(){
  if(!LAST_PERF_DATA) return;
  const tab=PRODUCT_SUBTAB;
  const rows=(LAST_PERF_DATA.dPerf.slotperf[tab]||[]).filter(r=>r.section!=='글로벌네비');
  const order=[]; const groups={};
  rows.forEach(r=>{ const sec=r.section||'기타'; if(!groups[sec]){groups[sec]=[];order.push(sec);} groups[sec].push(r); });
  let h='';
  order.forEach(sec=>{
    const total = groups[sec].reduce((s,r)=>s+r.after.sessions,0);
    h+=`<div class="section-block">
      <div class="section-block-head"><span class="section-dot" style="background:${sectionColor(sec)};"></span><span class="section-block-title">${sec}</span><span class="section-block-total">합계 ${fmt(total)} 세션</span></div>
      ${sectionTable(groups[sec])}</div>`;
  });
  document.getElementById('productSubtabWrap').innerHTML=h;
}

function rankTable(rows,label,prevRows){
  const cmpOn=$('cmp').checked && prevRows && prevRows.length;

  const maxV=Math.max(...rows.map(x=>x.sessions),1);
  return '<div class="section-block">'+rows.map(x=>{
    const w=Math.max(x.sessions/maxV*100,4);
    const p=cmpOn?prevMap[x.name]:null;
    let cmpHtml='';
    if(cmpOn){
      const pv=p?p.sessions:0;
      const d=delta(pv,x.sessions);
      cmpHtml=`<div class="slotbar-meta">비교 ${fmt(pv)} <span class="${d.good?'up-txt':'down-txt'}">${d.up?'▲':'▼'} ${d.text}</span></div>`;
    }
    return `<div class="slotbar-row">
      <div><span class="slotbar-name" style="cursor:default;">${x.name}</span>${cmpHtml}</div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#0E7C6E;"></div></div>
      <div><div class="slotbar-val">${fmt(x.sessions)}</div><div class="slotbar-sub">${x.share.toFixed(1)}%</div></div>
    </div>`;
  }).join('')+'</div>';
}
function renderAcquisition(d){
  let h=`<div class="period-label">기간 &nbsp; <b>${d.periodAfter}</b></div>`;

  h+='<h2 class="sec">국가별 유입</h2>';
  h+='<p class="sec-desc">유입은 많은데 체류시간이 비정상적으로 짧으면(수 초 이내) 봇·광고 어뷰징일 가능성이 있어요.</p>';
  const countries=d.acquisition.byCountry||[];
  if(countries.length){
    const maxC=Math.max(...countries.map(c=>c.sessions),1);
    h+='<div class="section-block">'+countries.map(c=>{
      const suspicious = c.avgEngagementSec<3 && c.share>3;
      const w=Math.max(c.sessions/maxC*100,4);
      const flag = suspicious ? ' <span style="color:var(--down);">⚠️ 이상 트래픽 의심</span>' : '';
      return `<div class="slotbar-row">
        <div><span class="slotbar-name" style="cursor:default;">${c.name}${flag}</span></div>
        <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${suspicious?'var(--down)':'#0E7C6E'};"></div></div>
        <div><div class="slotbar-val">${fmt(c.sessions)}</div><div class="slotbar-sub">${fmtDwell(c.avgEngagementSec)}</div></div>
      </div>`;
    }).join('')+'</div>';
  } else {
    h+='<div class="state">국가별 데이터 없음</div>';
  }

  h+='<h2 class="sec">상위 5개국 상세 진단</h2><div id="countryDetailWrap" class="state"><div class="spinner"></div>불러오는 중…</div>';

  $('content').innerHTML=h;
  loadCountryDetail();
}

async function loadCountryDetail(){
  const wrap=document.getElementById('countryDetailWrap');
  try{
    const r=await fetch(WORKER+'/?'+q()+'&tab=countrydetail',{cache:'no-store'});
    const dd=await r.json();
    if(dd.error){ wrap.innerHTML='<div class="state">불러오지 못했습니다: '+dd.error+'</div>'; return; }
    const countries=dd.countries||[];
    if(!countries.length){ wrap.innerHTML='<div class="state">데이터 없음</div>'; return; }
    let html='<p class="sec-desc">각 국가에서 실제로 어떤 페이지를 봤는지. 같은 페이지만 반복되거나 direct(리퍼러 없음)로 몰려있으면 봇·스크래퍼 의심.</p>';
    countries.forEach(c=>{
      if(!c.pages || !c.pages.length){
        html+=`<div class="section-block"><div class="section-block-head"><span class="section-block-title">${c.country}</span><span class="section-block-total">세션 ${fmt(c.sessions)} · ${c.share.toFixed(1)}%</span></div><div class="state">방문 페이지 없음</div></div>`;
        return;
      }
      const maxP=Math.max(...c.pages.map(p=>p.sessions),1);
      html+=`<div class="section-block"><div class="section-block-head"><span class="section-block-title">${c.country}</span><span class="section-block-total">세션 ${fmt(c.sessions)} · ${c.share.toFixed(1)}%</span></div>`;
      html+=c.pages.map(p=>{
        const isDirect = /direct|\(none\)/i.test(p.source);
        const suspicious = isDirect && p.avgEngagementSec<3;
        const w=Math.max(p.sessions/maxP*100,4);
        const flag = suspicious ? ' <span style="color:var(--down);">⚠️</span>' : '';
        return `<div class="slotbar-row">
          <div><span class="slotbar-name" style="cursor:default;">${p.path}${flag}</span><div class="slotbar-meta">${p.source}</div></div>
          <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${suspicious?'var(--down)':'#0E7C6E'};"></div></div>
          <div><div class="slotbar-val">${fmt(p.sessions)}</div><div class="slotbar-sub">${fmtDwell(p.avgEngagementSec)}</div></div>
        </div>`;
      }).join('')+'</div>';
    });
    wrap.innerHTML=html;
  }catch(e){ wrap.innerHTML='<div class="state">불러오지 못했습니다</div>'; }
}

async function loadRevenue(){
  showLoading();
  try{
    if(!REVENUE_CACHE){
      const r=await fetch('./revenue-daily.json',{cache:'no-store'});
      REVENUE_CACHE=await r.json();
    }
    const daily=REVENUE_CACHE.daily||[];
    const inRange=(d,s0,e0)=>d>=s0 && d<=e0;
    const sumRange=(s0,e0)=>{
      const rows=daily.filter(d=>inRange(d.date,s0,e0));
      const agg={gmv:0,net:0,count:0,refund:0,items:{}};
      rows.forEach(r=>{
        agg.gmv+=r.gmv; agg.net+=r.net; agg.count+=r.count; agg.refund+=r.refund;
        (r.topItems||[]).forEach(it=>{
          const k=it.product_no;
          if(!agg.items[k]) agg.items[k]={name:it.name,amt:0,qty:0};
          agg.items[k].amt+=it.amt; agg.items[k].qty+=it.qty;
        });
      });
      agg.aov = agg.count? Math.round(agg.net/agg.count):0;
      agg.topItems = Object.values(agg.items).sort((a,b)=>b.amt-a.amt).slice(0,5);
      return agg;
    };
    const as=$('s').value, ae=$('e').value;
    const after=sumRange(as,ae);
    const before = $('cmp').checked ? sumRange($('cs').value,$('ce').value) : after;
    const periodBeforeStr = $('cmp').checked ? `${$('cs').value} ~ ${$('ce').value}` : '';
    const dailyRows = daily.filter(d=>inRange(d.date,as,ae)).sort((x,y)=>x.date.localeCompare(y.date));
    renderRevenue({periodBefore:periodBeforeStr, periodAfter:`${as} ~ ${ae}`, revenue:{before,after}, dailyRows});
  }catch(e){
    showErr('매출 데이터를 불러오지 못했습니다.<br><span style="font-size:12px;">레포에 revenue-daily.json 파일이 있는지 확인해주세요.</span>');
  }
}
// 매출 추이: 상단에서 고른 기간을 그대로 사용, 비교 켜면 비교 기간도 점선으로
function drawRevenueTrend(){
  const wrap=$('revTrendWrap');
  if(!wrap) return;
  const all=(REVENUE_CACHE && REVENUE_CACHE.daily) ? REVENUE_CACHE.daily : [];
  if(!all.length){ wrap.innerHTML='<div class="funnel"><div class="state">매출 데이터가 없습니다</div></div>'; return; }

  const cmpOn=$('cmp').checked;
  const cut=(s0,e0)=>all.filter(d=>d.date>=s0 && d.date<=e0).sort((a,b)=>a.date.localeCompare(b.date));
  const dr=cut($('s').value, $('e').value);
  const dp=cmpOn? cut($('cs').value, $('ce').value) : [];

  if(dr.length<2){
    wrap.innerHTML='<div class="funnel"><div class="state">선택한 기간이 하루라 추이가 그려지지 않아요. 위에서 기간을 2일 이상으로 넓혀보세요.</div></div>';
    return;
  }

  const labels=dr.map(r=>r.date.slice(5).replace('-','/'));
  const prevLabels=dp.length? dp.map(r=>r.date.slice(5).replace('-','/')) : null;
  const refunds=dr.map(r=>r.refund||0);
  const refundsPrev=dp.length? dp.map(r=>r.refund||0) : null;
  const totalRef=refunds.reduce((x,z)=>x+z,0);
  const totalGmv=dr.reduce((x,r)=>x+(r.gmv||0),0);
  const sumNet=dr.reduce((x,r)=>x+r.net,0), sumCnt=dr.reduce((x,r)=>x+r.count,0);

  const card=(title,color,total,svg)=>`<div class="funnel card-gap"><div class="mini-head"><span class="mini-dot" style="background:${color}"></span>${title}<span class="mini-total">${total}</span></div>${svg}</div>`;
  const pick=(vals)=>cmpOn&&vals&&vals.length? vals : null;

  let h='';
  // 매출 vs 환불 (한 차트에 두 지표) — 제일 중요하니 맨 위
  h+='<div class="section-title">매출총액 vs 환불액</div>';
  h+='<div class="funnel card-gap">'
    + dualLineChart(labels,
        {name:'매출총액', values:dr.map(r=>r.net), color:'#0E7C6E'},
        {name:'환불액',   values:refunds,          color:'#C85A3F'},
        v=>wonAxis(v))
    + '</div>';

  h+=card('매출총액','#0E7C6E', won(sumNet),
      compareLineChart(labels, dr.map(r=>r.net), pick(dp.map(r=>r.net)), '#0E7C6E', v=>wonAxis(v), '매출총액', prevLabels));
  h+=card('주문 건수','#2B7DB8', fmt(sumCnt)+'건',
      cmpOn && dp.length
        ? compareLineChart(labels, dr.map(r=>r.count), dp.map(r=>r.count), '#2B7DB8', v=>fmt(Math.round(v)), '주문', prevLabels)
        : verticalBarChart(labels, dr.map(r=>r.count), '#2B7DB8', v=>fmt(Math.round(v))));
  h+=card('객단가','#C8993F', won(sumCnt? Math.round(sumNet/sumCnt) : 0),
      compareLineChart(labels, dr.map(r=>r.count?Math.round(r.net/r.count):0),
        pick(dp.map(r=>r.count?Math.round(r.net/r.count):0)), '#C8993F', v=>wonAxis(v), '객단가', prevLabels));
  h+=card('환불액','#C85A3F', won(totalRef),
      cmpOn && dp.length
        ? compareLineChart(labels, refunds, refundsPrev, '#C85A3F', v=>wonAxis(v), '환불액', prevLabels)
        : verticalBarChart(labels, refunds, '#C85A3F', v=>wonAxis(v)));
  h+=card('환불율','#C85A9E', (totalGmv?(totalRef/totalGmv*100).toFixed(2):0)+'%',
      compareLineChart(labels, dr.map(r=>r.gmv?Number((r.refund/r.gmv*100).toFixed(2)):0),
        pick(dp.map(r=>r.gmv?Number((r.refund/r.gmv*100).toFixed(2)):0)), '#C85A9E', v=>v.toFixed(1)+'%', '환불율', prevLabels));

  wrap.innerHTML=h;
}
