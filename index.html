function destLabel(x){
  if(x.name) return `<a href="https://printbakery.com${x.path}" target="_blank">${x.name}</a>`+(x.product_no?` <span style="color:var(--muted);font-size:11px;">#${x.product_no}</span>`:'');
  let t=x.path;
  if(/\/promotion\//.test(t)) t='프로모션 상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/\/artist\//.test(t)) t='아티스트 상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/\/product\/detail/.test(t)) t='상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/list\.html/.test(t)){const m=t.match(/cate_no=(\d+)/);t='카테고리 목록'+(m?` (${m[1]})`:'');}
  return `<a href="https://printbakery.com${x.path}" target="_blank">${t}</a>`;
}
function fmtDwell(sec){ if(!sec) return '-'; const m=Math.floor(sec/60),x=sec%60; return m>0?`${m}:${String(x).padStart(2,'0')}`:`${x}초`; }

// 구좌 순서(화면 배치 위치) + 유입(그 구좌를 통해 실제 넘어간 세션) 표
// 섹션별 색상 (일관된 팔레트로 시각적 통일감)
const SECTION_COLORS={
  '글로벌네비':'#8B95A1','상단배너':'#3182F6','숏컷':'#FF9500','주제별 추천작':'#8B5CF6',
  'For Collector':'#00B26B','추천 작가':'#F04452','프로모션':'#F471B5','전시 소식':'#4E5968',
  '카테고리':'#3182F6','선물추천':'#00B26B','추천 브랜드':'#8B5CF6',
};
function sectionColor(sec){
  if(SECTION_COLORS[sec]) return SECTION_COLORS[sec];
  const base=(sec||'').split(' · ')[0];
  return SECTION_COLORS[base] || '#8B95A1';
}

const SECTION_ROWS={}, SECTION_SORT={};
function sortArrow(id,key){
  const st=SECTION_SORT[id];
  if(!st||st.key!==key) return '<span style="color:var(--ghost);font-size:11px;">▲▼</span>';
  return st.dir==='asc' ? '<span style="color:var(--accent);">▲</span>' : '<span style="color:var(--accent);">▼</span>';
}
function sortSection(id,key){
  const st=SECTION_SORT[id]||{key:'sessions',dir:'desc'};
  const dir = (st.key===key && st.dir==='desc') ? 'asc' : 'desc';
  SECTION_SORT[id]={key,dir};
  const wrap=document.getElementById('wrap-'+id);
  if(wrap) wrap.outerHTML=sectionTable(SECTION_ROWS[id], id);
}
let SECTION_TABLE_SEQ=0;
function sectionTable(rows, id){
  if(!id){ id='sec'+(SECTION_TABLE_SEQ++); }
  SECTION_ROWS[id]=rows;
  const st=SECTION_SORT[id]||{key:'sessions',dir:'desc'};
  SECTION_SORT[id]=st;
  const val=(r)=> st.key==='order' ? r.order : r.after.sessions;
  const sorted=[...rows].sort((a,b)=> st.dir==='asc' ? (val(a)-val(b)) : (val(b)-val(a)));
  const cmpOn = $('cmp').checked;
  // 비교 막대와 같은 기준으로 길이를 재려면 최댓값에 비교값도 포함해야 함
  const maxSessions=Math.max(...sorted.map(r=>Math.max(r.after.sessions, (cmpOn&&r.before)?r.before.sessions:0)),1);
  const tot=sorted.reduce((s,x)=>s+x.after.sessions,0)||1;
  const color = sectionColor(sorted[0]?.section);

  let html = `<div id="wrap-${id}">`;
  html += `<div style="display:flex;gap:14px;margin-bottom:6px;font-size:11px;color:var(--muted);">
    <span style="cursor:pointer;" onclick="sortSection('${id}','order')">구좌 순서 정렬 ${sortArrow(id,'order')}</span>
    <span style="cursor:pointer;" onclick="sortSection('${id}','sessions')">유입 세션 정렬 ${sortArrow(id,'sessions')}</span>
  </div>`;

  sorted.forEach((r,i)=>{
    const hasProducts = r.topProducts && r.topProducts.length>0;
    const label = r.topProductsLabel || '상품';
    const rowId=`${id}-${i}`;
    const widthPct = Math.max(r.after.sessions/maxSessions*100, r.after.sessions>0?4:0);
    const nameHtml = hasProducts
      ? `<span class="slotbar-name" onclick="toggleSlotProducts('${rowId}')">${r.name} <span style="color:var(--accent);font-size:11px;">▾ ${label} ${r.topProducts.length}개</span></span>`
      : `<span class="slotbar-name" style="cursor:default;">${r.name}</span>`;
    const showCmp = cmpOn && r.before;
    let metaExtra='';
    if(showCmp){
      const dv=delta(r.before.sessions, r.after.sessions);
      metaExtra=` · <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span>`;
    }
    // 비교가 켜지면 선택/비교 막대를 위아래로 나란히
    const barHtml = showCmp
      ? `<div class="slotbar-dual">
          <div class="slotbar-mini"><span class="slotbar-tag">선택</span>
            <div class="slotbar-track sm"><div class="slotbar-fill" style="width:${widthPct}%;background:${color};"></div></div>
            <span class="slotbar-mini-val">${fmt(r.after.sessions)}</span></div>
          <div class="slotbar-mini"><span class="slotbar-tag">비교</span>
            <div class="slotbar-track sm"><div class="slotbar-fill" style="width:${Math.max(r.before.sessions/maxSessions*100, r.before.sessions>0?4:0)}%;background:#B0B8C1;"></div></div>
            <span class="slotbar-mini-val">${fmt(r.before.sessions)}</span></div>
        </div>`
      : `<div class="slotbar-track"><div class="slotbar-fill" style="width:${widthPct}%;background:${color};"></div></div>`;
    html += `<div class="slotbar-row${showCmp?' tall':''}">
      <div>${nameHtml}<div class="slotbar-meta">${r.order}번째 · ${(r.after.sessions/tot*100).toFixed(1)}%${metaExtra}</div></div>
      ${barHtml}
      <div><div class="slotbar-val">${fmt(r.after.sessions)}</div><div class="slotbar-sub">${fmtDwell(r.after.dwell)}</div></div>
    </div>`;
    if(hasProducts){
      html += `<div id="prod-${rowId}" style="display:none;padding:2px 0 8px;">`;
      // [2026-07-31] 막대 제거. 하위 상품은 보통 2~5개에 세션 수도 한 자릿수라
      // 막대 길이가 서로 비슷해 구분이 안 되고, 오히려 규모를 잘못 암시했다.
      // 이름을 못 가져온 경우엔 내부 사정(조회 상한)을 노출하지 않고 번호만 조용히 보여준다.
      html += r.topProducts.map(p=>
        `<div class="prod-mini-row">
          <span class="prod-mini-name">${p.name
            ? `${p.name} <span style="color:var(--ghost);">#${p.pno}</span>`
            : `<span style="color:var(--muted);">#${p.pno}</span> <span style="color:var(--ghost);font-size:11px;">이름 불러오는 중</span>`}</span>
          <span class="prod-mini-val">${fmt(p.sessions)} · ${fmtDwell(p.dwell)}</span>
        </div>`).join('');
      html += `</div>`;
    }
  });
  html += '</div>';
  return html;
}
function toggleSlotProducts(rowId){
  const el=document.getElementById('prod-'+rowId);
  if(!el) return;
  el.style.display = el.style.display==='none' ? '' : 'none';
}

// 목적지(상품/카테고리) 이동 순위 표
let SLOTTABLE_SEQ=0;
function slotTable(list){
  if(!list||!list.length)return '<div class="state">이동 데이터 없음</div>';
  const id='st'+(SLOTTABLE_SEQ++);
  const tot=list.reduce((s,x)=>s+x.sessions,0);
  const maxV=Math.max(...list.map(x=>x.sessions),1);
  const VISIBLE=5;
  const row=(x,i)=>{
    const w=Math.max(x.sessions/maxV*100,4);
    return `<div class="slotbar-row">
      <div><span class="slotbar-name" style="cursor:default;">${i+1}. ${destLabel(x)}</span></div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#00B26B;"></div></div>
      <div><div class="slotbar-val">${fmt(x.sessions)}</div><div class="slotbar-sub">${tot?(x.sessions/tot*100).toFixed(1):0}%</div></div>
    </div>`;
  };
  const head=list.slice(0,VISIBLE).map(row).join('');
  const rest=list.slice(VISIBLE);
  if(!rest.length) return head;
  const restHtml=rest.map((x,i)=>row(x,i+VISIBLE)).join('');
  return head+`<div id="${id}-rest" style="display:none;">${restHtml}</div>
    <div style="text-align:center;padding-top:8px;">
      <span id="${id}-btn" style="cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;" onclick="toggleSlotTableRest('${id}', ${rest.length})">나머지 ${rest.length}개 더 보기 ▾</span>
    </div>`;
}
function toggleSlotTableRest(id, count){
  const el=document.getElementById(id+'-rest');
  const btn=document.getElementById(id+'-btn');
  if(!el||!btn) return;
  const showing = el.style.display!=='none';
  el.style.display = showing ? 'none' : '';
  btn.textContent = showing ? `나머지 ${count}개 더 보기 ▾` : '접기 ▴';
}

function renderProductSubtab(){
  if(!LAST_PERF_DATA) return;
  const tab=PRODUCT_SUBTAB;
  const rows=(LAST_PERF_DATA.dPerf.slotperf[tab]||[]).filter(r=>r.section!=='글로벌네비');
  const order=[]; const groups={};
  rows.forEach(r=>{ const sec=r.section||'기타'; if(!groups[sec]){groups[sec]=[];order.push(sec);} groups[sec].push(r); });
  let h='';
  order.forEach(sec=>{
    const total = groups[sec].reduce((s,r)=>s+r.after.sessions,0);
    h+=`<div class="section-block">
      <div class="section-block-head"><span class="section-dot" style="background:${sectionColor(sec)};"></span><span class="section-block-title">${sec}</span><span class="section-block-total">합계 ${fmt(total)} 세션</span></div>
      ${sectionTable(groups[sec])}</div>`;
  });
  document.getElementById('productSubtabWrap').innerHTML=h;
}

function rankTable(rows,label,prevRows){
  const cmpOn=$('cmp').checked && prevRows && prevRows.length;
  const prevMap={}; if(cmpOn) prevRows.forEach(p=>prevMap[p.name]=p);
  const maxV=Math.max(...rows.map(x=>x.sessions),1);
  return '<div class="section-block">'+rows.map(x=>{
    const w=Math.max(x.sessions/maxV*100,4);
    const p=cmpOn?prevMap[x.name]:null;
    let cmpHtml='';
    if(cmpOn){
      const pv=p?p.sessions:0;
      const d=delta(pv,x.sessions);
      cmpHtml=`<div class="slotbar-meta">비교 ${fmt(pv)} <span class="${d.good?'up-txt':'down-txt'}">${d.up?'▲':'▼'} ${d.text}</span></div>`;
    }
    return `<div class="slotbar-row">
      <div><span class="slotbar-name" style="cursor:default;">${x.name}</span>${cmpHtml}</div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#3182F6;"></div></div>
      <div><div class="slotbar-val">${fmt(x.sessions)}</div><div class="slotbar-sub">${x.share.toFixed(1)}%</div></div>
    </div>`;
  }).join('')+'</div>';
}

async function loadCountryDetail(){

  try{
    const dd = await wfetch(WORKER+'/?'+q()+'&tab=countrydetail');
    if(dd.error){ wrap.innerHTML='<div class="state">불러오지 못했습니다: '+dd.error+'</div>'; return; }

          <div><span class="slotbar-name" style="cursor:default;">${p.path}${flag}</span><div class="slotbar-meta">${p.source}</div></div>

// 실험 기록. experiments.json 이 없으면 이 섹션은 나타나지 않는다.
// 무엇을 언제 바꿨는지는 시스템이 알 수 없어 손으로 적어야 한다.
// 이게 없으면 지표가 좋아져도 우리가 뭘 해서 좋아진 건지 알 수 없다.
async function loadExperiments(){
  const wrap=document.getElementById('expWrap');
  if(!wrap) return;
  let cfg=null;
  try{
    const r=await fetch('./experiments.json',{cache:'no-store'});
    if(!r.ok) throw new Error('없음');
    cfg=await r.json();
  }catch(e){ wrap.innerHTML=''; return; }
  const list=Array.isArray(cfg && cfg.experiments)? cfg.experiments : [];
  if(!list.length){ wrap.innerHTML=''; return; }

  const STATE={ '진행중':'#3182F6', '종료':'#8B95A1', '예정':'#FF9500' };
  let h='<h2 class="sec">실험 기록</h2>';
  h+='<p class="sec-desc">무엇을 언제 바꿨는지 · 지표 변화와 함께 봐야 개선이 우연인지 알 수 있어요</p>';
  h+='<div class="section-block">';
  h+=[...list].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(x=>{
    const color=STATE[x.status]||'#3182F6';
    const metrics=(x.metrics||[]).map(m=>{
      const before=Number(m.before), after=Number(m.after);
      if(!isFinite(before)||!isFinite(after)) return '';
      const up=after>=before;
      const good=(m.lowerIsBetter? !up : up);
      const unit=m.unit||'%';
      return `<div class="exp-metric"><span class="exp-metric-name">${m.label||''}</span>
        <span>${before}${unit} → <b>${after}${unit}</b></span>
        <span class="${good?'up-txt':'down-txt'}">${up?'▲':'▼'} ${Math.abs(after-before).toFixed(1)}${unit==='%'?'%p':unit}</span></div>`;
    }).join('');
    return `<div class="exp">
      <div class="exp-head">
        <span class="exp-date">${x.date||''}</span>
        <span class="exp-title">${x.title||''}</span>
        <span class="exp-state" style="background:${color};">${x.status||'진행중'}</span>
      </div>
      ${x.note?`<div class="exp-note">${x.note}</div>`:''}
      ${metrics?`<div class="exp-metrics">${metrics}</div>`:''}
    </div>`;
  }).join('');
  h+='</div>';
  wrap.innerHTML=h;
}

// ===== 손익 (pnl.json) =====
// 회계 기준(배송완료·부가세 제외)이라 대시보드의 주문 기준 매출과 값이 다르다.
// 차이 = 부가세 10% + 선수금(결제됐지만 미발송). 그래서 목표 달성률은 이 파일 값으로 계산한다.
// 파일이 없으면 관련 섹션은 나타나지 않는다.
let PNL=null;
async function ensurePnl(){
  if(PNL!==null) return PNL;
  try{
    const r=await fetch('./pnl.json',{cache:'no-store'});
    PNL = r.ok ? await r.json() : false;
  }catch(e){ PNL=false; }
  return PNL;
}

// 매출 탭 하단 손익 섹션
async function loadPnlSection(){
  const wrap=document.getElementById('pnlWrap');
  if(!wrap) return;
  const p=await ensurePnl();
  const rows=(p && Array.isArray(p.actuals)) ? p.actuals : [];
  if(!rows.length){ wrap.innerHTML=''; return; }
  const plan=p.plan||{};
  const ref=p.reference2025H1||{};

  const calc=rows.map(r=>({
    ...r,
    costRate: r.revenue? r.cost/r.revenue*100 : 0,
    adRate:   r.revenue? (r.ad||0)/r.revenue*100 : 0,
    roas:     r.ad? r.revenue/r.ad : 0,
  }));
  const last=calc[calc.length-1];
  const tot={revenue:0,cost:0,ad:0};
  calc.forEach(r=>{ tot.revenue+=r.revenue; tot.cost+=r.cost; tot.ad+=(r.ad||0); });
  const totCostRate=tot.revenue? tot.cost/tot.revenue*100 : 0;

  let h='<h2 class="sec">손익 (회계 기준)</h2>';
  h+='<p class="sec-desc">배송완료·부가세 제외 · 위 거래액·실매출은 주문일·부가세 포함이라 값이 다릅니다</p>';

  // 월별 표
  h+='<div class="section-block">';
  h+=`<div class="pnl-row pnl-head"><span>월</span><span>매출액</span><span>매출원가</span><span>원가율</span><span>광고비</span><span>광고비율</span></div>`;
  h+=calc.map(r=>{
    const over = plan.costRate!=null && r.costRate>plan.costRate;
    return `<div class="pnl-row">
      <span>${r.month.slice(5)}월</span>
      <span>${won(r.revenue)}</span>
      <span>${won(r.cost)}</span>
      <span class="${over?'down-txt':''}"><b>${r.costRate.toFixed(1)}%</b></span>
      <span>${won(r.ad||0)}</span>
      <span>${r.adRate.toFixed(1)}%</span>
    </div>`;
  }).join('');
  h+=`<div class="pnl-row pnl-total">
      <span>누적</span><span>${won(tot.revenue)}</span><span>${won(tot.cost)}</span>
      <span><b>${totCostRate.toFixed(1)}%</b></span><span>${won(tot.ad)}</span>
      <span>${(tot.ad/tot.revenue*100).toFixed(1)}%</span></div>`;
  h+='</div>';

  // 원가율 추이 — 목표선과 함께
  if(calc.length>=3){
    const labels=calc.map(r=>r.month.slice(5)+'월');
    h+='<div class="section-title">원가율 추이';
    if(plan.costRate!=null) h+=`<span class="badge">목표 ${plan.costRate}%</span>`;
    if(ref.costRate!=null) h+=`<span class="badge">2025 상반기 ${ref.costRate}%</span>`;
    h+='</div>';
    h+='<div class="funnel card-gap">'+miniLineChart(labels, calc.map(r=>r.costRate), '#F04452', v=>v.toFixed(1)+'%')+'</div>';
  }
  wrap.innerHTML=h;
}

// 그로스 탭: 사업 목표 (매출·원가율·연누적)
async function businessGoalHTML(){
  const p=await ensurePnl();
  if(!p || !Array.isArray(p.actuals) || !p.actuals.length) return '';
  const plan=p.plan||{}; const rows=p.actuals;
  const last=rows[rows.length-1];
  const cum=rows.reduce((s,r)=>s+r.revenue,0);
  const costRate=last.revenue? last.cost/last.revenue*100 : 0;

  const bar=(pct, cls)=>`<div class="goal-track"><div class="goal-fill ${cls}" style="width:${Math.max(0,Math.min(100,pct)).toFixed(1)}%"></div></div>`;
  const items=[];
  if(plan.monthlyRevenue){
    const pct=last.revenue/plan.monthlyRevenue*100;
    items.push(`<div class="goal">
      <div class="goal-top"><span class="goal-label">월 매출 <span class="badge">${last.month}</span></span>
        <span class="goal-nums"><b>${won(last.revenue)}</b> <span class="goal-target">/ ${won(plan.monthlyRevenue)}</span></span></div>
      ${bar(pct,'')}
      <div class="goal-foot"><span>목표 ${won(plan.monthlyRevenue)}</span><span class="goal-pct">${pct.toFixed(0)}% 달성</span></div>
    </div>`);
  }
  if(plan.costRate!=null){
    // 원가율은 낮을수록 좋다. 목표를 넘으면 빨간 막대.
    const over=costRate>plan.costRate;
    const pct=over?100:costRate/plan.costRate*100;
    items.push(`<div class="goal ${over?'is-back':''}">
      <div class="goal-top"><span class="goal-label">원가율</span>
        <span class="goal-nums"><b>${costRate.toFixed(1)}%</b> <span class="goal-target">/ ${plan.costRate}%</span></span></div>
      ${bar(pct, over?'':'')}
      <div class="goal-foot"><span>목표 ${plan.costRate}% 이하</span>
        <span class="goal-pct">${over?`${(costRate-plan.costRate).toFixed(1)}%p 초과`:'목표 내'}</span></div>
    </div>`);
  }
  if(plan.yearRevenue){
    const pct=cum/plan.yearRevenue*100;
    items.push(`<div class="goal">
      <div class="goal-top"><span class="goal-label">연 누적 매출</span>
        <span class="goal-nums"><b>${won(cum)}</b> <span class="goal-target">/ ${won(plan.yearRevenue)}</span></span></div>
      ${bar(pct,'')}
      <div class="goal-foot"><span>${rows.length}개월 누적</span><span class="goal-pct">${pct.toFixed(0)}% 진행</span></div>
    </div>`);
  }
  if(!items.length) return '';

  // 비용 추세 — 판단 없이 숫자와 비교값만
  const ref=p.reference2025H1||{};
  const adRate=last.revenue? (last.ad||0)/last.revenue*100 : 0;
  const prev=rows.length>1? rows[rows.length-2] : null;
  const prevAdRate=prev&&prev.revenue? (prev.ad||0)/prev.revenue*100 : null;
  let trend='<div class="sum-rows"><div class="sum-line"><span class="sum-tag">비용 추세</span><span>'
    + `광고비율 <b>${adRate.toFixed(1)}%</b>`
    + (prevAdRate!=null? ` <span style="color:var(--muted);">(전월 ${prevAdRate.toFixed(1)}%)</span>`:'')
    + (ref.adRate!=null? ` · 2025 상반기 ${ref.adRate}%`:'')
    + ` &nbsp;·&nbsp; 원가율 <b>${costRate.toFixed(1)}%</b>`
    + (ref.costRate!=null? ` <span style="color:var(--muted);">(2025 상반기 ${ref.costRate}%)</span>`:'')
    + '</span></div></div>';

  return '<div class="summary"><div class="sum-head">2026 사업 목표 <span class="badge" style="font-weight:500;">회계 기준</span></div>'
       + '<div class="goal-list">'+items.join('')+'</div>' + trend + '</div>';
}

async function loadRevenue(){
  showLoading();
  try{
    const daily=(await ensureRevenue()).daily||[];
    const inRange=(d,s0,e0)=>d>=s0 && d<=e0;
    const sumRange=(s0,e0)=>{
      const rows=daily.filter(d=>inRange(d.date,s0,e0));
      const agg={gmv:0,net:0,count:0,refund:0,items:{}};
      rows.forEach(r=>{
        agg.gmv+=r.gmv; agg.net+=r.net; agg.count+=r.count; agg.refund+=r.refund;
        (r.topItems||[]).forEach(it=>{
          const k=it.product_no;
          if(!agg.items[k]) agg.items[k]={name:it.name,amt:0,qty:0};
          agg.items[k].amt+=it.amt; agg.items[k].qty+=it.qty;
        });
      });
      agg.aov = agg.count? Math.round(agg.net/agg.count):0;
      // 할인 종류별 / 카테고리별 합산 (파이프라인이 discounts·categories를 넣어준 경우)
      agg.discounts = {}; agg.categories = {}; agg.coupons = {};
      rows.forEach(r=>{
        Object.entries(r.discounts||{}).forEach(([k,v])=>{ agg.discounts[k]=(agg.discounts[k]||0)+v; });
        (r.categories||[]).forEach(c=>{
          if(!agg.categories[c.name]) agg.categories[c.name]={name:c.name, amt:0, qty:0, orders:0, prods:{}};
          const t=agg.categories[c.name];
          t.amt+=c.amt; t.qty+=c.qty; t.orders+=(c.orders||0);
          // 축 안의 상품별 합산 (상품명 함께 보기)
          (c.products||[]).forEach(p=>{
            const k=String(p.pno);
            if(!t.prods[k]) t.prods[k]={pno:p.pno, name:p.name, amt:0, qty:0};
            t.prods[k].amt+=p.amt; t.prods[k].qty+=p.qty;
          });
        });
        agg.bothAxis=(agg.bothAxis||0)+(r.bothAxisProducts||0);
        // 쿠폰명별 (파이프라인이 coupons 를 넣어준 경우)
        (r.coupons||[]).forEach(c=>{
          if(!agg.coupons[c.name]) agg.coupons[c.name]={name:c.name, amt:0, count:0, percent:c.percent||''};
          agg.coupons[c.name].amt+=c.amt; agg.coupons[c.name].count+=(c.count||0);
        });
      });
      agg.topItems = Object.values(agg.items).sort((a,b)=>b.amt-a.amt).slice(0,5);
      return agg;
    };
    const as=$('s').value, ae=$('e').value;
    const after=sumRange(as,ae);
    const before = $('cmp').checked ? sumRange($('cs').value,$('ce').value) : after;
    const periodBeforeStr = $('cmp').checked ? `${$('cs').value} ~ ${$('ce').value}` : '';
    const dailyRows = daily.filter(d=>inRange(d.date,as,ae)).sort((x,y)=>x.date.localeCompare(y.date));
    renderRevenue({periodBefore:periodBeforeStr, periodAfter:`${as} ~ ${ae}`, revenue:{before,after}, dailyRows});
  }catch(e){
    showErr('매출 데이터를 불러오지 못했습니다.<br><span style="font-size:12px;">레포에 revenue-daily.json 파일이 있는지 확인해주세요.</span>');
  }
}
function renderRevenue(d){
  const cmpOn=$('cmp').checked;
  const b=d.revenue.before, a=d.revenue.after;
  let h = '';

  // 거래액(GMV) → 할인 → 환불 → 실매출(net) 흐름으로 봄
  // cafe24 기준: 최초결제액 = net + refund 이므로, 할인액 = gmv - (net + refund)
  const discB = Math.max(0, b.gmv - (b.net + b.refund));
  const discA = Math.max(0, a.gmv - (a.net + a.refund));
  const rows=[
    {label:'거래액(GMV)', b:b.gmv, a:a.gmv},
    {label:'할인액',  b:discB, a:discA, lower:true},
    {label:'할인율',  b:b.gmv?discB/b.gmv*100:0, a:a.gmv?discA/a.gmv*100:0, unit:'percent', lower:true},
    {label:'환불액',  b:b.refund, a:a.refund, lower:true},
    {label:'환불율',  b:b.gmv?b.refund/b.gmv*100:0, a:a.gmv?a.refund/a.gmv*100:0, unit:'percent', lower:true},
    {label:'실매출(net)', b:b.net, a:a.net},
    {label:'주문 건수', b:b.count, a:a.count, unit:'count'},
    {label:'객단가',   b:b.aov, a:a.aov},
  ];
  const fmtVal=(v,unit)=> unit==='percent' ? v.toFixed(2)+'%' : (unit==='count' ? fmt(v)+'건' : won(Math.round(v)));
  h+='<h2 class="sec">매출 요약</h2>';
  h+='<p class="sec-desc">할인·환불은 낮을수록 좋아 증감 색이 반대</p>';
  h+='<div class="kpis">'+rows.map(r=>{
    const x=delta(r.b,r.a,r.lower);
    return `<div class="kpi"><div class="k-label">${r.label}</div><div class="k-now">${fmtVal(r.a,r.unit)}</div>`
      + (cmpOn ? `<div class="delta ${x.good?'good':'bad'}">${x.up?'▲':'▼'} ${x.text}</div><div class="k-was">비교: ${fmtVal(r.b,r.unit)}</div>` : '')
      + `</div>`;
  }).join('')+'</div>';

  h+='<h2 class="sec">매출 추이</h2>';
    h+='<div id="revTrendWrap"><div class="funnel"><div class="state"><div class="spinner"></div>추이 불러오는 중…</div></div></div>';

  // ===== 할인 종류별 =====
  h+='<h2 class="sec">할인 종류별</h2>';
  const dcur=a.discounts||{}, dprev=b.discounts||{};
  const dKeys=Object.keys(dcur).sort((x,y)=>dcur[y]-dcur[x]);
  if(dKeys.length){
    h+='<p class="sec-desc">쿠폰 행을 펼치면 쿠폰명별 내역</p>';
    const maxD=Math.max(...dKeys.map(k=>dcur[k]),1);
    // 쿠폰 행에는 쿠폰명별 내역을 접어서 붙인다 (파이프라인이 coupons 를 채운 경우)
    const cpList=Object.values(a.coupons||{}).sort((x,y)=>y.amt-x.amt);
    const cpPrev=b.coupons||{};
    h+='<div class="section-block">'+dKeys.map(k=>{
      const w=Math.max(dcur[k]/maxD*100,3);
      let cmpHtml='';
      if(cmpOn){
        const pv=dprev[k]||0; const dv=delta(pv,dcur[k],true);
        cmpHtml=`<div class="slotbar-meta">비교 ${won(pv)} <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span></div>`;
      }
      const share=discA? (dcur[k]/discA*100).toFixed(1) : '0.0';
      // '쿠폰'으로 시작하는 행(쿠폰 / 쿠폰(배송비))에만 쿠폰명별 상세를 붙임
      let detail='';
      if(k.startsWith('쿠폰') && cpList.length){
        const maxC=Math.max(...cpList.map(c=>c.amt),1);
        detail='<div class="cp-list">'+cpList.map(c=>{
          const cw=Math.max(c.amt/maxC*100,3);
          const pv=cpPrev[c.name]?cpPrev[c.name].amt:0;
          const cmp=cmpOn? ` · 비교 ${won(pv)}` : '';
          return `<div class="cp-row">
            <div class="cp-name">${c.name}${c.percent?` <span class="cp-pct">${c.percent}</span>`:''}</div>
            <div class="cp-track"><div class="cp-fill" style="width:${cw}%;"></div></div>
            <div class="cp-val">${won(c.amt)}<span class="cp-cnt">${fmt(c.count)}건${cmp}</span></div>
          </div>`;
        }).join('')+'</div>';
      }
      const summary=`<div class="slotbar-row">
        <div><div class="slotbar-head"><span class="slotbar-name" style="cursor:default;">${k}</span>${detail?rowToggleBtn():''}</div><div class="slotbar-meta">전체 할인 중 ${share}%${detail?` · 쿠폰 ${cpList.length}종`:''}</div>${cmpHtml}</div>
        <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#FF7A00;"></div></div>
        <div><div class="slotbar-val">${won(dcur[k])}</div><div class="slotbar-sub">할인액</div></div>
      </div>`;
      return rowItem(summary, detail);
    }).join('')+'</div>';
  } else {
    h+='<div class="section-block"><div class="state">할인 종류별 데이터가 아직 없어요.<br><span style="font-size:12px;">build_revenue_daily.py 최신본이 돌아간 날짜부터 쿠폰·회원등급·적립금·상품 추가할인 등으로 나뉘어 표시됩니다.</span></div></div>';
  }

  // ===== 카테고리별 =====
  h+='<h2 class="sec">아트 · 라이프 거래액</h2>';
  const AXIS_COLOR={'아트':'#3182F6','라이프':'#00B26B','미분류':'#B0B8C1'};
  const cats=Object.values(a.categories||{}).sort((x,y)=>y.amt-x.amt);
  const catsPrev=a.categories? (b.categories||{}) : {};
  if(cats.length){
    // 상품이 아트·라이프 양쪽에 속하면 두 축에 모두 계상돼 합계가 GMV 를 넘는다.
    // 숫자가 안 맞아 보이는 이유이므로 중복 상품 수를 함께 알린다.
    if(a.bothAxis) h+=`<p class="sec-desc">양쪽에 모두 속한 상품 ${fmt(a.bothAxis)}종은 두 축에 중복 계상돼 합계가 거래액을 넘습니다</p>`;
    const maxC=Math.max(...cats.map(c=>c.amt),1);
    h+='<div class="section-block">'+cats.map(c=>{
      const w=Math.max(c.amt/maxC*100,3);
      const color=AXIS_COLOR[c.name]||'#8B95A1';
      let cmpHtml='';
      if(cmpOn){
        const p=catsPrev[c.name]; const pv=p?p.amt:0; const dv=delta(pv,c.amt);
        cmpHtml=`<div class="slotbar-meta">비교 ${won(pv)} <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span></div>`;
      }
      const unit = c.qty? Math.round(c.amt/c.qty) : 0;
      // 축 안에서 무엇이 팔렸는지 — 펼치면 상품명별 내역
      const prods=Object.values(c.prods||{}).sort((x,y)=>y.amt-x.amt).slice(0,10);
      let detail='';
      if(prods.length){
        const maxP=Math.max(...prods.map(p=>p.amt),1);
        detail='<div class="cp-list">'+prods.map(p=>{
          const pw=Math.max(p.amt/maxP*100,3);
          return `<div class="cp-row">
            <div class="cp-name">${p.name||`<span style="color:var(--muted);">#${p.pno}</span>`}</div>
            <div class="cp-track"><div class="cp-fill" style="width:${pw}%;background:${color};"></div></div>
            <div class="cp-val">${won(p.amt)}<span class="cp-cnt">${fmt(p.qty)}개</span></div>
          </div>`;
        }).join('')+'</div>';
      }
      const summary=`<div class="slotbar-row">
        <div><div class="slotbar-head"><span class="slotbar-name" style="cursor:default;">${c.name}</span>${detail?rowToggleBtn():''}</div>
          <div class="slotbar-meta">${fmt(c.qty)}개 판매 · 개당 ${won(unit)}${prods.length?` · 상품 ${prods.length}종`:''}</div>${cmpHtml}</div>
        <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${color};"></div></div>
        <div><div class="slotbar-val">${won(c.amt)}</div><div class="slotbar-sub">거래액</div></div>
      </div>`;
      return rowItem(summary, detail);
    }).join('')+'</div>';
  } else {
    h+='<div class="section-block"><div class="state">아직 데이터가 없어요.<br><span style="font-size:12px;">build_revenue_daily.py 최신본이 분류 트리로 아트·라이프를 판정하면 이 자리에 표시됩니다.</span></div></div>';
  }

  h+='<h2 class="sec">판매 TOP 5 (선택 기간)</h2>';
  if(a.topItems && a.topItems.length){
    const maxAmt=Math.max(...a.topItems.map(it=>it.amt),1);
    h+='<div class="section-block">'+a.topItems.map(it=>{
      const w=Math.max(it.amt/maxAmt*100,4);
      return `<div class="slotbar-row">
        <div><span class="slotbar-name" style="cursor:default;">${it.name}</span></div>
        <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#3182F6;"></div></div>
        <div><div class="slotbar-val">${won(it.amt)}</div><div class="slotbar-sub">${it.qty}개</div></div>
      </div>`;
    }).join('')+'</div>';
  } else {
    h+='<div class="section-block"><div class="state">데이터 없음</div></div>';
  }

  h+='<div id="pnlWrap"></div>';
  $('content').innerHTML=h;
  drawRevenueTrend();
  loadPnlSection();          // 손익 (pnl.json 이 있으면 표시)
}

// 매출 추이: 상단에서 고른 기간을 그대로 사용, 비교 켜면 비교 기간도 점선으로
function drawRevenueTrend(){
  const wrap=$('revTrendWrap');
  if(!wrap) return;
  const all=(REVENUE_CACHE && REVENUE_CACHE.daily) ? REVENUE_CACHE.daily : [];
  if(!all.length){ wrap.innerHTML='<div class="funnel"><div class="state">매출 데이터가 없습니다</div></div>'; return; }

  const cmpOn=$('cmp').checked;
  const cut=(s0,e0)=>all.filter(d=>d.date>=s0 && d.date<=e0).sort((a,b)=>a.date.localeCompare(b.date));
  const drRaw=cut($('s').value, $('e').value);
  const dpRaw=cmpOn? cut($('cs').value, $('ce').value) : [];

  if(drRaw.length<2){
    wrap.innerHTML='<div class="funnel"><div class="state">선택한 기간이 하루라 추이가 그려지지 않아요. 위에서 기간을 2일 이상으로 넓혀보세요.</div></div>';
    return;
  }

  // 긴 기간은 주별·월별로 묶어서 그린다. 합산 후 비율·객단가를 계산하므로 값은 가중평균이 되어 정확함.
  const bmode=bucketModeFor(drRaw.length);
  const bNote=bucketNoteOf(bmode);
  const dr=bucketRows(drRaw,bmode), dp=bucketRows(dpRaw,bmode);
  const dayLab=(d)=>d.slice(5).replace('-','/');
  const lab=labelerFor(bmode, dayLab);

  const labels=dr.map(lab);
  const prevLabels=dp.length? dp.map(lab) : null;
  const refunds=dr.map(r=>r.refund||0);
  const refundsPrev=dp.length? dp.map(r=>r.refund||0) : null;
  const totalRef=refunds.reduce((x,z)=>x+z,0);
  const totalGmv=dr.reduce((x,r)=>x+(r.gmv||0),0);
  const sumNet=dr.reduce((x,r)=>x+r.net,0), sumCnt=dr.reduce((x,r)=>x+r.count,0);

  const card=(title,color,total,svg)=>`<div class="funnel card-gap"><div class="mini-head"><span class="mini-dot" style="background:${color}"></span>${title}<span class="mini-total">${total}</span></div>${svg}</div>`;
  const pick=(vals)=>cmpOn&&vals&&vals.length? vals : null;

  let h='';
  // 매출 vs 환불 (한 차트에 두 지표) — 제일 중요하니 맨 위
  h+=`<div class="section-title">실매출 vs 환불액${bNote}</div>`;
  h+='<div class="funnel card-gap">'
    + dualLineChart(labels,
        {name:'실매출', values:dr.map(r=>r.net), color:'#3182F6'},
        {name:'환불액',   values:refunds,          color:'#F04452'},
        v=>wonAxis(v))
    + '</div>';

  h+=card('실매출'+bNote,'#3182F6', won(sumNet),
      compareLineChart(labels, dr.map(r=>r.net), pick(dp.map(r=>r.net)), '#3182F6', v=>wonAxis(v), '실매출', prevLabels));
  h+=card('주문 건수'+bNote,'#00B26B', fmt(sumCnt)+'건',
      verticalBarChart(labels, dr.map(r=>r.count), '#00B26B', v=>fmt(Math.round(v)),
        cmpOn&&dp.length? dp.map(r=>r.count):null, '주문 건수'));
  h+=card('객단가'+bNote,'#FF9500', won(sumCnt? Math.round(sumNet/sumCnt) : 0),
      compareLineChart(labels, dr.map(r=>r.count?Math.round(r.net/r.count):0),
        pick(dp.map(r=>r.count?Math.round(r.net/r.count):0)), '#FF9500', v=>wonAxis(v), '객단가', prevLabels));
  h+=card('환불액'+bNote,'#F04452', won(totalRef),
      compareLineChart(labels, refunds, cmpOn&&dp.length? refundsPrev:null, '#F04452', v=>wonAxis(v), '환불액', prevLabels));
  h+=card('환불율'+bNote,'#F471B5', (totalGmv?(totalRef/totalGmv*100).toFixed(2):0)+'%',
      compareLineChart(labels, dr.map(r=>r.gmv?Number((r.refund/r.gmv*100).toFixed(2)):0),
        pick(dp.map(r=>r.gmv?Number((r.refund/r.gmv*100).toFixed(2)):0)), '#F471B5', v=>v.toFixed(1)+'%', '환불율', prevLabels));
  // 할인: 금액과 비율을 같이 (할인액 = 거래액 - (실매출 + 환불))
  const disc=dr.map(r=>Math.max(0,(r.gmv||0)-((r.net||0)+(r.refund||0))));
  const discPrev=dp.length? dp.map(r=>Math.max(0,(r.gmv||0)-((r.net||0)+(r.refund||0)))) : null;
  const totalDisc=disc.reduce((x,z)=>x+z,0);
  h+=card('할인액'+bNote,'#FF7A00', won(totalDisc),
      compareLineChart(labels, disc, cmpOn&&dp.length? discPrev:null, '#FF7A00', v=>wonAxis(v), '할인액', prevLabels));
  h+=card('할인율'+bNote,'#D96500', (totalGmv?(totalDisc/totalGmv*100).toFixed(2):0)+'%',
      compareLineChart(labels, dr.map(r=>r.gmv?Number((Math.max(0,r.gmv-(r.net+r.refund))/r.gmv*100).toFixed(2)):0),
        pick(dp.map(r=>r.gmv?Number((Math.max(0,r.gmv-(r.net+r.refund))/r.gmv*100).toFixed(2)):0)), '#D96500', v=>v.toFixed(1)+'%', '할인율', prevLabels));

  wrap.innerHTML=h;
}

// 비밀번호 게이트: 여기 'PASSWORD_HERE' 값을 원하는 비밀번호로 바꾸세요.

function tryUnlock(){
  const input = document.getElementById('authPw').value;
  if(input === DASHBOARD_PASSWORD){
    sessionStorage.setItem('pbg_authed','1');
    document.getElementById('authGate').remove();
    stateFromUrl();
  syncCmpEnabled();
  load();
  } else {
    document.getElementById('authErr').style.display='block';
  }
}

  load();
}
