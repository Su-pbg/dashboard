<!DOCTYPE html>
<!--
  PBG Product Dashboard
  변경 이력은 같은 폴더의 CHANGELOG.md 를 참고하세요.
  (수정할 때 CHANGELOG.md 에도 무엇을/왜 바꿨는지 함께 남겨주세요)
-->
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintBakery Product Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    /* ── 색 ──────────────────────────────────────────────
       중성 그레이 스케일. 카드는 흰색, 배경은 그레이50.
       테두리를 쓰지 않고 배경 대비만으로 면을 구분하는 것이 이 톤의 핵심. */
    --paper:#F2F4F6;      /* 페이지 배경 (그레이50) */
    --surface:#FFFFFF;    /* 카드 */
    --fill:#F2F4F6;       /* 입력·트랙 등 채워진 면 */
    --ink:#191F28;        /* 본문 (그레이900) */
    --ink-2:#4E5968;      /* 보조 본문 (그레이700) */
    --muted:#8B95A1;      /* 캡션 (그레이600) */
    --ghost:#B0B8C1;      /* 비활성 (그레이500) */
    --hair:#E5E8EB;       /* 구분선 (그레이200) — 카드 외곽엔 쓰지 않음 */
    --accent:#3182F6;     /* 기준색 (블루) */
    --accent-soft:#E8F3FF;
    --accent-press:#1B64DA;
    --up:#00B26B;   --up-soft:#E7F9F0;
    --down:#F04452; --down-soft:#FEECEE;
    /* ── 데이터 색 ── 채도를 낮춘 한 계열로 묶어 산만해지지 않게 */
    --d-rev:#3182F6;  /* 매출 */
    --d-ses:#00B26B;  /* 세션 */
    --d-buy:#8B5CF6;  /* 구매 */
    --d-aov:#FF9500;  /* 객단가 */
    --d-ref:#F04452;  /* 환불 */
    --d-dis:#FF7A00;  /* 할인 */
    /* ── 글꼴 ──────────────────────────────────────────
       모노스페이스를 쓰지 않는다. 숫자는 body 의 tabular-nums 로 자리를 맞춘다.
       --mono 는 참조가 많아 이름만 남기고 sans 를 가리키게 둠. */
    --sans:'Pretendard Variable','Pretendard',-apple-system,system-ui,sans-serif;
    --mono:'Pretendard Variable','Pretendard',-apple-system,system-ui,sans-serif;
    /* ── 여백 스케일 ── 4의 배수로 통일 */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
    --r-card:18px; --r-ctrl:12px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;}  /* 숫자 폭 고정 → 모노 없이도 표가 안 흔들림 */
  .wrap{max-width:1120px;margin:0 auto;padding:var(--s8) var(--s6) 96px;}
  .top-rule{display:none;}   /* 장식용 막대 제거 — 이 톤에서는 여백이 그 역할을 한다 */
  .eyebrow{font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:600;margin:0 0 var(--s2);}
  h1{font-size:28px;font-weight:700;margin:0 0 var(--s2);letter-spacing:-.03em;line-height:1.25;}
  .sub{font-size:14px;color:var(--muted);margin:0 0 var(--s7);}
  .tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--hair);margin-bottom:var(--s6);flex-wrap:wrap;}
  .tab{padding:var(--s3) var(--s4);font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;border:0;background:none;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s;font-family:var(--sans);letter-spacing:-.01em;}
  .tab:hover{color:var(--ink-2);}
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;}
  .tab .soon{font-size:11px;color:var(--muted);background:var(--fill);border:0;border-radius:6px;padding:2px 6px;margin-left:var(--s2);font-weight:600;}
  .controls{display:flex;flex-direction:column;gap:var(--s3);background:var(--surface);border:0;border-radius:var(--r-card);padding:var(--s4) var(--s5);margin-bottom:var(--s5);}
  .ctrl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .ctrl-row-main{display:grid;grid-template-columns:minmax(0,auto) minmax(0,auto) minmax(0,auto) minmax(0,auto);gap:var(--s4) var(--s5);align-items:end;}
  .ctrl-row-split{justify-content:space-between;align-items:center;padding-top:var(--s4);border-top:1px solid var(--hair);min-height:40px;}
  .excl-group{display:flex;flex-wrap:wrap;gap:var(--s5);align-items:center;}
  .btn-group{display:flex;gap:var(--s2);align-items:center;}
  .ctrl{display:flex;flex-direction:column;gap:var(--s2);min-width:0;}
  .ctrl label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:-.01em;}
  .ctrl .pair{display:flex;gap:4px;align-items:center;}
  .ctrl .pair>span{font-size:13px;color:var(--muted);line-height:40px;}
  input[type=date]{font-family:var(--sans);font-size:14px;font-weight:500;border:0;border-radius:var(--r-ctrl);padding:0 var(--s3);height:40px;color:var(--ink);background:var(--fill);min-width:0;flex:1 1 0;}
  input[type=date]:focus-visible,select.ctrl-sel:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  select.ctrl-sel{font-family:var(--sans);font-size:14px;font-weight:500;border:0;border-radius:var(--r-ctrl);padding:0 var(--s3);height:40px;color:var(--ink);background:var(--fill);min-width:0;cursor:pointer;}
  .ctrl-row>label.excl{padding-bottom:9px;}
  .ctrl.is-off label{color:var(--ghost);}
  .ctrl.is-off .pair>span{color:var(--ghost);}
  input[type=date]:disabled,select:disabled{background:var(--fill);color:var(--ghost);cursor:not-allowed;}
  .seg.b{background:var(--paper);color:var(--muted);}
  .preset-btns{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;}
  .preset-sep{width:1px;height:20px;background:var(--hair);margin:0 var(--s1);flex-shrink:0;}
  .ctrl-row-top{padding-top:var(--s4);border-top:1px solid var(--hair);}
  .preset-btns button{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--fill);border:0;border-radius:var(--r-pill);padding:8px 14px;cursor:pointer;font-family:var(--sans);letter-spacing:-.01em;transition:background .12s,color .12s;}
  .preset-btns button:hover{background:#E5E8EB;color:var(--ink);}
  .preset-btns button:active{transform:scale(.97);}
  .preset-btns button.active{background:var(--accent);color:#fff;}
  .preset-btns button.active:hover{background:var(--accent-press);color:#fff;}
  .go{background:var(--accent);color:#fff;border:0;border-radius:var(--r-ctrl);padding:0 var(--s5);height:40px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;font-family:var(--sans);letter-spacing:-.01em;transition:background .12s;}
  .go:hover{background:var(--accent-press);}
  .go:active{transform:scale(.98);}
  .go-ghost{background:var(--fill);color:var(--ink-2);}
  /* 아이콘 전용 버튼 — 유니코드 글리프(↻ 등)는 폰트에 없으면 대체 폰트로 그려져
     베이스라인·글자폭이 어긋난다. 그래서 SVG 로 그리고 정사각형으로 맞춘다. */
  .icon-btn{width:40px;padding:0;flex-shrink:0;}
  .icon-btn svg{display:block;}
  .icon-btn.spinning svg{animation:spin .7s linear infinite;}
  .go-ghost:hover{background:#E5E8EB;}
  .excl{display:flex;align-items:center;gap:var(--s2);font-size:14px;color:var(--ink-2);white-space:nowrap;cursor:pointer;font-weight:500;}
  .excl input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .state{padding:var(--s7) var(--s6);text-align:center;color:var(--muted);font-size:14px;line-height:1.7;}
  .spinner{width:28px;height:28px;border:3px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto var(--s4);}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* 키보드 포커스가 보이게 (버튼류는 위 input 규칙에 없으므로 따로) */
  button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
  /* 모션 최소화 설정을 존중 */
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
  .err{background:var(--down-soft);color:var(--down);border-radius:var(--r-ctrl);padding:var(--s5);font-size:14px;font-weight:500;}
  /* 한 줄에 '최대' 4개.
     4칸으로 고정했더니 카드가 3개인 섹션은 네 번째 칸이 빈 채로 남았다.
     auto-fit + 최소폭 250px 이면 안쪽 폭 1072px 에서 최대 4개까지만 들어가고,
     카드가 3개면 3칸으로 균등 분할돼 빈 칸이 생기지 않는다. */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:var(--s3);margin-bottom:var(--s3);}
  .kpi{background:var(--surface);border:0;border-radius:var(--r-card);padding:var(--s5);display:flex;flex-direction:column;min-height:124px;}
  .kpi .k-label{font-size:13px;color:var(--muted);margin-bottom:var(--s3);font-weight:500;}
  .kpi .k-now{font-family:var(--sans);font-size:24px;font-weight:700;letter-spacing:-.035em;line-height:1.2;}
  .kpi .k-was{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:var(--s2);}
  .delta{display:inline-flex;flex-wrap:wrap;align-items:center;gap:var(--s1);font-family:var(--sans);font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);margin-top:var(--s3);line-height:1.4;align-self:flex-start;}
  .delta.good{color:var(--up);background:var(--up-soft);}.delta.bad{color:var(--down);background:var(--down-soft);}
  h2.sec{font-size:19px;font-weight:700;margin:var(--s8) 0 var(--s3);letter-spacing:-.025em;}
  h2.sec:first-of-type{margin-top:0;}
  .sec-desc{font-size:13px;color:var(--muted);margin:0 0 var(--s4);line-height:1.65;}
  .card-gap{margin-bottom:var(--s3);}
  .funnel{background:var(--surface);border:0;border-radius:var(--r-card);padding:var(--s5);}
  /* ── 구매 전환 퍼널 ──
     통과율·이탈률이 주인공. 세션 수와 막대는 규모를 보여주는 보조 역할. */
  .fstage{padding:var(--s4) 0;border-bottom:1px solid var(--hair);}
  .fstage:first-child{padding-top:0;}
  .fstage:last-child{border-bottom:0;padding-bottom:0;}
  .fstage-head{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3);}
  .fstage-name{font-size:14px;font-weight:700;letter-spacing:-.01em;}
  .fstage-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;}
  .fstage-stats{display:flex;gap:var(--s8);margin-bottom:var(--s3);flex-wrap:wrap;}
  .fstat{min-width:0;}
  .fstat-num{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15;display:flex;align-items:baseline;gap:var(--s2);}
  .fstat-delta{font-size:12px;font-weight:700;letter-spacing:0;white-space:nowrap;}
  .fstat-label{font-size:12px;color:var(--muted);margin-top:var(--s1);font-weight:500;}
  .fstat.is-drop .fstat-num{color:var(--down);}
  .fstage-track{background:var(--fill);border-radius:var(--r-pill);height:8px;overflow:hidden;}
  .fstage-fill{height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .bars{display:grid;gap:var(--s2);}
  .bar-row{display:flex;align-items:center;gap:var(--s3);}.bar-tag{width:26px;font-size:11px;color:var(--muted);text-align:right;font-weight:500;}
  .bar-track{flex:1;background:var(--fill);border-radius:var(--r-pill);height:16px;overflow:hidden;}
  .slotbar-row{display:grid;grid-template-columns:1.5fr 2.5fr auto;gap:var(--s4);align-items:center;min-height:60px;border-bottom:1px solid var(--hair);box-sizing:border-box;padding:var(--s3) 0;}
  /* 행 상세 토글: 좁은 칸에 글자를 밀어넣어 잘리게 하는 대신 접어둔다.
     .slotbar-item 으로 감싸고, 안에 요약행(.slotbar-row) + 상세(.row-detail)를 둔다. */
  .slotbar-item{border-bottom:1px solid var(--hair);}
  .slotbar-item>.slotbar-row{border-bottom:none;}
  /* 이름은 ellipsis로 잘려도 되지만 토글 버튼은 절대 잘리면 안 되므로 형제로 분리 */
  .slotbar-head{display:flex;align-items:center;min-width:0;}
  .slotbar-head>.slotbar-name{flex:1 1 auto;min-width:0;}
  .slotbar-head>.row-toggle{flex:0 0 auto;}
  .row-toggle{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--fill);border:0;border-radius:var(--r-pill);padding:3px 10px;margin-left:var(--s2);cursor:pointer;vertical-align:middle;line-height:1.5;font-family:var(--sans);transition:background .12s;}
  .row-toggle:hover{background:#E5E8EB;color:var(--ink);}
  .row-toggle .chev{display:inline-block;transition:transform .15s;}
  .slotbar-item.open .row-toggle .chev{transform:rotate(180deg);}
  .row-detail{display:none;padding:0 0 10px 0;}
  .slotbar-item.open .row-detail{display:block;}
  .row-detail .slotbar-meta{white-space:normal;overflow:visible;text-overflow:clip;}
  /* 쿠폰명별 내역 (할인 종류별 > 쿠폰 행을 펼쳤을 때) */
  .cp-list{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s2) 0 var(--s1) var(--s4);border-left:2px solid var(--hair);}
  .cp-row{display:grid;grid-template-columns:1.5fr 2.5fr auto;gap:var(--s4);align-items:center;}
  .cp-name{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .cp-pct{font-size:10px;color:var(--muted);}
  .cp-track{height:8px;background:var(--fill);border-radius:var(--r-pill);overflow:hidden;}
  .cp-fill{height:100%;background:var(--d-dis);opacity:.85;border-radius:var(--r-pill);}
  .cp-val{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;letter-spacing:-.02em;}
  .cp-cnt{display:block;font-size:11px;color:var(--muted);font-weight:500;}
  .dow-tag{font-size:11px;font-weight:700;margin-left:var(--s2);}
  /* 회원 수·이탈률 두 차트를 나란히. 값이 13개뿐이라 반씩 나눠도 읽힌다. */
  /* 개요 최상단 요약.
     칸을 나누지 않고 세로로 쌓는다 — 3칸 그리드였을 때 칸마다 글자 길이와 설명 유무가
     달라 균등 분할이 오히려 불균형하게 보였다. 세로 스택은 내용이 길어져도 흔들리지 않는다. */
  .summary{background:var(--surface);border-radius:var(--r-card);padding:var(--s6);margin-bottom:var(--s5);}
  .sum-head{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:var(--s5);letter-spacing:-.01em;}
  /* 목표 진행률 */
  /* 요약 맨 위 매출 규모 */
  .sum-money{padding-bottom:var(--s5);margin-bottom:var(--s5);border-bottom:1px solid var(--hair);}
  .money-label{font-size:13px;color:var(--muted);font-weight:500;margin-right:var(--s2);}
  /* [복원] 목표 스타일 교체 때 함께 지워졌던 증감 칩 */
  .sum-delta{font-size:14px;font-weight:700;letter-spacing:0;white-space:nowrap;}
  .money-main{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;}
  .money-main b{font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.15;}
  .money-sub{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2);font-size:16px;font-weight:600;color:var(--ink-2);}
  .money-gap{font-size:13px;color:var(--muted);font-weight:500;}
  @media(max-width:820px){.money-main b{font-size:26px;}.money-sub{font-size:14px;}}
  .goal-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s6) var(--s7);}
  .goal{min-width:0;}
  .goal-top{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2);}
  .goal-label{font-size:14px;font-weight:600;color:var(--ink);}
  .goal-badge{font-size:10px;font-weight:700;color:#fff;background:var(--up);border-radius:var(--r-pill);padding:2px 7px;margin-left:var(--s2);vertical-align:middle;}
  .goal-nums{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap;}
  .goal-nums b{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.03em;}
  .goal-target{font-size:13px;}
  .goal-track{height:8px;background:var(--fill);border-radius:var(--r-pill);overflow:hidden;}
  .goal-fill{height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .goal.is-done .goal-fill{background:var(--up);}
  .goal.is-back .goal-fill{background:var(--down);}
  .goal-foot{display:flex;justify-content:space-between;gap:var(--s3);font-size:12px;color:var(--muted);margin-top:var(--s2);}
  .goal-pct{font-weight:600;}
  .goal.is-back .goal-pct{color:var(--down);}
  .goal.is-done .goal-pct{color:var(--up);}
  .goal-note{font-size:12px;color:var(--muted);margin-top:var(--s2);line-height:1.6;}
  /* '다음 할 일' 은 나머지 진단 줄보다 눈에 먼저 들어와야 한다 */
  .sum-next{background:var(--accent-soft);border-radius:var(--r-ctrl);padding:var(--s3) var(--s4) !important;margin-bottom:var(--s2);}
  /* 실험 기록 */
  .exp{padding:var(--s4) 0;border-bottom:1px solid var(--hair);}
  .exp:first-child{padding-top:0;}
  .exp:last-child{border-bottom:0;padding-bottom:0;}
  .exp-head{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;}
  .exp-date{font-size:13px;color:var(--muted);font-weight:500;flex:0 0 auto;}
  .exp-title{font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .exp-state{margin-left:auto;font-size:11px;font-weight:700;color:#fff;border-radius:var(--r-pill);padding:2px 8px;flex:0 0 auto;}
  .exp-note{font-size:13px;color:var(--muted);margin-top:var(--s2);line-height:1.6;}
  .exp-metrics{margin-top:var(--s3);display:grid;gap:var(--s2);}
  .exp-metric{display:flex;align-items:baseline;gap:var(--s3);font-size:14px;flex-wrap:wrap;}
  .exp-metric-name{font-size:13px;color:var(--muted);min-width:120px;}
  /* 손익 월별 표 */
  .pnl-row{display:grid;grid-template-columns:56px 1.2fr 1.2fr 76px 1.2fr 76px;gap:var(--s3);

<script>
// ===== 차트 툴팁 (마우스 올리면 실제 수치 표시) =====
(function(){
  let tipEl=null;
  function ensureTip(){
    if(tipEl) return tipEl;
    tipEl=document.createElement('div');
    tipEl.id='chartTip';
    document.body.appendChild(tipEl);
    return tipEl;
  }
  document.addEventListener('mousemove', (e)=>{
    const hit = e.target.closest ? e.target.closest('.chart-hit') : null;
    if(!hit){ if(tipEl) tipEl.style.opacity='0'; return; }
    const svg = hit.ownerSVGElement || hit.closest('svg');
    if(!svg) return;
    let tips;
    try{ tips = JSON.parse(svg.getAttribute('data-tip')||'[]'); }catch(err){ return; }
    const i = Number(hit.getAttribute('data-i'));
    const t = tips[i];
    if(!t) return;
    const el = ensureTip();
    el.innerHTML = `<div class="tip-label">${t.label}</div>` +
      t.rows.map(r=>`<div class="tip-row"><span class="tip-dot" style="background:${r.c}"></span><span class="tip-name">${r.n}</span><span class="tip-val">${r.v}</span></div>`).join('');
    el.style.opacity='1';
    // 화면 밖으로 나가지 않게 위치 보정
    const pad=14;
    const w=el.offsetWidth, h=el.offsetHeight;
    let left=e.clientX+pad, top=e.clientY-h-pad;
    if(left+w>window.innerWidth-8) left=e.clientX-w-pad;
    if(top<8) top=e.clientY+pad;
    el.style.left=left+'px'; el.style.top=top+'px';
    // 세로 커서선 이동
    const cursor = svg.querySelector('.chart-cursor');
    if(cursor){
      const cx = Number(hit.getAttribute('x')) + Number(hit.getAttribute('width'))/2;
      cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx);
      cursor.setAttribute('opacity','0.25');
    }
  });
  document.addEventListener('mouseleave', ()=>{ if(tipEl) tipEl.style.opacity='0'; });
})();

const WORKER="https://proud-sea-35f9.sugim-386.workers.dev";
const $=(id)=>document.getElementById(id);
const nf=new Intl.NumberFormat('ko-KR');
const fmt=(v)=>nf.format(Math.round(v||0));
// 검색어처럼 사용자가 직접 입력한 문자열을 innerHTML 에 넣기 전 이스케이프
const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const delta=(b,a,lowerIsBetter)=>{const p=b===0?0:((a-b)/b*100);const up=a>=b;return{text:(p>0?'+':'')+p.toFixed(1)+'%',good:lowerIsBetter?!up:up,up};};
// unit별로 "실제 증감분"과 "비율"을 함께 만든 표시 문자열
function diffText(before,after,unit){
  const diff=after-before;
  const sign=diff>0?'+':(diff<0?'':'');
  if(unit==='percent'){
    // 이미 %인 지표는 상대비율(%끼리의 %)이 아니라 %p(포인트) 차이로
    return `${sign}${diff.toFixed(1)}%p`;
  }
  if(unit==='duration'){
    const abs=Math.abs(diff); const m=Math.floor(abs/60), sec=Math.round(abs%60);
    const t=m>0?`${m}:${String(sec).padStart(2,'0')}`:`${sec}초`;
    return `${diff<0?'-':'+'}${t}`;
  }
  if(unit==='decimal') return `${sign}${diff.toFixed(1)}`;
  if(unit==='won') return `${sign}${fmt(diff)}원`;
  return `${sign}${fmt(diff)}`; // count
}

// [2026-08-03 탭 정리] 6개 → 4개.
//   · '개요' 는 사실상 목차였다. 목표는 그로스로, 수익은 매출로, 나머지는 고객으로 나누니
//     탭 자체가 필요 없어졌다.
//   · '획득' 탭과 개요의 '①획득' 이 같은 내용이라 '고객' 으로 합쳤다.
//   · '구좌·상품' 은 양이 많아 별도 탭으로 둔다.
//   · 손익은 새 탭이 아니라 '매출' 안에 둔다 — 매출과 원가를 같이 봐야 의미가 있다.
const TABS=[
  {id:'growth',  name:'그로스',    ready:true},   // 주 1회: 목표·다음 할 일
  {id:'revenue', name:'매출',      ready:true},   // 주 1회: 매출·할인·손익
  {id:'customer',name:'고객',      ready:true},   // 필요할 때: 획득·활성화·유지
  {id:'funnel',  name:'퍼널·페이지', ready:true},   // 필요할 때: 퍼널·페이지·스크롤
  {id:'product', name:'구좌·상품',   ready:true},   // 필요할 때: 구좌 성과·상품 성과
];
// 탭은 URL(?tab=) 이 있으면 그것을, 없으면 마지막으로 본 탭을 쓴다.
// URL 이 우선인 이유: 북마크로 특정 탭을 바로 열 수 있어야 하기 때문.
const URL_TAB=new URLSearchParams(location.search).get('tab');
const SAVED_TAB=localStorage.getItem('pbg_dashboard_tab');
let TAB = (URL_TAB && TABS.find(t=>t.id===URL_TAB)) ? URL_TAB
        : ((SAVED_TAB && TABS.find(t=>t.id===SAVED_TAB)) ? SAVED_TAB : 'overview');
$('tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.id===TAB?'active':''}" data-tab="${t.id}">${t.name}${t.ready?'':'<span class="soon">준비중</span>'}</button>`).join('');
$('tabs').addEventListener('click',(e)=>{const b=e.target.closest('.tab');if(!b)return;
  TAB=b.dataset.tab;
  localStorage.setItem('pbg_dashboard_tab',TAB);
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===TAB));load();});

function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(base,n){const d=new Date(base);d.setDate(d.getDate()+n);return d;}

// 달 단위 프리셋(이번달/지난달)을 눌렀을 때는 비교기간도 "직전 달 전체"로 잡음

// 같은 날짜의 1년 전. 2월 29일처럼 전년에 없는 날은 그 달 말일로 당김.
function yearAgo(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const py=y-1;
  const lastDay=new Date(py, m, 0).getDate();
  return `${py}-${String(m).padStart(2,'0')}-${String(Math.min(d,lastDay)).padStart(2,'0')}`;
}
function autoCompare(){
  // 전년 동기: 시작·종료일을 그대로 1년 전으로 옮김. 달 단위 프리셋이어도 같은 규칙
  // (지난달 → 작년 같은 달)이라 MONTH_MODE 분기가 필요 없음.
  if($('cmpMode').value==='yoy'){
    $('cs').value=yearAgo($('s').value);
    $('ce').value=yearAgo($('e').value);
    return;
  }
  const s0=new Date($('s').value), e0=new Date($('e').value);
  if(MONTH_MODE){
    // 선택 기간이 속한 달의 "직전 달 전체"(1일~말일)
    const firstOfSelMonth=new Date(s0.getFullYear(), s0.getMonth(), 1);
    const lastOfPrev=addDays(firstOfSelMonth,-1);
    const firstOfPrev=new Date(lastOfPrev.getFullYear(), lastOfPrev.getMonth(), 1);
    $('cs').value=iso(firstOfPrev); $('ce').value=iso(lastOfPrev);
  } else {
    const days=Math.round((e0-s0)/86400000)+1;
    const ce=addDays(s0,-1), cs=addDays(ce,-(days-1));
    $('cs').value=iso(cs); $('ce').value=iso(ce);
  }
}

// 같은 URL 을 여러 곳에서 각각 부르고 있었다. 대표적으로 loadHeroCharts 와 loadTrend 가
// tab=daily 를 완전히 동일한 주소로 각각 조회해, 비교를 켜면 같은 요청이 4번 나갔다.

// 한 번의 조회(load) 안에서는 같은 URL 이면 결과를 공유한다.
let WREQ = new Map();
function wfetch(url){
  if(WREQ.has(url)) return WREQ.get(url);
  const p = fetch(url,{cache:'no-store'})
    .then(r => r.json())
    .catch(err => { WREQ.delete(url); throw err; });   // 실패는 캐시하지 않음 → 재시도 가능
  WREQ.set(url, p);
  return p;
}

// ===== 긴 기간 자동 묶기 (일별 → 주별 → 월별) =====
// 차트 그림영역 폭이 758px 고정이라, 일별로 그리면 365일에서 슬롯이 2px가 되어
// 막대가 서로 겹친다(비교 켜면 한 슬롯을 둘로 쪼개므로 더 심함).
// 그래서 기간이 길면 데이터를 미리 묶어서 넘긴다. 차트 함수 자체는 손대지 않음.
//   ~62일   일별   (지난달+이번달까지 커버, 막대 폭 4px 이상 확보)
//   ~180일  주별   (최대 26칸 → 막대 폭 약 10px)
//   181일~  월별   (365일이 12칸 → 막대 폭 상한 14px)
function bucketModeFor(n){ return n<=62 ? 'day' : (n<=180 ? 'week' : 'month'); }
// 합산하면 안 되는 '잔액' 성격의 필드. 구간의 마지막 값을 그대로 쓴다.
const STOCK_FIELDS = new Set(['totalMembers']);
// GA4는 'YYYYMMDD', 매출은 'YYYY-MM-DD'로 날짜 형식이 달라서 흡수
function normDate(d){ d=String(d); return d.length===8 && !d.includes('-') ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : d; }
function bucketKeyOf(dateStr, mode){
  const d=normDate(dateStr);
  if(mode==='month') return d.slice(0,7);
  const dt=new Date(d+'T00:00:00');
  const dow=(dt.getDay()+6)%7;            // 월요일=0 으로 맞춤
  dt.setDate(dt.getDate()-dow);
  return iso(dt);                          // 그 주 월요일
}
function bucketLabelOf(key, mode){
  if(mode==='month'){ const [y,m]=key.split('-'); return `${y.slice(2)}/${Number(m)}월`; }
  return key.slice(5).replace('-','/');    // 주 시작일 MM/DD
}
// 숫자 필드는 전부 합산. 합산으로 만든 값에서 비율·객단가를 다시 계산하면
// 자동으로 가중평균이 되므로(예: 월 객단가 = 월 매출합 / 월 건수합) 호출부 수식은 그대로 둬도 맞다.
function bucketRows(rows, mode){
  if(mode==='day' || !rows || !rows.length) return rows;
  const map=new Map();
  for(const r of rows){
    const k=bucketKeyOf(r.date, mode);
    let b=map.get(k);
    if(!b){ b={date:k, _first:normDate(r.date), _days:0}; map.set(k,b); }
    b._days++;
    const nd=normDate(r.date);
    if(nd<b._first) b._first=nd;            // 구간 첫날(선택 기간에 실제로 포함된 날)
    for(const key in r){
      if(key==='date') continue;
      // totalMembers 는 그 시점의 잔액(stock)이라 더하면 안 된다. 30일을 더하면 30배가 된다.
      // 구간 대표값이 필요하므로 마지막 날 값으로 덮어쓴다.
      if(STOCK_FIELDS.has(key)){ b[key]=r[key]; continue; }
      const v=r[key];
      if(typeof v==='number') b[key]=(b[key]||0)+v;
    }
  }
  // 주별 라벨은 달력상 월요일이 아니라 "선택 기간에 실제로 들어있는 첫날"로 표기한다.
  // 그러지 않으면 기간 경계의 첫 칸이 범위 밖 날짜로 표시돼 오해를 부른다.
  const out=[...map.values()].sort((a,b)=>a.date.localeCompare(b.date));
  out.forEach(b=>{ b._label = mode==='month' ? bucketLabelOf(b.date,mode) : b._first.slice(5).replace('-','/'); });
  return out;
}
// 묶은 뒤에는 _label을, 일별이면 원래 라벨 함수를 쓴다

function fmtByUnit(v,unit){
  if(unit==='percent') return v.toFixed(1)+'%';
  if(unit==='duration'){ const m=Math.floor(v/60), s=Math.round(v%60); return m>0?`${m}:${String(s).padStart(2,'0')}`:`${s}초`; }
  if(unit==='decimal') return v.toFixed(1);
  if(unit==='won') return fmt(v)+'원';
  return fmt(v);
}
function kpiHTML(kpis){return '<div class="kpis">'+kpis.map(k=>{const x=delta(k.before,k.after,k.lowerIsBetter);
  const dt=diffText(k.before,k.after,k.unit);
  const wasLabel = $('cmp').checked ? `${cmpModeLabel()}: ${fmtByUnit(k.before,k.unit)}` : '';
  return `<div class="kpi"><div class="k-label">${k.label}</div><div class="k-now">${fmtByUnit(k.after,k.unit)}</div>
  <div class="delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${dt} <span style="opacity:.7;">(${x.text})</span></div><div class="k-was">${wasLabel}</div></div>`;}).join('')+'</div>';}

function auCard(label,before,after,sub,unit){
  const x=delta(before,after);
  const dt=diffText(before,after,unit);
  const valText = unit==='percent' ? after.toFixed(1)+'%' : fmt(after);
  const wasText = unit==='percent' ? before.toFixed(1)+'%' : fmt(before);
  return `<div class="kpi"><div class="k-label">${label}</div><div class="k-now">${valText}</div>
  <div class="delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${dt} <span style="opacity:.7;">(${x.text})</span></div>
  <div class="k-was">${sub?sub+' · ':''}이전: ${wasText}</div></div>`;
}
let TRAFFIC_CACHE=null;
async function trafficRangeSum(s0,e0){
  if(!TRAFFIC_CACHE){
    try{
      const r=await fetch('./traffic-daily.json',{cache:'no-store'});
      TRAFFIC_CACHE=await r.json();
    }catch(e){ TRAFFIC_CACHE={daily:[]}; }
  }
  const daily=TRAFFIC_CACHE.daily||[];
  const rows=daily.filter(x=>x.date>=s0 && x.date<=e0);
  return { uv: rows.reduce((s,x)=>s+(x.uv||0),0), pv: rows.reduce((s,x)=>s+(x.pv||0),0), hasData: rows.length>0 };
}

// 매출 파일을 한 번만 읽어오는 공통 함수 (동시에 여러 곳에서 불려도 요청은 1번만 나감)
let REVENUE_LOADING=null;
async function ensureRevenue(){
  if(REVENUE_CACHE) return REVENUE_CACHE;
  if(!REVENUE_LOADING){
    REVENUE_LOADING = fetch('./revenue-daily.json',{cache:'no-store'})
      .then(r=>r.json())
      .then(j=>{ REVENUE_CACHE=j; REVENUE_LOADING=null; return j; })
      .catch(e=>{ REVENUE_LOADING=null; throw e; });
  }
  return REVENUE_LOADING;
}
// 기간 합계를 한 번의 순회로 모두 계산 (예전엔 net/count/newMembers를 각각 따로 훑었음)
async function revenueRangeSum(s0,e0){
  const j=await ensureRevenue();
  const daily=j.daily||[];
  let net=0,count=0,newMembers=0,gmv=0,refund=0,days=0,withdrawn=0,hasWithdrawn=false;
  for(const x of daily){
    if(x.date>=s0 && x.date<=e0){
      net+=x.net||0; count+=x.count||0; newMembers+=x.newMembers||0;
      gmv+=x.gmv||0; refund+=x.refund||0; days++;
      if(x.withdrawnMembers!=null){ withdrawn+=x.withdrawnMembers; hasWithdrawn=true; }
    }
  }
  return {net,count,newMembers,gmv,refund,days,withdrawn,hasWithdrawn};
}

// 회원 지표 렌더: 총 회원 수 · 순증 · 이탈률 + 월별 추이
// 탈퇴 데이터는 아직 자동 수집이 없어 특정 날짜까지만 존재한다. 없는 구간은 조용히 건너뛰고,
// 데이터가 선택 기간보다 뒤처져 있으면 기준일을 함께 표시한다.
async function loadMemberMetrics(){
  const wrap=document.getElementById('memberWrap');
  if(!wrap) return;
  try{
    const as=$('s').value, ae=$('e').value;
    const cmpOn=$('cmp').checked;
    const [sumA, sumB, infoA, infoB] = await Promise.all([
      revenueRangeSum(as,ae),
      cmpOn ? revenueRangeSum($('cs').value,$('ce').value) : Promise.resolve(null),
      memberRangeInfo(as,ae),
      cmpOn ? memberRangeInfo($('cs').value,$('ce').value) : Promise.resolve(null),
    ]);
    if(infoA.latestTotal==null){ wrap.innerHTML=''; return; }   // 회원 데이터가 아예 없으면 표시 안 함

    const items=[{label:'총 회원 수', before:(infoB&&infoB.endTotal)||infoA.endTotal||infoA.latestTotal,
                  after:infoA.endTotal||infoA.latestTotal, unit:'count'}];

    if(sumA.hasWithdrawn){
      const netA=sumA.newMembers-sumA.withdrawn;
      const netB=(cmpOn&&sumB&&sumB.hasWithdrawn)? sumB.newMembers-sumB.withdrawn : netA;
      items.push({label:'순증 (신규−탈퇴)', before:netB, after:netA, unit:'count'});
      // 이탈률: 기간 탈퇴 ÷ 기간 시작 회원 수. 낮을수록 좋으므로 증감 색을 반대로.
      const chA=infoA.startTotal? sumA.withdrawn/infoA.startTotal*100 : 0;
      const chB=(cmpOn&&sumB&&infoB&&infoB.startTotal)? sumB.withdrawn/infoB.startTotal*100 : chA;
      items.push({label:'이탈률', before:chB, after:chA, unit:'percent', lowerIsBetter:true});
    }

    let note='';
    if(infoA.latestDate && infoA.latestDate < ae){
      note=`<p class="sec-desc">회원 데이터는 ${infoA.latestDate} 까지 · 탈퇴 수집이 자동화되면 최신까지 채워집니다</p>`;
    }
    wrap.innerHTML = kpiHTML(items) + note + memberTrendHTML(await ensureRevenue());
  }catch(e){ wrap.innerHTML=''; }
}

// 월별 회원 수 + 이탈률. 일별 이탈은 대부분 0이라 월 단위로만 의미가 있다.
function memberTrendHTML(j){
  const daily=(j.daily||[]).filter(x=>x.totalMembers!=null);
  if(daily.length<60) return '';
  const bym={};
  for(const x of daily){
    const m=x.date.slice(0,7);
    if(!bym[m]) bym[m]={m, endTotal:0, startTotal:null, wd:0};
    if(bym[m].startTotal==null) bym[m].startTotal=x.totalMembers;
    bym[m].endTotal=x.totalMembers;                  // 잔액이라 마지막 값
    bym[m].wd+=(x.withdrawnMembers||0);
  }
  const rows=Object.values(bym).sort((a,b)=>a.m.localeCompare(b.m)).slice(-13);
  if(rows.length<3) return '';
  const labels=rows.map(r=>`${r.m.slice(2,4)}/${Number(r.m.slice(5,7))}월`);
  const totals=rows.map(r=>r.endTotal);
  const churn=rows.map(r=>r.startTotal? r.wd/r.startTotal*100 : 0);
  let h='<div class="section-title">회원 수 · 이탈률 추이<span class="badge">최근 13개월</span></div>';
  h+='<div class="mini-chart-row">';
  h+='<div class="funnel card-gap"><div class="mini-head"><span class="mini-dot" style="background:var(--d-ses)"></span>총 회원 수'
    + `<span class="mini-total">${fmt(totals[totals.length-1])}명</span></div>`
    + miniLineChart(labels, totals, '#00B26B', v=>fmt(Math.round(v))) + '</div>';
  h+='<div class="funnel card-gap"><div class="mini-head"><span class="mini-dot" style="background:var(--d-ref)"></span>월 이탈률'
    + `<span class="mini-total">${churn[churn.length-1].toFixed(3)}%</span></div>`
    + miniLineChart(labels, churn, '#F04452', v=>v.toFixed(2)+'%') + '</div>';
  h+='</div>';
  return h;
}

// 회원 지표용 조회. totalMembers 는 잔액이라 합산하지 않고 시점 값을 읽는다.
async function memberRangeInfo(s0,e0){
  const j=await ensureRevenue();
  const daily=j.daily||[];
  const withTotal=daily.filter(x=>x.totalMembers!=null);
  const latest=withTotal.length? withTotal[withTotal.length-1] : null;   // 데이터가 있는 마지막 날
  let startTotal=null;                                   // 기간 시작 시점 회원 수 (이탈률 분모)
  for(const x of withTotal){ if(x.date<s0) startTotal=x.totalMembers; else break; }
  const inRange=withTotal.filter(x=>x.date>=s0 && x.date<=e0);
  const endTotal=inRange.length? inRange[inRange.length-1].totalMembers : null;
  if(startTotal==null && inRange.length) startTotal=inRange[0].totalMembers;
  return {
    latestDate: latest?latest.date:null,
    latestTotal: latest?latest.totalMembers:null,
    startTotal, endTotal,
    covered: inRange.length,
    rangeDays: daily.filter(x=>x.date>=s0 && x.date<=e0).length,
  };
}

// ===== 목표 진행률 (개요 최상단) =====
// [2026-08-03 재설계] 처음엔 '가장 큰 병목 하나'를 보여줬는데, 매주 볼 때마다 병목이
// 바뀌면 무엇을 추적하는지가 흐려진다. 단기 목표 2~3개를 정해두고 매주 같은 숫자만
// 확인하는 편이 실제로 개선을 밀고 나가기 쉽다.
//
// 목표값은 코드가 아니라 goals.json 에 둔다. 숫자를 바꿀 때마다 코드를 고치지 않아도 되고,
// 파일이 없으면 이 블록은 그냥 나타나지 않는다(기능이 없어도 대시보드는 정상 동작).
//
// 진행률은 '목표까지 얼마나 남았나'가 아니라 '시작점에서 얼마나 움직였나'로 계산한다.
//   진행률 = (현재 - 시작) / (목표 - 시작)
// 목표 대비 절대 위치만 보면 시작점이 낮았을 때 늘 초라해 보여 동기가 안 붙는다.
let GOALS=null;
async function ensureGoals(){
  if(GOALS!==null) return GOALS;
  try{
    const r=await fetch('./goals.json',{cache:'no-store'});
    GOALS = r.ok ? await r.json() : false;
  }catch(e){ GOALS=false; }
  return GOALS;
}

// 지표 key → 현재값. 없으면 null 을 돌려 그 목표는 건너뛴다.
function goalValue(key, d){
  const f=d.funnel||[];
  const at=(nm)=>f.find(x=>x.name===nm)||{after:0};
  const kpi=(lb)=>(d.kpis||[]).find(k=>k.label===lb);
  const order=at('결제(주문서)').after, buy=at('구매').after, visit=at('방문').after;
  switch(key){
    case 'orderToBuy':   return order? buy/order*100 : null;
    case 'sessionToBuy': return visit? buy/visit*100 : null;
    case 'returning':    return kpi('재방문자 비율')?.after ?? null;
    case 'cartRate':     return kpi('장바구니 전환율')?.after ?? null;
    case 'detailRate':   return kpi('상품조회 전환율')?.after ?? null;
    case 'aov':          return kpi('객단가')?.after ?? null;
    case 'churn':        return kpi('이탈률')?.after ?? null;
    default:             return null;
  }
}
const GOAL_UNIT={ aov:'won' };
const GOAL_LOWER_BETTER=new Set(['churn']);

// 목표가 뒤처졌을 때 무엇을 하면 되는지. 대시보드 안에서 확인 가능한 것만 적는다.
const GOAL_ACTION={
  orderToBuy:   '퍼널·페이지 탭 → 세그먼트 퍼널에서 <b>기기별</b>과 <b>신규/재방문</b>을 비교하세요. '
              + '모바일만 낮으면 결제창 문제, 신규만 낮으면 가입 강제가 원인입니다',
  sessionToBuy: '퍼널·페이지 탭 → <b>개선 기회</b> 순위에서 이탈 인원이 가장 많은 단계를 먼저 보세요',
  returning:    '유지 섹션의 <b>이탈률</b>과 재구매를 함께 보세요. 한 번 산 사람이 돌아오지 않으면 '
              + '매출이 광고비에 묶입니다',
  cartRate:     '구좌·상품 성과 탭에서 유입이 많은 자리와 실제 구매로 이어지는 자리를 비교하세요',
  detailRate:   '획득 탭에서 유입 채널별 품질을 보세요. 유입은 많은데 상품을 안 보는 채널이 있습니다',
  aov:          '매출 탭 → <b>아트·라이프</b>와 <b>할인 종류별</b>을 보세요. 할인율이 객단가를 누르고 있을 수 있습니다',
  churn:        '유지 섹션의 회원 수·이탈률 추이를 보세요. 탈퇴 사유는 cafe24 관리자에서 확인됩니다',
};

async function goalsHTML(d){
  const cfg=await ensureGoals();
  if(!cfg || !Array.isArray(cfg.goals) || !cfg.goals.length) return '';
  const rows=[], tracked=[];
  for(const g of cfg.goals){
    const cur=goalValue(g.key, d);
    if(cur==null || g.target==null) continue;
    const base=(g.baseline!=null)? g.baseline : cur;
    const lower=GOAL_LOWER_BETTER.has(g.key);
    const span=g.target-base;
    // 시작점과 목표가 같으면 진행률을 정의할 수 없다 → 달성 여부만 본다
    let pct = span===0 ? (lower? (cur<=g.target?100:0) : (cur>=g.target?100:0))
                       : (cur-base)/span*100;
    const done = lower ? cur<=g.target : cur>=g.target;
    if(done) pct=100;
    const shown=Math.max(0, Math.min(100, pct));
    const fmtV=(v)=> GOAL_UNIT[g.key]==='won' ? won(v) : v.toFixed(v<1?2:1)+'%';
    // 뒤로 갔으면(진행률 음수) 빨간색으로 알린다
    const cls = done ? 'is-done' : (pct<0 ? 'is-back' : '');
    tracked.push({ g, cur, pct, done, lower });
    rows.push(`<div class="goal ${cls}">
      <div class="goal-top">
        <span class="goal-label">${g.label}${done?'<span class="goal-badge">달성</span>':''}</span>
        <span class="goal-nums"><b>${fmtV(cur)}</b> <span class="goal-target">/ ${fmtV(g.target)}</span></span>
      </div>
      <div class="goal-track"><div class="goal-fill" style="width:${shown.toFixed(1)}%"></div></div>
      <div class="goal-foot">
        <span>시작 ${fmtV(base)} → 목표 ${fmtV(g.target)}</span>
        <span class="goal-pct">${pct<0?'시작보다 후퇴':(shown.toFixed(0)+'% 진행')}</span>
      </div>
      ${g.note?`<div class="goal-note">${g.note}</div>`:''}
    </div>`);
  }
  if(!rows.length) return '';
  // 규모를 먼저 보여준다 — 비율만 있으면 '좋아졌는데 얼마나?'가 안 잡힌다.
  // 거래액(GMV)이 가장 상위 지표라 맨 위, 실매출은 그 아래.
  let topLine='';
  try{
    const as=$('s').value, ae=$('e').value;
    const cmpOn=$('cmp').checked;
    const [sa, sb] = await Promise.all([
      revenueRangeSum(as,ae),
      cmpOn ? revenueRangeSum($('cs').value,$('ce').value) : Promise.resolve(null),
    ]);
    if(sa && sa.gmv){
      const chip=(b,a)=>{ if(!cmpOn||!b) return '';
        const x=delta(b,a); return `<span class="sum-delta ${x.good?'up-txt':'down-txt'}">${x.up?'▲':'▼'} ${x.text}</span>`; };
      topLine=`<div class="sum-money">
        <div class="money-main"><span class="money-label">거래액</span>
          <b>${won(sa.gmv)}</b>${chip(sb?sb.gmv:0, sa.gmv)}</div>
        <div class="money-sub"><span class="money-label">실매출</span>
          ${won(sa.net)}${chip(sb?sb.net:0, sa.net)}
          <span class="money-gap">· 할인·환불 ${won(sa.gmv-sa.net)}</span></div>
      </div>`;
    }
  }catch(e){ /* 매출 데이터가 없으면 이 줄만 생략 */ }

  let h='<div class="summary">';
  h+=`<div class="sum-head">${cfg.period||'목표'}</div>`;
  h+=topLine;
  h+='<div class="goal-list">'+rows.join('')+'</div>';
  // 목표가 잘 안 오를 때 어디를 볼지 — 진단 두 줄은 남긴다
  h+='<div class="sum-rows">';
  // 가장 뒤처진 목표 하나만 짚는다. 여러 개를 동시에 하면 무엇이 효과였는지 알 수 없다.
  const behind = tracked.filter(t=>!t.done).sort((a,b)=>a.pct-b.pct)[0];
  if(behind && GOAL_ACTION[behind.g.key]){
    const state = behind.pct<0 ? '시작보다 뒤로 갔습니다' : `${Math.max(0,behind.pct).toFixed(0)}% 진행`;
    h+=`<div class="sum-line sum-next"><span class="sum-tag">다음 할 일</span>
      <span><b>${behind.g.label}</b>이 ${state}. ${GOAL_ACTION[behind.g.key]}</span></div>`;
  }
  h+='<div class="sum-line" id="sumBottleneck"></div>'
    + '<div class="sum-line" id="sumWorstSeg"><span class="sum-tag">가장 나쁜 조합</span><span style="color:var(--muted);">확인 중…</span></div></div>';
  h+='</div>';
  return h;
}

// 병목 한 줄 (목표가 안 오를 때 원인을 찾는 출발점)
function fillBottleneck(d){
  const el=document.getElementById('sumBottleneck');
  if(!el) return;
  const f=d.funnel||[];
  let ws='', wd=0, wf='';
  for(let i=1;i<f.length;i++){
    const drop=Math.max(0, f[i-1].after - f[i].after);
    if(drop>wd){ wd=drop; ws=f[i].name; wf=f[i-1].name; }
  }
  if(!ws){ el.remove(); return; }
  el.innerHTML=`<span class="sum-tag">가장 큰 병목</span><b>${wf} → ${ws}</b> ${fmt(wd)}명 이탈`;
}

async function fillWorstSegment(){
  const el=document.getElementById('sumWorstSeg');
  if(!el) return;
  try{
    const dd = await wfetch(WORKER+'/?'+q()+'&tab=segfunnel');
    const sf=dd && dd.segfunnel;
    if(!sf){ el.remove(); return; }
    const all=[];
    for(const key of Object.keys(sf)){
      for(const row of (sf[key]||[])) all.push({group:key, ...row});
    }
    const total=all.reduce((s,x)=>s+(x.sessions||0),0);
    // [기준 강화] 예전엔 전체의 2%(최소 30세션)면 후보로 넣었는데, 짧은 기간에서
    // 267세션·구매 0건 같은 조합이 '전환율 0%'로 1위가 됐다. 우연일 가능성이 크다.
    // 구매가 최소 1건은 있어야 하고, 전체의 10% 이상인 조합만 본다.
    const minS=Math.max(200, total*0.10);
    // 구매가 0건인 조합은 제외 — '나쁘다'가 아니라 '표본이 부족하다'일 가능성이 높다
    const cand=all.filter(x=>(x.sessions||0)>=minS && (x.purchase||0)>0);
    if(!cand.length){ el.remove(); return; }
    cand.sort((a,b)=>a.cvr-b.cvr);
    const w=cand[0];
    const best=[...cand].sort((a,b)=>b.cvr-a.cvr)[0];
    el.innerHTML=`<span class="sum-tag">가장 나쁜 조합</span>
      <b>${w.label}</b> 전환율 <b class="down-txt">${w.cvr.toFixed(2)}%</b>
      <span style="color:var(--muted);">· 세션 ${fmt(w.sessions)} · 가장 좋은 조합 ${best.label} ${best.cvr.toFixed(2)}%</span>`;
  }catch(e){ el.remove(); }
}

async function renderCustomer(d){
  let h='';
  const byGroup=(g)=>d.kpis.filter(k=>k.group===g);

  // ===== 최상단: 한눈에 보기 (핵심 지표 3개를 그래프로 먼저) =====
  // [2026-08-03] '한눈에 보기' 제거 — 실매출·세션·구매 건수가 아래 KPI 와 전부 중복이었다.

function monthKey(dateStr){ return dateStr.slice(0,7); } // 'YYYY-MM-DD' -> 'YYYY-MM'
// [2026-08-03 버그 수정] 진행 중인 달을 제외한다.
// 카드 이름은 '최근 완료월'인데 이번 달(며칠치)이 그대로 들어가 있었다. 그래서 8월 3일에
// 8월 매출 1,429만원이 '완료월'로 잡혀 전월 대비 -94.6%, 추이 그래프 마지막 점이 0 근처로
// 곤두박질치고, 평균선까지 끌려 내려갔다. 며칠치를 한 달과 비교한 셈이라 전부 무의미했다.
// 월 단위 지표는 달이 끝난 뒤에만 의미가 있으므로 이번 달은 계산과 그래프에서 모두 뺀다.
function currentMonthKey(){
  const kst=new Date(Date.now()+9*3600*1000);
  return `${kst.getUTCFullYear()}-${String(kst.getUTCMonth()+1).padStart(2,'0')}`;
}
function aggregateMonthlyRevenue(daily, includeCurrentMonth){
  const cur=currentMonthKey();
  const map={};
  daily.forEach(r=>{
    const mk=monthKey(r.date);
    if(!includeCurrentMonth && mk===cur) return;      // 진행 중인 달은 제외
    if(!map[mk]) map[mk]={month:mk, net:0, count:0};
    map[mk].net+=(r.net||0); map[mk].count+=(r.count||0);
  });
  return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month));
}
function growthPct(prev,cur){ return prev? ((cur-prev)/prev*100) : null; }

// ===== 차트 공통 =====
// 툴팁 데이터를 svg 속성에 심어두고, 아래 전역 리스너가 마우스 위치에 따라 띄움
function tipAttr(tips){
  return "data-tip='" + JSON.stringify(tips).replace(/'/g,'&#39;').replace(/</g,'&lt;') + "'";
}
// 평균선 라벨: 배경 있는 알약 모양으로 잘 보이게
// 평균 라벨: 격자(데이터) 영역 '바깥' 오른쪽 여백에 그려서 선·점에 가려지지 않게 함
function avgPill(x, y, text, W, padR){
  const px = W - padR + 6;          // 격자 오른쪽 끝보다 더 오른쪽 = 그래프 밖
  const w  = text.length*7.2 + 12;
  const cy = Math.max(12, Math.min(y, 999));  // 위로 잘리지 않게
  return `<g>
    <rect x="${px.toFixed(1)}" y="${(cy-8.5).toFixed(1)}" width="${w.toFixed(1)}" height="17" rx="8.5" fill="#8B95A1" opacity="0.95"/>
    <text x="${(px+w/2).toFixed(1)}" y="${(cy+3.5).toFixed(1)}" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" font-family="var(--mono)">${text}</text>
  </g>`;
}
function niceStepOf(r){const raw=r/4;const mag=Math.pow(10,Math.floor(Math.log10(raw)||0));const n=raw/mag;return (n<=1?1:n<=2?2:n<=5?5:10)*mag;}

// ===== 비교선 지원 선그래프: 현재 기간(실선) + 비교 기간(점선) =====
function compareLineChart(labels, curValues, prevValues, color, valueFmt, seriesName, prevLabels){
  const W=920,H=240,padL=58,padR=104,padB=30,padT=28;  // padR: 평균 라벨을 그래프 밖에 두기 위한 여백
  const hasPrev = prevValues && prevValues.length>1;
  const allVals = hasPrev ? curValues.concat(prevValues) : curValues;
  const rawMax=Math.max(...allVals,1), rawMin=Math.min(...allVals,0);
  const step=niceStepOf((rawMax-rawMin)||1);
  const min=Math.floor(rawMin/step)*step, max=Math.ceil(rawMax/step)*step;
  const range=(max-min)||1;
  const n=Math.max(curValues.length, hasPrev?prevValues.length:0);
  const x=(i)=>padL+(W-padL-padR)*(n<=1?0.5:i/(n-1));
  const y=(v)=>H-padB-(H-padB-padT)*((v-min)/range);

  let grid='', yAxis='';
  for(let v=min; v<=max+0.0001; v+=step){
    const yy=y(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#F2F4F6" stroke-width="1"/>`;
    yAxis+=`<text x="${padL-8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="end" font-family="var(--mono)">${valueFmt?valueFmt(v):fmt(v)}</text>`;
  }

  const avg = curValues.length ? curValues.reduce((a,b)=>a+b,0)/curValues.length : 0;
  const avgY = y(avg);
  const avgLine = curValues.length>1
    ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}" stroke="#8B95A1" stroke-width="1.5" stroke-dasharray="5 4"/>`
      + avgPill(padL+6, avgY, '평균 '+(valueFmt?valueFmt(avg):fmt(Math.round(avg))), W, padR)
    : '';

  const mkPath=(vals)=>vals.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const curPath=mkPath(curValues);
  const area=curValues.length>1 ? curPath+` L${x(curValues.length-1).toFixed(1)},${H-padB} L${x(0).toFixed(1)},${H-padB} Z` : '';
  const prevPath = hasPrev ? `<path d="${mkPath(prevValues)}" fill="none" stroke="#B0B8C1" stroke-width="2" stroke-dasharray="6 4"/>` : '';
  const dots=curValues.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color}"/>`).join('');

  const lstep=Math.max(1,Math.ceil(labels.length/9));
  const labelEls=labels.map((lb,i)=>(i%lstep===0||i===labels.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="middle" font-family="var(--mono)">${lb}</text>`:'').join('');

  const legend = hasPrev ? `<g font-size="11" font-family="var(--sans)">
    <line x1="${padL}" y1="${padT-16}" x2="${padL+18}" y2="${padT-16}" stroke="${color}" stroke-width="2.5"/>
    <text x="${padL+24}" y="${padT-12}" fill="#191F28">선택 기간</text>
    <line x1="${padL+96}" y1="${padT-16}" x2="${padL+114}" y2="${padT-16}" stroke="#B0B8C1" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${padL+120}" y="${padT-12}" fill="#8B95A1">${cmpModeLabel()}</text></g>` : '';

  // 마우스 감지 영역 + 툴팁 데이터
  const tips=labels.map((lb,i)=>{
    const rows=[{n:'선택', v:(valueFmt?valueFmt(curValues[i]):fmt(curValues[i])), c:color}];
    if(hasPrev && prevValues[i]!=null) rows.push({n:'비교', v:(valueFmt?valueFmt(prevValues[i]):fmt(prevValues[i])), c:'#B0B8C1'});
    return {label:(prevLabels&&prevLabels[i])? `${lb}  (비교: ${prevLabels[i]})` : lb, rows};
  });
  const bandW=(W-padL-padR)/Math.max(1,n);
  const hits=labels.map((lb,i)=>`<rect class="chart-hit" data-i="${i}" x="${(x(i)-bandW/2).toFixed(1)}" y="${padT}" width="${bandW.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>`).join('');

  return `<svg class="chart-svg" ${tipAttr(tips)} viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}${yAxis}${legend}
    ${area?`<path d="${area}" fill="${color}" opacity="0.10"/>`:''}
    ${avgLine}${prevPath}
    <path d="${curPath}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}${labelEls}
    <line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="#191F28" stroke-width="1" opacity="0"/>
    ${hits}
  </svg>`;
}

// 두 지표를 한 차트에 겹쳐 그리기 (예: 매출액 vs 환불액)
// 스케일 차이가 크면 오른쪽에 별도 축을 써서 둘 다 흐름이 보이게 함
function dualLineChart(labels, seriesA, seriesB, valueFmt){
  const W=920,H=240,padL=58,padR=64,padB=30,padT=28;
  // [2026-07-30] 이중 축 제거. 예전엔 두 시리즈의 최대값이 4배 이상 차이나면 오른쪽 축을
  // 따로 뒀는데, 환불 선이 매출 선 위로 올라가 보이는 착시를 만들었다 (실제로는 8배 작은데
  // 시각적으로는 더 커 보임). 같은 축에 그리면 환불 선이 바닥에 낮게 깔리지만 그게 사실이고,
  // 환불의 상세한 추이는 아래 환불액·환불율 개별 카드에서 볼 수 있다.
  const scaleOf=(vals)=>{const rawMax=Math.max(...vals,1);const step=niceStepOf(rawMax||1);return {step,max:Math.ceil(rawMax/step)*step||1};};
  const sa=scaleOf(seriesA.values.concat(seriesB.values));
  const x=(i)=>padL+(W-padL-padR)*(labels.length<=1?0.5:i/(labels.length-1));
  const yA=(v)=>H-padB-(H-padB-padT)*(v/sa.max);
  const yB=yA;

  let grid='', yAxisL='';
  for(let v=0; v<=sa.max+0.0001; v+=sa.step){
    const yy=yA(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#F2F4F6" stroke-width="1"/>`;
    yAxisL+=`<text x="${padL-8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="end" font-family="var(--mono)">${valueFmt(v)}</text>`;
  }
  const mk=(vals,yf,color)=>{
    const path=vals.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${yf(v).toFixed(1)}`).join(' ');
    const dots=vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yf(v).toFixed(1)}" r="3" fill="${color}"/>`).join('');
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>${dots}`;
  };
  const lstep=Math.max(1,Math.ceil(labels.length/9));
  const labelEls=labels.map((lb,i)=>(i%lstep===0||i===labels.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="middle" font-family="var(--mono)">${lb}</text>`:'').join('');
  const legend=`<g font-size="11" font-family="var(--sans)">
    <circle cx="${padL+6}" cy="${padT-16}" r="4" fill="${seriesA.color}"/>
    <text x="${padL+16}" y="${padT-12}" fill="#191F28">${seriesA.name}</text>
    <circle cx="${padL+120}" cy="${padT-16}" r="4" fill="${seriesB.color}"/>
    <text x="${padL+130}" y="${padT-12}" fill="#191F28">${seriesB.name}</text></g>`;

  const tips=labels.map((lb,i)=>({label:lb, rows:[
    {n:seriesA.name, v:valueFmt(seriesA.values[i]), c:seriesA.color},
    {n:seriesB.name, v:valueFmt(seriesB.values[i]), c:seriesB.color},
  ]}));
  const bandW=(W-padL-padR)/Math.max(1,labels.length);
  const hits=labels.map((lb,i)=>`<rect class="chart-hit" data-i="${i}" x="${(x(i)-bandW/2).toFixed(1)}" y="${padT}" width="${bandW.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>`).join('');

  return `<svg class="chart-svg" ${tipAttr(tips)} viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}${yAxisL}${legend}
    ${mk(seriesA.values, yA, seriesA.color)}
    ${mk(seriesB.values, yB, seriesB.color)}
    ${labelEls}
    <line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="#191F28" stroke-width="1" opacity="0"/>
    ${hits}
  </svg>`;
}

function miniLineChart(labels, values, color, valueFmt){
  const W=920,H=240,padL=58,padR=104,padB=30,padT=28;  // compareLineChart와 동일하게 통일
  const rawMax=Math.max(...values,1), rawMin=Math.min(...values,0);
  const step=niceStepOf((rawMax-rawMin)||1);
  const min=Math.floor(rawMin/step)*step, max=Math.ceil(rawMax/step)*step;
  const range=(max-min)||1;
  const x=(i)=>padL+(W-padL-padR)*(values.length<=1?0.5:i/(values.length-1));
  const y=(v)=>H-padB-(H-padB-padT)*((v-min)/range);

  let grid='', yAxis='';
  for(let v=min; v<=max+0.0001; v+=step){
    const yy=y(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#F2F4F6" stroke-width="1"/>`;
    yAxis+=`<text x="${padL-8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="end" font-family="var(--mono)">${valueFmt?valueFmt(v):fmt(v)}</text>`;
  }
  const avg = values.length ? values.reduce((a,b)=>a+b,0)/values.length : 0;
  const avgY = y(avg);
  const avgLine = values.length>1
    ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}" stroke="#8B95A1" stroke-width="1.5" stroke-dasharray="5 4"/>`
      + avgPill(padL+6, avgY, '평균 '+(valueFmt?valueFmt(avg):fmt(Math.round(avg))), W, padR)
    : '';
  const path=values.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=values.length>1 ? path+` L${x(values.length-1).toFixed(1)},${H-padB} L${x(0).toFixed(1)},${H-padB} Z` : '';
  const dots=values.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const lstep=Math.max(1,Math.ceil(labels.length/9));
  const labelEls=labels.map((lb,i)=>(i%lstep===0||i===labels.length-1)?`<text x="${x(i).toFixed(1)}" y="${H-10}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="middle" font-family="var(--mono)">${lb}</text>`:'').join('');

  const tips=labels.map((lb,i)=>({label:lb, rows:[{n:'값', v:(valueFmt?valueFmt(values[i]):fmt(values[i])), c:color}]}));
  const bandW=(W-padL-padR)/Math.max(1,values.length);
  const hits=labels.map((lb,i)=>`<rect class="chart-hit" data-i="${i}" x="${(x(i)-bandW/2).toFixed(1)}" y="${padT}" width="${bandW.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>`).join('');

  return `<svg class="chart-svg" ${tipAttr(tips)} viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}${yAxis}
    ${area?`<path d="${area}" fill="${color}" opacity="0.10"/>`:''}
    ${avgLine}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}${labelEls}
    <line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="#191F28" stroke-width="1" opacity="0"/>
    ${hits}
  </svg>`;
}

// 세로 막대그래프 · prevValues를 주면 비교 기간을 나란히(그룹) 막대로 함께 그림
function verticalBarChart(labels, values, color, valueFmt, prevValues, seriesName){
  const hasPrev = prevValues && prevValues.length>0;
  const W=920,H=240,padL=58,padR=104,padB=30,padT=28;  // compareLineChart와 동일하게 통일
  const allVals = hasPrev ? values.concat(prevValues) : values;
  const rawMax=Math.max(...allVals,1);
  const step=niceStepOf(rawMax||1);
  const max=Math.ceil(rawMax/step)*step || 1;
  const innerW=W-padL-padR;
  const n=Math.max(values.length, hasPrev?prevValues.length:0);
  const slot=innerW/Math.max(1,n);
  // 비교가 있으면 한 칸을 둘로 나눠 나란히
  const bw=Math.max(2, Math.min(hasPrev?14:28, slot*(hasPrev?0.34:0.62)));
  const cx=(i)=>padL+slot*(i+0.5);
  const y=(v)=>H-padB-(H-padB-padT)*(v/max);

  let grid='', yAxis='';
  for(let v=0; v<=max+0.0001; v+=step){
    const yy=y(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#F2F4F6" stroke-width="1"/>`;
    yAxis+=`<text x="${padL-8}" y="${(Number(yy)+3.5).toFixed(1)}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="end" font-family="var(--mono)">${valueFmt?valueFmt(v):fmt(v)}</text>`;
  }

  const barsFor=(vals, offset, fill, op)=>vals.map((v,i)=>{
    const hh=Math.max(0,(H-padB)-y(v));
    return `<rect x="${(cx(i)+offset-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${fill}"${op?` opacity="${op}"`:''}/>`;
  }).join('');
  const prevBars = hasPrev ? barsFor(prevValues, -bw*0.6, '#B0B8C1', '0.85') : '';
  const curBars  = barsFor(values, hasPrev? bw*0.6 : 0, color);

  // 현재 기간 평균선
  const avg = values.length ? values.reduce((a,b)=>a+b,0)/values.length : 0;
  const avgY = y(avg);
  const avgLine = values.length>1
    ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}" stroke="#8B95A1" stroke-width="1.5" stroke-dasharray="5 4"/>`
      + avgPill(padL+6, avgY, '평균 '+(valueFmt?valueFmt(avg):fmt(Math.round(avg))), W, padR)
    : '';

  const lstep=Math.max(1,Math.ceil(labels.length/9));
  const labelEls=labels.map((lb,i)=>(i%lstep===0||i===labels.length-1)?`<text x="${cx(i).toFixed(1)}" y="${H-10}" font-size="11" fill="#8B95A1" font-weight="500" text-anchor="middle" font-family="var(--mono)">${lb}</text>`:'').join('');

  const legend = hasPrev ? `<g font-size="11" font-family="var(--sans)">
    <rect x="${padL}" y="${padT-20}" width="10" height="10" rx="2" fill="${color}"/>
    <text x="${padL+15}" y="${padT-11}" fill="#191F28">선택 기간</text>
    <rect x="${padL+92}" y="${padT-20}" width="10" height="10" rx="2" fill="#B0B8C1"/>
    <text x="${padL+107}" y="${padT-11}" fill="#8B95A1">${cmpModeLabel()}</text></g>` : '';

  const tips=labels.map((lb,i)=>{
    const rows=[{n:seriesName||'선택', v:(valueFmt?valueFmt(values[i]):fmt(values[i])), c:color}];
    if(hasPrev && prevValues[i]!=null) rows.push({n:'비교', v:(valueFmt?valueFmt(prevValues[i]):fmt(prevValues[i])), c:'#B0B8C1'});
    return {label:lb, rows};
  });
  const hits=labels.map((lb,i)=>`<rect class="chart-hit" data-i="${i}" x="${(cx(i)-slot/2).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${(H-padB-padT).toFixed(1)}" fill="transparent"/>`).join('');

  return `<svg class="chart-svg" ${tipAttr(tips)} viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;">
    ${grid}${yAxis}${legend}${prevBars}${curBars}${avgLine}${labelEls}
    <line class="chart-cursor" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="#191F28" stroke-width="1" opacity="0"/>
    ${hits}
  </svg>`;
}

function won(v){ return fmt(v)+'원'; }
// 금액 축 라벨: 만 단위가 커지면 억으로 (60000만 → 6억)
function wonAxis(v){
  const a=Math.abs(v);
  if(a>=100000000) return (v/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(a>=10000) return Math.round(v/10000)+'만';
  return fmt(Math.round(v));
}

// ===== 최상단 핵심 그래프: 매출 / 방문 / 구매 (최근 30일) =====
async function loadGrowthMetrics(){
  const wrap=document.getElementById('growthWrap');
  let h='';

  // 1) 매출 MoM/YoY + 월별 매출 막대그래프 (cafe24 revenue-daily.json 기준)
  try{
    const monthly=aggregateMonthlyRevenue((await ensureRevenue()).daily||[]);
    if(monthly.length>=2){
      const last=monthly[monthly.length-1], prev=monthly[monthly.length-2];
      const mom=growthPct(prev.net,last.net);
      const yoyMonth=monthly.find(m=>{
        const [y,mo]=last.month.split('-'); const ly=(Number(y)-1)+'-'+mo; return m.month===ly;
      });
      const yoy=yoyMonth? growthPct(yoyMonth.net,last.net) : null;
      h+='<div class="section-title">매출 성장 (전월 대비 · 전년 동월 대비)</div>';
      h+='<div class="kpis">';
      h+=`<div class="kpi"><div class="k-label">최근 완료월 매출</div><div class="k-now">${fmt(last.net)}원</div><div class="k-was">${last.month}</div></div>`;
      h+=`<div class="kpi"><div class="k-label">전월 대비(MoM)</div><div class="k-now">${mom!=null?(mom>=0?'+':'')+mom.toFixed(1)+'%':'-'}</div><div class="k-was">${prev.month}: ${fmt(prev.net)}원</div></div>`;
      h+=`<div class="kpi"><div class="k-label">전년 동월 대비(YoY)</div><div class="k-now">${yoy!=null?(yoy>=0?'+':'')+yoy.toFixed(1)+'%':'데이터 부족'}</div><div class="k-was">${yoyMonth?yoyMonth.month+': '+fmt(yoyMonth.net)+'원':'작년 동월 기록 없음'}</div></div>`;
      h+='</div>';

      const last12=monthly.slice(-12);
      h+='<div class="section-title">월별 매출 추이 (최근 '+last12.length+'개월)</div>';
      h+='<div class="funnel">'+miniLineChart(last12.map(m=>m.month.slice(5)), last12.map(m=>m.net), '#3182F6', v=>wonAxis(v))+'</div>';

      // 객단가(AOV) 추이
      const aovMonthly=last12.map(m=>m.count? Math.round(m.net/m.count):0);
      h+='<div class="section-title">월별 객단가(AOV) 추이</div>';
      h+='<div class="funnel">'+miniLineChart(last12.map(m=>m.month.slice(5)), aovMonthly, '#FF9500', v=>fmt(v))+'</div>';
    } else {
      h+='<div class="state">매출 데이터가 아직 충분하지 않습니다 (최소 2개월 필요)</div>';
    }
  }catch(e){ h+='<div class="state">매출 성장 지표를 불러오지 못했습니다</div>'; }

  // 2) 월별 MAU 추이
  try{
    const dd = await wfetch(WORKER+'/?'+q()+'&tab=monthlyusers');
    if(dd.monthly && dd.monthly.length){
      // 매출 추이와 같은 이유로 진행 중인 달을 뺀다.
      // GA4 는 'YYYYMM' 형식이라 하이픈을 없앤 현재 월 키와 비교한다.
      const curKey=currentMonthKey().replace('-','');
      const mrows=dd.monthly.filter(m=>m.month!==curKey);
      if(!mrows.length) throw new Error('완료된 달이 없음');
      const labels=mrows.map(m=>m.month.slice(4)); // 'YYYYMM' -> 'MM'
      const values=mrows.map(m=>m.activeUsers);
      const lastM=mrows[mrows.length-1], prevM=mrows[mrows.length-2];
      const momMau=prevM? growthPct(prevM.activeUsers,lastM.activeUsers):null;
      h+='<div class="section-title">월별 MAU 추이 <span class="badge">'+(momMau!=null?('전월대비 '+(momMau>=0?'+':'')+momMau.toFixed(1)+'%'):'')+'</span></div>';
      h+='<div class="funnel">'+miniLineChart(labels, values, '#00B26B', v=>fmt(v))+'</div>';
    }
  }catch(e){ h+='<div class="state">MAU 추이를 불러오지 못했습니다</div>'; }

  // 3) 리텐션 곡선 (Day 0~30)
  try{
    const dd2 = await wfetch(WORKER+'/?'+q()+'&tab=retention');
    if(dd2.error){
      h+='<div class="state" style="margin-top:22px;">리텐션 곡선을 불러오지 못했습니다: '+dd2.error+'</div>';
    } else if(dd2.points && dd2.points.length){
      const labels=dd2.points.map(p=>'D'+p.day);
      const values=dd2.points.map(p=>p.retention);
      const d1=dd2.points.find(p=>p.day===1), d7=dd2.points.find(p=>p.day===7), d30=dd2.points.find(p=>p.day===30);
      h+='<div class="section-title">리텐션 곡선 (최근 신규 유입 코호트, Day 0~30)</div>';
      h+='<p class="sec-desc">N일 후 재방문 비율</p>';
      h+='<div class="kpis">';
      h+=`<div class="kpi"><div class="k-label">Day 1 잔존율</div><div class="k-now">${d1?d1.retention.toFixed(1)+'%':'-'}</div></div>`;
      h+=`<div class="kpi"><div class="k-label">Day 7 잔존율</div><div class="k-now">${d7?d7.retention.toFixed(1)+'%':'-'}</div></div>`;
      h+=`<div class="kpi"><div class="k-label">Day 30 잔존율</div><div class="k-now">${d30?d30.retention.toFixed(1)+'%':'-'}</div></div>`;
      h+='</div>';
      h+='<div class="funnel" style="margin-top:12px;">'+miniLineChart(labels, values, '#8B5CF6', v=>v.toFixed(1)+'%')+'</div>';
    } else {
      h+='<div class="state" style="margin-top:22px;">리텐션 데이터 없음</div>';
    }
  }catch(e){ h+='<div class="state" style="margin-top:22px;">리텐션 곡선을 불러오지 못했습니다</div>'; }

  document.getElementById('growthWrap').innerHTML = h;
}

function segBarBlock(title, rows, color, prevRows){
  if(!rows || !rows.length) return `<div class="section-block"><div class="section-block-head"><span class="section-block-title">${title}</span></div><div class="state">데이터 없음</div></div>`;
  const cmpOn=$('cmp').checked && prevRows && prevRows.length;
  const prevMap={}; if(cmpOn) prevRows.forEach(p=>prevMap[p.label]=p);
  const maxV=Math.max(...rows.map(r=>r.sessions),1);
  let h=`<div class="section-block"><div class="section-block-head"><span class="section-dot" style="background:${color};"></span><span class="section-block-title">${title}</span></div>`;
  h+=rows.map(r=>{
    const w=Math.max(r.sessions/maxV*100,4);
    let cmpHtml='';
    if(cmpOn){
      const p=prevMap[r.label];
      const pv=p?p.sessions:0;
      const dv=delta(pv, r.sessions);
      cmpHtml=`<div class="slotbar-meta">비교 ${fmt(pv)} <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span>${p?` · 전환 ${p.convRate.toFixed(2)}% → <b>${r.convRate.toFixed(2)}%</b>`:''}</div>`;
    }
    return `<div class="slotbar-row">
      <div><span class="slotbar-name" style="cursor:default;">${r.label}</span><div class="slotbar-meta">참여율 ${r.engagementRate.toFixed(1)}% · 평균 ${fmtDwell(r.avgDuration)} · 구매전환 ${r.convRate.toFixed(2)}%</div>${cmpHtml}</div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${color};"></div></div>
      <div><div class="slotbar-val">${fmt(r.sessions)}</div><div class="slotbar-sub">세션</div></div>
    </div>`;
  }).join('');
  h+='</div>';
  return h;
}

  drawDayOfWeek(daily, dailyPrev);
}

// 요일별 평균: 이커머스는 요일 효과가 커서, 어느 요일이 강한지 보면 프로모션 요일 정할 때 씀
const DOW_NAMES=['일','월','화','수','목','금','토'];
function dowAverages(daily){
  const buckets=DOW_NAMES.map(()=>({sessions:0, purchase:0, n:0}));
  (daily||[]).forEach(d=>{
    // date는 'YYYYMMDD' 형식
    const y=Number(d.date.slice(0,4)), m=Number(d.date.slice(4,6)), dd=Number(d.date.slice(6,8));
    const dow=new Date(Date.UTC(y, m-1, dd)).getUTCDay();
    buckets[dow].sessions += (d.sessions||0);
    buckets[dow].purchase += (d.purchase||0);
    buckets[dow].n++;
  });
  return {
    sessions: buckets.map(b=>b.n?Math.round(b.sessions/b.n):0),
    purchase: buckets.map(b=>b.n?Number((b.purchase/b.n).toFixed(1)):0),
  };
}
function drawDayOfWeek(daily, dailyPrev){
  const box=document.getElementById('dowWrap'); if(!box) return;
  if(!daily || daily.length<7){ box.innerHTML=''; return; }
  const cur=dowAverages(daily);
  const cmpOn=$('cmp').checked && dailyPrev && dailyPrev.length>=7;
  const prev=cmpOn? dowAverages(dailyPrev) : null;
  const avgSessions=cur.sessions, avgPurchase=cur.purchase;
  const hasData=avgSessions.some(v=>v>0);
  if(!hasData){ box.innerHTML=''; return; }

  // [2026-07-30] 예전엔 2열 그리드(minmax 520px) 안에 세로 막대 차트 2개를 나란히 뒀는데,
  // viewBox 920px 짜리 SVG가 520px 칸에 들어가 56%로 축소돼 눈금·라벨이 안 보였다.
  // 데이터 점이 7개뿐이므로 전체 폭 가로 막대 목록이 훨씬 잘 읽힌다.
  const maxS=Math.max(...avgSessions,1);
  const best=avgSessions.indexOf(Math.max(...avgSessions));
  const worst=avgSessions.indexOf(Math.min(...avgSessions.filter(v=>v>0)));

  let h='<div class="section-title">요일별 평균</div>';
    h+='<div class="section-block">';
  h+=DOW_NAMES.map((nm,i)=>{
    const s=avgSessions[i], p=avgPurchase[i];
    const w=Math.max(s/maxS*100,2);
    const tag = i===best ? '<span class="dow-tag up-txt">가장 높음</span>'
              : (i===worst && s>0 ? '<span class="dow-tag down-txt">가장 낮음</span>' : '');
    let cmpHtml='';
    if(prev){
      const ps=prev.sessions[i]||0;
      const dv=ps? (s-ps)/ps*100 : 0;
      const up=dv>=0;
      cmpHtml=`<div class="slotbar-meta">비교 ${fmt(Math.round(ps))} <span class="${up?'up-txt':'down-txt'}">${up?'▲':'▼'} ${Math.abs(dv).toFixed(1)}%</span></div>`;
    }
    return `<div class="slotbar-row">
      <div><div class="slotbar-head"><span class="slotbar-name" style="cursor:default;">${nm}요일${tag}</span></div>
        <div class="slotbar-meta">평균 구매 ${Math.round(p*10)/10}건</div>${cmpHtml}</div>
      <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#3182F6;"></div></div>
      <div><div class="slotbar-val">${fmt(Math.round(s))}</div><div class="slotbar-sub">평균 세션</div></div>
    </div>`;
  }).join('');
  h+='</div>';
  box.innerHTML=h;
}
function renderFunnel(d){
  const cmpOn = $('cmp').checked;
  let h='';
  h+='<h2 class="sec">구매 전환 퍼널</h2>';
  h+='<p class="sec-desc">단계별 통과율과 이탈 인원</p>';

  // 단계별 이탈 계산 (앞 단계보다 줄어든 만큼이 이탈)
  const stages = d.funnel.map((s,i)=>{
    const p = d.funnel[i-1];
    const passA = p ? (s.after/p.after*100) : 100;
    const passB = (p && p.before) ? (s.before/p.before*100) : 100;
    const dropA = p ? Math.max(0, p.after - s.after) : 0;      // 이탈 인원
    const dropB = p ? Math.max(0, p.before - s.before) : 0;
    const dropRateA = (p && p.after) ? dropA/p.after*100 : 0;  // 이탈률
    const dropRateB = (p && p.before) ? dropB/p.before*100 : 0;
    return {...s, prev:p, passA, passB, dropA, dropB, dropRateA, dropRateB};
  });

  h+='<div class="funnel">';
  const maxVal = Math.max(...d.funnel.map(s=>Math.max(s.after, cmpOn?s.before:0)), 1);
  // 통과율·이탈률을 큰 숫자로, 세션 수는 보조로 내린다.
  // (예전엔 막대와 세션 수가 주인공이라 정작 봐야 할 비율이 작은 글자로 묻혔음)
  h+=stages.map(st=>{
    const barW = Math.min(Math.max(st.after/maxVal*100,2),100);
    const chip=(v,unit,goodWhenUp)=>{
      if(v==null || !isFinite(v)) return '';
      const up=v>=0, good=goodWhenUp?up:!up;
      return `<span class="fstat-delta ${good?'up-txt':'down-txt'}">${up?'▲':'▼'} ${Math.abs(v).toFixed(1)}${unit}</span>`;
    };
    let stats;
    if(st.prev){
      // 통과율(높을수록 좋음) / 이탈률(낮을수록 좋음)
      stats = `<div class="fstat">
          <div class="fstat-num">${st.passA.toFixed(1)}%${cmpOn?chip(st.passA-st.passB,'%p',true):''}</div>
          <div class="fstat-label">통과율${cmpOn?` · 비교 ${st.passB.toFixed(1)}%`:''}</div>
        </div>
        <div class="fstat is-drop">
          <div class="fstat-num">${st.dropRateA.toFixed(1)}%${cmpOn?chip(st.dropRateA-st.dropRateB,'%p',false):''}</div>
          <div class="fstat-label">이탈률 · ${fmt(st.dropA)}명 이탈</div>
        </div>`;
    }else{
      // 첫 단계는 통과율·이탈 개념이 없으므로 세션 수가 주인공
      const dv = (cmpOn && st.before) ? (st.after-st.before)/st.before*100 : null;
      stats = `<div class="fstat">
          <div class="fstat-num">${fmt(st.after)}${chip(dv,'%',true)}</div>
          <div class="fstat-label">세션${cmpOn?` · 비교 ${fmt(st.before)}`:''}</div>
        </div>`;
    }
    return `<div class="fstage">
      <div class="fstage-head"><span class="fstage-name">${st.name}</span>${st.prev?`<span class="fstage-count">세션 ${fmt(st.after)}</span>`:''}</div>
      <div class="fstage-stats">${stats}</div>
      <div class="fstage-track"><div class="fstage-fill" style="width:${barW}%"></div></div>
    </div>`;
  }).join('')+'</div>';

  // ===== 개선 기회 순위: 이탈 인원이 많은 단계부터 =====
  const drops = stages.filter(st=>st.prev && st.dropA>0).sort((a,b)=>b.dropA-a.dropA);
  if(drops.length){
    h+='<h2 class="sec">개선 기회 순위</h2>';
    h+='<p class="sec-desc">이탈 인원 기준 정렬</p>';
    const maxDrop=Math.max(...drops.map(x=>x.dropA),1);
    h+='<div class="section-block">'+drops.map((st,i)=>{
      const w=Math.max(st.dropA/maxDrop*100,3);
      const gain=Math.round(st.dropA*0.1);
      return `<div class="slotbar-row">
        <div><span class="slotbar-name" style="cursor:default;">${i+1}. ${st.prev.name} → ${st.name}</span>
          <div class="slotbar-meta">이탈률 ${st.dropRateA.toFixed(1)}% · 10%만 살리면 +${fmt(gain)}</div></div>
        <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#F04452;"></div></div>
        <div><div class="slotbar-val">${fmt(st.dropA)}</div><div class="slotbar-sub">이탈</div></div>
      </div>`;
    }).join('')+'</div>';
  }

  h+='<h2 class="sec">세그먼트별 퍼널</h2>';
  h+='<p class="sec-desc">세션→구매 전환율(CVR) 순</p>';
  h+='<div id="segFunnelWrap"><div class="funnel"><div class="state"><div class="spinner"></div>세그먼트 퍼널 불러오는 중…</div></div></div>';

  h+='<h2 class="sec">장바구니 분석 · 구매 경로</h2>';
    h+='<div id="cartWrap"><div class="funnel"><div class="state"><div class="spinner"></div>장바구니 지표 불러오는 중…</div></div></div>';

  h+='<h2 class="sec">페이지별 트래픽</h2><div class="pages">'+d.pages.map(pg=>{
    const rows=pg.metrics.map(m=>{
      if(!cmpOn) return `<div class="m-row"><span class="m-label">${m.label}</span><span class="m-vals"><b>${fmt(m.after)}</b></span></div>`;
      const x=delta(m.before,m.after);
      return `<div class="m-row"><span class="m-label">${m.label}</span><span class="m-vals">${fmt(m.before)} → <b>${fmt(m.after)}</b></span>
      <span class="m-delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${x.text}</span></div>`;}).join('');
    return `<div class="page"><div class="page-name">${pg.name}</div>${rows}</div>`;}).join('')+'</div>';

  h+='<h2 class="sec">사이트 검색어</h2>';
  h+='<p class="sec-desc">view_search_results 이벤트 기준 · 검색 횟수 많은 순</p>';
  h+='<div id="searchWrap"><div class="funnel"><div class="state"><div class="spinner"></div>검색어 불러오는 중…</div></div></div>';

  h+='<h2 class="sec">스크롤 도달률</h2>';
  h+='<p class="sec-desc">90% 지점까지 내려본 비율</p>';
  h+='<div id="scrollWrap"><div class="funnel"><div class="state"><div class="spinner"></div>스크롤 지표 불러오는 중…</div></div></div>';

  h+='<h2 class="sec">UTM 캠페인 성과</h2>';
  h+='<p class="sec-desc">매출은 GA4 추적 기준 — 매출 탭 실매출과 다릅니다</p>';
  h+='<div id="utmWrap"><div class="funnel"><div class="state"><div class="spinner"></div>UTM 지표 불러오는 중…</div></div></div>';

  $('content').innerHTML=h;
  loadSegmentFunnel();
  loadCartAnalysis();
  loadSearchTerms();
  loadScrollDepth();
  loadUtmPerformance();
}

// 사이트 검색어 (view_search_results 의 search_term)
async function loadSearchTerms(){
  const wrap=$('searchWrap');
  if(!wrap) return;
  try{
    const dd = await wfetch(WORKER+'/?'+q()+'&tab=searchterms');
    if(dd.error){ wrap.innerHTML='<div class="funnel"><div class="state">불러오지 못했습니다: '+dd.error+'</div></div>'; return; }
    const cur=dd.searchTerms, prev=dd.searchTermsBefore;
    if(!cur || !cur.rows || !cur.rows.length){
      wrap.innerHTML='<div class="funnel"><div class="state">이 기간에 잡힌 검색어가 없습니다.<br>'
        +'GA4 관리 → 맞춤 정의에서 <b>search_term</b> 을 이벤트 범위 측정기준으로 등록했는지 확인해 주세요.</div></div>';
      return;
    }
    const cmpOn=$('cmp').checked && prev && prev.rows;
    const prevMap={}; if(cmpOn) prev.rows.forEach(p=>prevMap[p.term]=p);

    const rows=cur.rows;
    const maxV=Math.max(...rows.map(x=>x.searches),1);
    const totSearch=cur.totalSearches||rows.reduce((a,b)=>a+b.searches,0);
    const uniq=cur.uniqueTerms||rows.length;

    // 전체 검색어 CSV 내려받기. 화면은 상위 50개만 보여주므로, 전수는 워커가 직접
    // 파일로 내려준다(BOM 포함이라 엑셀에서 한글이 안 깨짐).
    const csvUrl = WORKER+'/?'+q()+'&tab=searchtermscsv';

    let h=`<div class="section-block">
      <div class="section-block-head">
        <span class="section-dot" style="background:#3182F6;"></span>
        <span class="section-block-title">검색어 상위 ${rows.length}개</span>
        <span class="section-block-total">검색 ${fmt(totSearch)}회 · 고유 검색어 ${fmt(uniq)}개</span>
        <a class="csv-btn" href="${csvUrl}" download>전체 ${fmt(uniq)}개 엑셀 다운로드</a>
      </div>`;

    h+=rows.map(x=>{
      const w=Math.max(x.searches/maxV*100,3);
      const share=totSearch?(x.searches/totSearch*100):0;
      let cmpHtml='';
      if(cmpOn){
        const p=prevMap[x.term];
        const pv=p?p.searches:0;
        const dv=delta(pv, x.searches);
        cmpHtml=`<div class="slotbar-meta">비교 ${fmt(pv)}회 <span class="${dv.good?'up-txt':'down-txt'}">${dv.up?'▲':'▼'} ${dv.text}</span>${pv===0?' · <b>신규</b>':''}</div>`;
      }
      return `<div class="slotbar-row">
        <div><span class="slotbar-name" style="cursor:default;">${esc(x.term)}</span>
          <div class="slotbar-meta">사용자 ${fmt(x.users)}명 · 점유 ${share.toFixed(1)}%</div>${cmpHtml}</div>
        <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:#3182F6;"></div></div>
        <div><div class="slotbar-val">${fmt(x.searches)}</div><div class="slotbar-sub">검색</div></div>
      </div>`;
    }).join('');
    h+='</div>';

    // 비교 기간에만 있고 이번 기간엔 사라진 검색어 (수요 이탈 신호)
    if(cmpOn){
      const curSet=new Set(rows.map(r=>r.term));
      const gone=prev.rows.filter(p=>!curSet.has(p.term)).slice(0,10);
      if(gone.length){
        h+=`<p class="sec-desc" style="margin-top:10px;">비교 기간에 있었지만 이번엔 사라진 검색어: `
          +gone.map(g=>`<b>${esc(g.term)}</b>(${fmt(g.searches)})`).join(', ')+'</p>';
      }
    }
    if(cur.dimUsed==='customEvent:search_term'){
      h+='<p class="sec-desc">맞춤 측정기준 <b>customEvent:search_term</b> 기준으로 집계했습니다.</p>';
    }
    wrap.innerHTML=h;
  }catch(e){ wrap.innerHTML='<div class="funnel"><div class="state">검색어를 불러오지 못했습니다</div></div>'; }
}

// 장바구니 분석 + 구매 경로
async function loadCartAnalysis(){
  const wrap=$('cartWrap');
  if(!wrap) return;
  try{
    const dd = await wfetch(WORKER+'/?'+q()+'&tab=cart');
    if(dd.error){ wrap.innerHTML='<div class="funnel"><div class="state">불러오지 못했습니다: '+dd.error+'</div></div>'; return; }
    if(!dd.cartAnalysis){ wrap.innerHTML='<div class="funnel"><div class="state">장바구니 데이터가 없습니다</div></div>'; return; }
    const c=dd.cartAnalysis.cart, p=dd.cartAnalysis.path;
    const pb=dd.cartAnalysisBefore;
    const cmpOn=$('cmp').checked && pb;
    const cb=pb?pb.cart:null, ppb=pb?pb.path:null;

    // KPI 카드
    const kpi=(label,val,sub,prevVal,lower,unit)=>{
      let cmpHtml='';
      if(cmpOn && prevVal!=null){
        const dv=delta(prevVal,typeof val==='number'?val:0,lower);
        const pv = unit==='percent' ? prevVal.toFixed(1)+'%' : fmt(Math.round(prevVal));
        cmpHtml=`<div class="delta ${dv.good?'good':'bad'}">${dv.up?'▲':'▼'} ${dv.text}</div><div class="k-was">비교: ${pv}</div>`;
      }
      const shown = unit==='percent' ? (typeof val==='number'? val.toFixed(1)+'%' : val) : fmt(Math.round(val));
      return `<div class="kpi"><div class="k-label">${label}</div><div class="k-now">${shown}</div>
        ${cmpHtml}<div class="slotbar-meta" style="margin-top:6px;">${sub}</div></div>`;
    };

    let h='<div class="kpis">';
    h+=kpi('장바구니 담은 세션', c.addSessions, `담기 이벤트 ${fmt(c.addEvents)}회`, cb?cb.addSessions:null, false);
    h+=kpi('장바구니 이탈', c.abandonSessions, `담았지만 구매 안 함`, cb?cb.abandonSessions:null, true);
    h+=kpi('장바구니 이탈률', c.abandonRate, `담은 세션 중 미구매 비율`, cb?cb.abandonRate:null, true, 'percent');
    h+=kpi('담기→구매 전환율', c.convRate, `담은 세션 중 구매 도달`, cb?cb.convRate:null, false, 'percent');
    h+=kpi('스스로 뺀 비율', c.removeRate, `담기 ${fmt(c.addEvents)}회 중 ${fmt(c.removeEvents)}회 제거`, cb?cb.removeRate:null, true, 'percent');
    h+='</div>';

    // 구매 경로
    // [중요] 이 몰은 장바구니를 반드시 거쳐야 구매가 됩니다. 따라서 예전에 여기 있던
    // '바로구매 추정'(= 주문서 세션 − 장바구니 세션)은 존재할 수 없는 경로였습니다.
    // 그 차이값의 실제 의미는 ① 어제 담고 오늘 결제(세션 이월) ② 상세→주문서로 바로 넘어가
    // 장바구니 페이지뷰가 안 찍힌 경우 ③ GA4 페이지뷰 누락 — 즉 추적 이슈 지표입니다.
    h+='<div class="section-title">구매 경로</div>';
    h+='<p class="sec-desc">장바구니는 필수 경로 · 단계별 세션 수</p>';
    const pathRows=[
      {name:'장바구니 페이지 방문', v:p.basketSessions, color:'#00B26B', meta:`조회수 ${fmt(p.basketViews)}`},
      {name:'주문서 페이지 도달', v:p.orderSessions, color:'#3182F6', meta:`조회수 ${fmt(p.orderViews)}`},
      {name:'구매 완료', v:c.purchaseSessions, color:'#8B5CF6', meta:`주문서→구매 ${p.orderToBuyRate.toFixed(1)}%`},
      {name:'장바구니 페이지 미기록', v:p.directEstimate, color:'#FF9500',
       meta:`주문서 세션 중 ${p.directShare.toFixed(1)}%`,
       detail:'장바구니를 안 거친 구매가 아닙니다 (이 몰은 장바구니가 필수). 다음 중 하나입니다 — ① 세션 이월: 어제 담아두고 오늘 결제 (가장 흔함) ② 상품 상세에서 담고 주문서로 바로 넘어가 장바구니 페이지뷰가 안 찍힘 ③ GA4 페이지뷰 누락. 즉 구매 경로 지표가 아니라 추적 점검용 참고치입니다.'},
    ];
    const maxP=Math.max(...pathRows.map(x=>x.v),1);
    h+='<div class="section-block">'+pathRows.map(x=>{
      const w=Math.max(x.v/maxP*100,3);
      const detail=x.detail? `<div class="slotbar-meta">${x.detail}</div>` : '';
      const summary=`<div class="slotbar-row">
        <div><div class="slotbar-head"><span class="slotbar-name" style="cursor:default;">${x.name}</span>${detail?rowToggleBtn():''}</div><div class="slotbar-meta">${x.meta}</div></div>
        <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${x.color};"></div></div>
        <div><div class="slotbar-val">${fmt(x.v)}</div><div class="slotbar-sub">세션</div></div>
      </div>`;
      return rowItem(summary, detail);
    }).join('')+'</div>';

    // 주문서 이탈 강조
    if(p.orderDropSessions>0){
      h+=`<div class="section-block" style="border-color:var(--down);">
        <div class="section-block-head"><span class="section-dot" style="background:var(--down);"></span><span class="section-block-title">주문서까지 갔는데 이탈</span>
        <span class="section-block-total">${fmt(p.orderDropSessions)} 세션</span></div>
        <p class="sec-desc" style="margin:0;">주문서까지 온 뒤의 이탈</p></div>`;
    }
    wrap.innerHTML=h;

// 세그먼트별 퍼널: 어느 조합에서 많이 빠지는지
async function loadSegmentFunnel(){
  const wrap=$('segFunnelWrap');
  if(!wrap) return;
  try{
    const dd = await wfetch(WORKER+'/?'+q()+'&tab=segfunnel');
    if(dd.error){ wrap.innerHTML='<div class="funnel"><div class="state">불러오지 못했습니다: '+dd.error+'</div></div>'; return; }
    if(!dd.segfunnel){ wrap.innerHTML='<div class="funnel"><div class="state">세그먼트 퍼널 데이터가 없습니다</div></div>'; return; }
    const cur=dd.segfunnel, prev=dd.segfunnelBefore;
    const cmpOn=$('cmp').checked && prev;

    const block=(title, rows, prevRows, color)=>{
      if(!rows || !rows.length) return `<div class="section-block"><div class="section-block-head"><span class="section-block-title">${title}</span></div><div class="state">데이터 없음</div></div>`;
      const sorted=[...rows].sort((a,b)=>b.cvr-a.cvr);
      const maxCvr=Math.max(...sorted.map(x=>x.cvr),0.01);
      const prevMap={}; if(cmpOn && prevRows) prevRows.forEach(p=>prevMap[p.label]=p);
      let out=`<div class="section-block"><div class="section-block-head"><span class="section-dot" style="background:${color};"></span><span class="section-block-title">${title}</span><span class="section-block-total">세션→구매 전환율 순</span></div>`;
      out+=sorted.map(x=>{
        const w=Math.max(x.cvr/maxCvr*100,3);
        // 가장 많이 빠지는 단계 찾기 (통과율이 가장 낮은 구간)
        const steps=[
          {n:'방문→조회', v:x.viewRate},
          {n:'조회→장바구니', v:x.cartRate},
          {n:'장바구니→구매', v:x.buyRate},
        ].filter(z=>isFinite(z.v));
        const worst=steps.length? steps.reduce((a,b)=>a.v<b.v?a:b) : null;
        let cmpHtml='';
        if(cmpOn){
          const p=prevMap[x.label];
          const pv=p?p.cvr:0;
          const dp=x.cvr-pv;
          cmpHtml=`<div class="slotbar-meta">비교 CVR ${pv.toFixed(2)}% <span class="${dp>=0?'up-txt':'down-txt'}">${dp>=0?'▲':'▼'} ${Math.abs(dp).toFixed(2)}%p</span></div>`;
        }
        // 병목·비교는 접어둔다 (요약 줄에 다 넣으면 잘려서 못 읽음)
        const detail=(worst?`<div class="slotbar-meta">병목 <b style="color:var(--down);">${worst.n} ${worst.v.toFixed(1)}%</b> · 단계별 통과율 ${steps.map(z=>`${z.n} ${z.v.toFixed(1)}%`).join(' / ')}</div>`:'')+cmpHtml;
        const summary=`<div class="slotbar-row">
          <div><div class="slotbar-head"><span class="slotbar-name" style="cursor:default;">${x.label}</span>${detail?rowToggleBtn():''}</div>
            <div class="slotbar-meta">세션 ${fmt(x.sessions)} · 구매 ${fmt(x.purchase)}</div></div>
          <div class="slotbar-track"><div class="slotbar-fill" style="width:${w}%;background:${color};"></div></div>
          <div><div class="slotbar-val">${x.cvr.toFixed(2)}%</div><div class="slotbar-sub">CVR</div></div>
        </div>`;
        return rowItem(summary, detail);
      }).join('');
      out+='</div>';
      return out;
    };

    let h='';
    h+=block('신규 vs 재방문', cur.byNewReturning, prev?prev.byNewReturning:null, '#3182F6');
    h+=block('디바이스별', cur.byDevice, prev?prev.byDevice:null, '#00B26B');
    h+=block('유입 채널별', cur.bySource, prev?prev.bySource:null, '#8B5CF6');
    wrap.innerHTML=h;
  }catch(e){ wrap.innerHTML='<div class="funnel"><div class="state">세그먼트 퍼널을 불러오지 못했습니다</div></div>'; }
}
