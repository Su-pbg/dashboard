<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintBakery Product Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F4F6F9;--surface:#FFFFFF;--ink:#172230;--muted:#66768A;--hair:#E4E9F0;
    --accent:#0E7C6E;--accent-soft:#E3F1EE;--ghost:#D8DEE7;--up:#1E9C68;--down:#C85A3F;
    --up-soft:#E6F4EC;--down-soft:#FBEAE4;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'Pretendard',system-ui,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px;margin:0 auto;padding:36px 24px 80px;}
  .top-rule{height:3px;background:var(--accent);border-radius:2px;width:56px;margin-bottom:20px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px;}
  h1{font-size:30px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
  .sub{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin-bottom:24px;flex-wrap:wrap;}
  .tab{padding:11px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab .soon{font-size:10px;color:var(--muted);background:var(--paper);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;margin-left:5px;}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;margin-bottom:24px;}
  .ctrl{display:flex;flex-direction:column;gap:5px;}
  .ctrl label{font-size:11px;color:var(--muted);font-weight:600;}
  .ctrl .pair{display:flex;gap:6px;align-items:center;}
  input[type=date]{font-family:var(--mono);font-size:13px;border:1px solid var(--hair);border-radius:8px;padding:7px 10px;color:var(--ink);}
  .seg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  .seg.b{background:var(--paper);color:var(--muted);}
  .preset-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .preset-btns button{font-size:12px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--hair);border-radius:999px;padding:6px 12px;cursor:pointer;}
  .preset-btns button:hover{border-color:var(--accent);color:var(--accent);}
  .go{margin-left:auto;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;}
  .excl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;}
  .state{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .spinner{width:26px;height:26px;border:3px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{background:var(--down-soft);color:var(--down);border-radius:10px;padding:16px;font-size:13px;}
  .period-label{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:18px;}
  .period-label b{color:var(--accent);}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px;}
  .kpi{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px;}
  .kpi .k-label{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .kpi .k-now{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;}
  .kpi .k-was{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:7px;}
  .delta{display:inline-flex;gap:3px;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px;margin-top:9px;}
  .delta.good{color:var(--up);background:var(--up-soft);}.delta.bad{color:var(--down);background:var(--down-soft);}
  h2.sec{font-size:17px;font-weight:700;margin:32px 0 14px;}
  .funnel{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:22px;}
  .stage{margin-bottom:16px;}.stage:last-child{margin-bottom:0;}
  .stage-top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;}
  .stage-name{font-weight:600;}.stage-conv{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .stage-conv b{color:var(--accent);}.stage-conv .w{color:var(--down);}
  .bars{display:grid;gap:4px;}
  .bar-row{display:flex;align-items:center;gap:10px;}.bar-tag{width:22px;font-size:11px;color:var(--muted);text-align:right;}
  .bar-track{flex:1;background:var(--paper);border-radius:6px;height:24px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-family:var(--mono);font-size:12px;min-width:56px;transition:width .8s ease;}
  .bar-fill.b{background:var(--ghost);color:var(--ink);}.bar-fill.a{background:var(--accent);}
  .pages{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .page{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px;}
  .page-name{font-size:14px;font-weight:700;margin-bottom:12px;}
  .m-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 0;border-top:1px solid var(--hair);align-items:center;}
  .m-row:first-of-type{border-top:none;}.m-label{font-size:13px;}
  .m-vals{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;}.m-vals b{color:var(--ink);}
  .m-delta{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right;min-width:52px;}
  .m-delta.good{color:var(--up);}.m-delta.bad{color:var(--down);}
  table.slot{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-bottom:8px;}
  table.slot th,table.slot td{text-align:left;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--hair);}
  table.slot th{background:var(--paper);color:var(--muted);font-weight:600;font-size:12px;}
  table.slot td.num{font-family:var(--mono);text-align:right;}
  table.slot a{color:var(--accent);text-decoration:none;word-break:break-all;}
  .slot-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .soon-box{background:var(--surface);border:1px dashed var(--hair);border-radius:14px;padding:50px 20px;text-align:center;color:var(--muted);}
  .soon-box b{color:var(--ink);}
  .section-title{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--accent);}
  .section-title .badge{font-size:11px;color:var(--muted);font-weight:400;}
  
  .chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .mini-chart{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:14px;}
  .mini-head{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .mini-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .mini-total{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);}
  @media(max-width:820px){.chart-grid{grid-template-columns:1fr;}}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr);}.pages,.slot-cols{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-rule"></div>
  <p class="eyebrow">PrintBakery</p>
  <h1>Product Dashboard</h1>
  <p class="sub">GA4 · cafe24 기반 상시 성과 트래킹</p>

  <div class="tabs" id="tabs"></div>

  <div class="controls">
    <div class="ctrl"><label>기간</label><div class="pair">
      <input type="date" id="s"><span>~</span><input type="date" id="e"></div></div>
    <label class="excl"><input type="checkbox" id="cmp"> 이전 기간과 비교</label>
    <div class="ctrl" id="cmpBox" style="display:none;"><label>비교 대상(이전) 기간</label><div class="pair">
      <span class="seg b">비교</span><input type="date" id="cs"><span>~</span><input type="date" id="ce"></div></div>
    <label class="excl"><input type="checkbox" id="exclLpoint"> L포인트 제외</label>
    <button class="go" id="go">조회</button>
    <div class="ctrl" style="flex-basis:100%;"><label>빠른 선택</label><div class="preset-btns" id="presets"></div></div>
  </div>

  <div id="content"><div class="state"><div class="spinner"></div>데이터 불러오는 중…</div></div>
</div>

<script>
const WORKER="https://proud-sea-35f9.sugim-386.workers.dev";
const $=(id)=>document.getElementById(id);
const nf=new Intl.NumberFormat('ko-KR');
const fmt=(v)=>nf.format(Math.round(v||0));
const delta=(b,a)=>{const p=b===0?0:((a-b)/b*100);return{text:(p>0?'+':'')+p.toFixed(1)+'%',good:a>=b};};

const TABS=[
  {id:'overview',name:'개요',ready:true},
  {id:'acquisition',name:'획득',ready:true},
  {id:'funnel',name:'퍼널·페이지',ready:true},
  {id:'product',name:'상품·슬롯',ready:true},
  {id:'slotperf',name:'구좌 성과',ready:true},
  {id:'revenue',name:'매출',ready:true},
];
let TAB='overview';
$('tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.id===TAB?'active':''}" data-tab="${t.id}">${t.name}${t.ready?'':'<span class="soon">준비중</span>'}</button>`).join('');
$('tabs').addEventListener('click',(e)=>{const b=e.target.closest('.tab');if(!b)return;
  TAB=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===TAB));load();});

function iso(d){return d.toISOString().slice(0,10);}
function addDays(base,n){const d=new Date(base);d.setDate(d.getDate()+n);return d;}
function setRange(s0,e0){$('s').value=s0;$('e').value=e0;}
function autoCompare(){
  const s0=new Date($('s').value), e0=new Date($('e').value);
  const days=Math.round((e0-s0)/86400000)+1;
  const ce=addDays(s0,-1), cs=addDays(ce,-(days-1));
  $('cs').value=iso(cs); $('ce').value=iso(ce);
}
{ const y=iso(addDays(new Date(),-1)); setRange(y,y); }

const PRESETS=[
  {label:'어제',fn:()=>{const y=iso(addDays(new Date(),-1));setRange(y,y);}},
  {label:'최근 7일',fn:()=>{const y=addDays(new Date(),-1);setRange(iso(addDays(y,-6)),iso(y));}},
  {label:'최근 28일',fn:()=>{const y=addDays(new Date(),-1);setRange(iso(addDays(y,-27)),iso(y));}},
  {label:'이번달',fn:()=>{const n=new Date();setRange(iso(new Date(n.getFullYear(),n.getMonth(),1)),iso(addDays(new Date(),-1)));}},
];
$('presets').innerHTML=PRESETS.map((p,i)=>`<button data-i="${i}">${p.label}</button>`).join('');
$('presets').addEventListener('click',(e)=>{const i=e.target.dataset.i;if(i!=null){PRESETS[i].fn();if($('cmp').checked)autoCompare();load();}});
$('cmp').addEventListener('change',()=>{
  const on=$('cmp').checked; $('cmpBox').style.display=on?'flex':'none';
  if(on) autoCompare();
  load();
});
$('exclLpoint').addEventListener('change',load);
$('go').addEventListener('click',load);

function q(extra){
  const cmp=$('cmp').checked;
  const as=$('s').value, ae=$('e').value;
  const bs=cmp?$('cs').value:as, be=cmp?$('ce').value:ae;
  let s=`bs=${bs}&be=${be}&as=${as}&ae=${ae}`;
  if($('exclLpoint').checked)s+='&excl=lpoint,lotte,l.point';
  if(extra)s+='&'+extra;
  return s;
}
function showLoading(){$('content').innerHTML='<div class="state"><div class="spinner"></div>데이터 불러오는 중…</div>';}
function showErr(m){$('content').innerHTML=`<div class="err">데이터를 불러오지 못했습니다.<br>${m}<br><br>잠시 후 [조회]를 다시 눌러보세요.</div>`;}
function periodLabel(d){
  if($('cmp').checked) return `<div class="period-label">비교 기간 &nbsp; <b>이전</b> ${d.periodBefore} &nbsp;→&nbsp; <b>선택</b> ${d.periodAfter}</div>`;
  return `<div class="period-label">기간 &nbsp; <b>${d.periodAfter}</b></div>`;
}

async function load(){
  const cur=TABS.find(t=>t.id===TAB);
  if(cur && !cur.ready){$('content').innerHTML=`<div class="soon-box"><b>${cur.name}</b> 탭은 준비 중입니다.<br>다음 단계에서 추가됩니다.</div>`;return;}
  if(TAB==='revenue'){ await loadRevenue(); return; }
  showLoading();
  try{
    const tabParam=(TAB==='product')?'&tab=slots':(TAB==='slotperf')?'&tab=slotperf':(TAB==='acquisition')?'&tab=acquisition':'';
    const r=await fetch(WORKER+'/?'+q()+tabParam);
    const d=await r.json();
    if(d.error){showErr(d.error);return;}
    if(TAB==='acquisition')renderAcquisition(d);
    else if(TAB==='slotperf')renderSlotPerf(d);
    else if(TAB==='product')renderProduct(d);
    else if(TAB==='funnel')renderFunnel(d);
    else await renderOverview(d);
  }catch(e){showErr(String(e));}
}

function kpiHTML(kpis){return '<div class="kpis">'+kpis.map(k=>{const x=delta(k.before,k.after);
  return `<div class="kpi"><div class="k-label">${k.label}</div><div class="k-now">${fmt(k.after)}</div>
  <div class="delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${x.text}</div><div class="k-was">${$('cmp').checked?'이전: '+fmt(k.before):''}</div></div>`;}).join('')+'</div>';}

async function renderOverview(d){
  let h=periodLabel(d);
  h+='<h2 class="sec">핵심 지표</h2>'+kpiHTML(d.kpis);
  h+='<h2 class="sec">일별 추이</h2><div id="chartWrap" class="funnel"><div class="state"><div class="spinner"></div>추이 불러오는 중…</div></div>';
  $('content').innerHTML=h;
  try{
    const r=await fetch(WORKER+'/?'+q()+'&tab=daily');
    const dd=await r.json();
    if(dd.daily && dd.daily.length) drawChart(dd.daily);
    else document.getElementById('chartWrap').innerHTML='<div class="state">추이 데이터 없음</div>';
  }catch(e){ document.getElementById('chartWrap').innerHTML='<div class="state">추이를 불러오지 못했습니다</div>'; }
}

const SERIES=[
  {key:'sessions',label:'세션',color:'#0E7C6E'},
  {key:'first_visit',label:'신규 방문',color:'#2B7DB8'},
  {key:'view_detail',label:'상품 조회',color:'#C8993F'},
  {key:'add_to_cart',label:'장바구니 담기',color:'#C85A3F'},
  {key:'purchase',label:'구매',color:'#7A3FC8'},
];
function drawChart(daily){
  const wrap=document.getElementById('chartWrap');
  wrap.innerHTML='<div class="chart-grid" id="chartGrid"></div>';
  const grid=document.getElementById('chartGrid');
  grid.innerHTML=SERIES.map(s=>{
    const total=daily.reduce((a,d)=>a+(d[s.key]||0),0);
    return `<div class="mini-chart"><div class="mini-head"><span class="mini-dot" style="background:${s.color}"></span>${s.label}
      <span class="mini-total">${fmt(total)}</span></div><div id="mini-${s.key}"></div></div>`;
  }).join('');
  SERIES.forEach(s=>renderMini(s,daily));
}
function renderMini(s,daily){
  const box=document.getElementById('mini-'+s.key); if(!box) return;
  const W=260,H=90,pad=8;
  const vals=daily.map(d=>d[s.key]||0);
  const max=Math.max(...vals,1);
  const x=(i)=>pad+(W-pad*2)*(daily.length<=1?0.5:i/(daily.length-1));
  const y=(v)=>H-pad-(H-pad*2)*(v/max);
  let path=daily.map((d,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(d[s.key]||0).toFixed(1)}`).join(' ');
  let area=path+` L${x(daily.length-1).toFixed(1)},${H-pad} L${x(0).toFixed(1)},${H-pad} Z`;
  const first=daily[0].date.slice(4,6)+'/'+daily[0].date.slice(6,8);
  const last=daily[daily.length-1].date.slice(4,6)+'/'+daily[daily.length-1].date.slice(6,8);
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;">
    <path d="${area}" fill="${s.color}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>
    <text x="${pad}" y="${H-2}" font-size="9" fill="#66768A" font-family="var(--mono)">${first}</text>
    <text x="${W-pad}" y="${H-2}" font-size="9" fill="#66768A" font-family="var(--mono)" text-anchor="end">${last}</text>
  </svg>`;
}

function renderFunnel(d){
  let h=periodLabel(d);
  h+='<h2 class="sec">구매 전환 퍼널</h2><div class="funnel">';
  const tB=d.funnel[0].before,tA=d.funnel[0].after;
  h+=d.funnel.map((s,i)=>{const p=d.funnel[i-1];
    const cB=p?(s.before/p.before*100):100,cA=p?(s.after/p.after*100):100,dd=p?cA-cB:0,cls=dd<0?'w':'';
    const conv=p?`<span class="stage-conv">통과율 ${cB.toFixed(1)}% → <b class="${cls}">${cA.toFixed(1)}%</b> <span class="${cls}">(${dd>=0?'+':''}${dd.toFixed(1)}%p)</span></span>`:`<span class="stage-conv">유입 100%</span>`;
    return `<div class="stage"><div class="stage-top"><span class="stage-name">${s.name}</span>${conv}</div><div class="bars">
      <div class="bar-row"><span class="bar-tag">전</span><div class="bar-track"><div class="bar-fill b" style="width:${Math.max(s.before/tB*100,7)}%">${fmt(s.before)}</div></div></div>
      <div class="bar-row"><span class="bar-tag">후</span><div class="bar-track"><div class="bar-fill a" style="width:${Math.max(s.after/tA*100,7)}%">${fmt(s.after)}</div></div></div>
    </div></div>`;}).join('')+'</div>';
  h+='<h2 class="sec">페이지별 트래픽</h2><div class="pages">'+d.pages.map(pg=>{
    const rows=pg.metrics.map(m=>{const x=delta(m.before,m.after);
      return `<div class="m-row"><span class="m-label">${m.label}</span><span class="m-vals">${fmt(m.before)} → <b>${fmt(m.after)}</b></span>
      <span class="m-delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${x.text}</span></div>`;}).join('');
    return `<div class="page"><div class="page-name">${pg.name}</div>${rows}</div>`;}).join('')+'</div>';
  $('content').innerHTML=h;
}

function destLabel(x){
  if(x.name) return `<a href="https://printbakery.com${x.path}" target="_blank">${x.name}</a>`+(x.product_no?` <span style="color:var(--muted);font-size:11px;">#${x.product_no}</span>`:'');
  let t=x.path;
  if(/\/promotion\//.test(t)) t='프로모션 상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/\/artist\//.test(t)) t='아티스트 상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/\/product\/detail/.test(t)) t='상품'+(x.product_no?` #${x.product_no}`:'');
  else if(/list\.html/.test(t)){const m=t.match(/cate_no=(\d+)/);t='카테고리 목록'+(m?` (${m[1]})`:'');}
  return `<a href="https://printbakery.com${x.path}" target="_blank">${t}</a>`;
}
function slotTable(list){
  if(!list||!list.length)return '<div class="state">이동 데이터 없음</div>';
  const tot=list.reduce((s,x)=>s+x.sessions,0);
  return '<table class="slot"><tr><th>순위</th><th>목적지</th><th style="text-align:right;">이동</th><th style="text-align:right;">비중</th></tr>'+
    list.map((x,i)=>`<tr><td class="num">${i+1}</td><td>${destLabel(x)}</td><td class="num">${fmt(x.sessions)}</td><td class="num">${tot?(x.sessions/tot*100).toFixed(1):0}%</td></tr>`).join('')+'</table>';
}
function renderProduct(d){
  let h=periodLabel(d);
  h+='<p style="font-size:13px;color:var(--muted);margin:0 0 18px;">각 메인(art·life)에서 클릭해 넘어간 목적지를 이동 세션 많은 순으로.</p>';
  ['art.html','life.html'].forEach(k=>{const s=d.slots[k]||{};
    h+=`<h2 class="sec">${k} 메인에서의 이동 (상위 30)</h2>`;
    h+=`<div class="slot-cols"><div>${slotTable(s.before)}</div><div>${slotTable(s.after)}</div></div>`;});
  $('content').innerHTML=h;
}

function fmtDwell(sec){ if(!sec) return '-'; const m=Math.floor(sec/60),x=sec%60; return m>0?`${m}:${String(x).padStart(2,'0')}`:`${x}초`; }
function sectionTable(rows){
  const sorted=[...rows].sort((a,b)=>b.after.sessions-a.after.sessions);
  const tot=sorted.reduce((s,x)=>s+x.after.sessions,0)||1;
  return '<table class="slot"><tr><th>구좌명</th><th>노출</th><th style="text-align:right;">유입(세션)</th><th style="text-align:right;">비중</th><th style="text-align:right;">체류시간</th></tr>'+
    sorted.map(r=>`<tr><td>${r.name}</td><td class="num">${r.order}번</td><td class="num">${fmt(r.after.sessions)}</td>
      <td class="num">${(r.after.sessions/tot*100).toFixed(1)}%</td><td class="num">${fmtDwell(r.after.dwell)}</td></tr>`).join('')+'</table>';
}
function renderSlotPerf(d){
  let h=`<div class="period-label">기준 기간 &nbsp; <b>${d.periodAfter}</b> &nbsp;<span style="color:var(--muted)">· 구좌는 수시로 바뀌어 선택 기간 성과만 표시</span></div>`;
  ['art','life'].forEach(tab=>{
    const rows=(d.slotperf[tab]||[]);
    const order=[]; const groups={};
    rows.forEach(r=>{ const sec=r.section||'기타'; if(!groups[sec]){groups[sec]=[];order.push(sec);} groups[sec].push(r); });
    h+=`<h2 class="sec">${tab.toUpperCase()} 메인 · 섹션별 구좌 성과</h2>`;
    order.forEach(sec=>{
      const badge = sec==='글로벌네비' ? ' <span class="badge">(공통 메뉴)</span>':'';
      h+=`<div class="section-title">${sec}${badge}</div>`+sectionTable(groups[sec]);
    });
  });
  $('content').innerHTML=h;
}

function rankTable(rows,label){
  const tot=rows.reduce((s,x)=>s+x.sessions,0)||1;
  return '<table class="slot"><tr><th>'+label+'</th><th style="text-align:right;">세션</th><th style="text-align:right;">비중</th></tr>'+
    rows.map(x=>`<tr><td>${x.name}</td><td class="num">${fmt(x.sessions)}</td><td class="num">${x.share.toFixed(1)}%</td></tr>`).join('')+'</table>';
}
function renderAcquisition(d){
  let h=`<div class="period-label">기간 &nbsp; <b>${d.periodAfter}</b></div>`;
  h+='<h2 class="sec">유입 소스별</h2>'+rankTable(d.acquisition.bySource,'소스 / 매체');
  h+='<h2 class="sec">디바이스별</h2>'+rankTable(d.acquisition.byDevice,'디바이스');
  $('content').innerHTML=h;
}

function won(v){ return fmt(v)+'원'; }
let REVENUE_CACHE=null;
async function loadRevenue(){
  showLoading();
  try{
    if(!REVENUE_CACHE){
      const r=await fetch('./revenue-daily.json');
      REVENUE_CACHE=await r.json();
    }
    const daily=REVENUE_CACHE.daily||[];
    const inRange=(d,s0,e0)=>d>=s0 && d<=e0;
    const sumRange=(s0,e0)=>{
      const rows=daily.filter(d=>inRange(d.date,s0,e0));
      const agg={gmv:0,net:0,count:0,refund:0,items:{}};
      rows.forEach(r=>{
        agg.gmv+=r.gmv; agg.net+=r.net; agg.count+=r.count; agg.refund+=r.refund;
        (r.topItems||[]).forEach(it=>{
          const k=it.product_no;
          if(!agg.items[k]) agg.items[k]={name:it.name,amt:0,qty:0};
          agg.items[k].amt+=it.amt; agg.items[k].qty+=it.qty;
        });
      });
      agg.aov = agg.count? Math.round(agg.net/agg.count):0;
      agg.topItems = Object.values(agg.items).sort((a,b)=>b.amt-a.amt).slice(0,5);
      return agg;
    };
    const as=$('s').value, ae=$('e').value;
    const after=sumRange(as,ae);
    const before = $('cmp').checked ? sumRange($('cs').value,$('ce').value) : after;
    renderRevenue({periodAfter:`${as} ~ ${ae}`, revenue:{before,after}});
  }catch(e){
    showErr('매출 데이터를 불러오지 못했습니다.<br><span style="font-size:12px;">레포에 revenue-daily.json 파일이 있는지 확인해주세요.</span>');
  }
}
function renderRevenue(d){
  let h=periodLabel(d);
  const b=d.revenue.before, a=d.revenue.after;
  const rows=[
    {label:'거래액(GMV)',b:b.gmv,a:a.gmv},
    {label:'매출총액',b:b.net,a:a.net},
    {label:'주문 건수',b:b.count,a:a.count},
    {label:'객단가',b:b.aov,a:a.aov},
    {label:'환불액',b:b.refund,a:a.refund},
  ];
  h+='<div class="kpis">'+rows.map(r=>{const x=delta(r.b,r.a);
    return `<div class="kpi"><div class="k-label">${r.label}</div><div class="k-now">${won(r.a)}</div>
    <div class="delta ${x.good?'good':'bad'}">${x.good?'▲':'▼'} ${x.text}</div><div class="k-was">${$('cmp').checked?'이전: '+won(r.b):''}</div></div>`;}).join('')+'</div>';
  h+='<h2 class="sec">판매 TOP 5 (선택 기간)</h2><table class="slot"><tr><th>상품명</th><th style="text-align:right;">판매액</th><th style="text-align:right;">수량</th></tr>'+
    (a.topItems.length? a.topItems.map(it=>`<tr><td>${it.name}</td><td class="num">${won(it.amt)}</td><td class="num">${it.qty}개</td></tr>`).join('') : '<tr><td colspan="3" style="text-align:center;color:var(--muted);">데이터 없음</td></tr>')+'</table>';
  $('content').innerHTML=h;
}

load();
</script>
