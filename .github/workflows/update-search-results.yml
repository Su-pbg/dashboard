name: update-search-results
# ⚠ 우리 서비스 API(api.printbakery.com)를 부른다. 상위 100개만, 초당 1회. 전수 금지.

# 몰 검색어별 실제 검색 결과 수를 센다.
# 워커로 하면 서브요청 한도(무료 50)에 걸려 상위 24개밖에 못 본다 → 여기서 배치로 전부 돌린다.
on:
  schedule:
    - cron: '20 21 * * *'    # 매일 KST 06:20 (update-data 06:00 다음)
  workflow_dispatch:
    inputs:
      max:
        description: '확인할 검색어 수 (광고제외 세션 많은 순)'
        default: '100'
      min:
        description: '이 세션 수 미만은 건너뜀'
        default: '5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Count search results
        env:
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
        run: node scripts/check-search-results.mjs --max "${{ github.event.inputs.max || '100' }}" --min "${{ github.event.inputs.min || '5' }}"

      - name: Commit search-results.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add search-results.json
          git diff --staged --quiet || git commit -m "chore: update search-results.json"
          git push
