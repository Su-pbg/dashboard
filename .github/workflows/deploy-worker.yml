name: deploy-worker
# Cloudflare 워커(proud-sea-35f9) 배포. worker.js · wrangler.jsonc 가 main 에 올라가면 자동으로 돈다.
#
# [2026-10-29] 로컬 배포가 막혀서 만들었다 — Mac mini 의 Claude Code 세션이 `npx wrangler deploy` 를
#   "프로덕션 배포" 로 거부한다(권한 분류기, 사용자 의도로도 안 풀린다). 클라우드 세션은 Cloudflare 가
#   네트워크로 막혀 있다. 그래서 배포는 여기서 한다. 커밋 → 푸시가 곧 배포다.
#
# 시크릿(GitHub Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   필수. Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" 템플릿
#   CLOUDFLARE_ACCOUNT_ID  선택. 토큰이 계정 하나에만 걸려 있으면 wrangler 가 알아서 찾는다.
#                          "More than one account available" 가 뜨면 Workers & Pages 화면 오른쪽의 Account ID 를 넣는다
# 워커 시크릿(DASHBOARD_KEY·DASH_PW·CAFE24_*·GA_SA_KEY …)은 wrangler deploy 가 건드리지 않는다.
# no_bundle: true 라 worker.js 를 그대로 올린다 — 맨 위 __defProp/__name 두 줄을 지우면 안 된다.

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.jsonc
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Syntax check (bundled file, no rebuild)
        run: node --check worker.js
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 없다. GitHub Settings → Secrets → Actions 에 넣어라."; exit 1
          fi
          npx wrangler deploy
