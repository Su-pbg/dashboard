# 총 회원 수 일별 수집.
#
# 원래 slackbot 레포의 snapshot_new_members.py 가 하던 일인데 2026-07-31 이후 멈췄다.
# 워커의 tab=membercount 가 cafe24 조회를 대신해 주므로, 여기서는 그 결과를
# revenue-daily.json 에 받아 적기만 한다 → cafe24 자격증명이 필요 없다.
#
# 입력을 비워두면 **빠진 날을 스스로 찾아 메운다** (마지막 기록 다음날 ~ 어제).
# 수집이 며칠 멈춰도 다음 실행이 알아서 복구하므로, 사람이 백필 버튼을 누를 일이 없다.
# 한 번에 최대 62일까지만 처리하고 나머지는 다음 실행으로 넘긴다.

name: update-members

on:
  schedule:
    - cron: '13 22 * * *'    # KST 07:13 — 매출 수집(06:2x)이 그날 행을 만든 뒤에 돈다
  workflow_dispatch:
    inputs:
      target_date:
        description: '특정 날짜만 (YYYY-MM-DD). 보통은 비워두면 됩니다'
        required: false
        default: ''
      from:
        description: '구간 시작 (YYYY-MM-DD). 비우면 빠진 날을 자동으로 찾아 메웁니다'
        required: false
        default: ''
      to:
        description: '구간 끝 (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # 같은 파일을 쓰는 작업이 겹치지 않게
  group: revenue-daily-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 회원 수 조회 후 기록
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          FROM: ${{ github.event.inputs.from }}
          TO:   ${{ github.event.inputs.to }}
        run: node scripts/update-members.mjs

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add revenue-daily.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: snapshot total members"
          # 매출 수집이 같은 파일을 밀었을 수 있으니 rebase 후 푸시
          git pull --rebase --autostash
          git push
